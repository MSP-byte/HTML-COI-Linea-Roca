name: H10 Finalize Once

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow

permissions:
  contents: write

jobs:
  apply-final-review-fixes:
    if: "github.event.head_commit.message == 'ci(h10): run final review patch'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rama H10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar blobs exactos del HEAD revisado
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "e3ef0d2fee3efaeef19f4a573fad8a2ade3870f3"
          test "$(git hash-object tests/h10_routing_cierre_archivo.spec.js)" = "fef41096047167c792128bfbdf2a08ad835373cb"

      - name: Aplicar parche final H10
        shell: bash
        run: |
          git apply --check .github/h10-final-index.patch
          git apply .github/h10-final-index.patch
          git apply --check .github/h10-final-tests.patch
          git apply .github/h10-final-tests.patch
          git rm .github/h10-final-index.patch .github/h10-final-tests.patch
          git diff --check
          node --check tests/h10_routing_cierre_archivo.spec.js

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Ejecutar controles estaticos y de regresion
        run: npm test

      - name: Publicar correcciones en la misma rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/h10_routing_cierre_archivo.spec.js
          git commit -m "fix(h10): close remaining PR64 review gaps"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
