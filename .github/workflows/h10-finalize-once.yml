name: H10 Finalize Once

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-finalize-once.yml

permissions:
  contents: write

jobs:
  apply-final-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "65ecdbd58567df84e9fa415b50851577ee45e80d"

      - name: Apply H10 final routing and regression patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
          """  let aplicando = false;      // el router esta imponiendo una ruta
            let restaurando = false;    // preserva el hash inicial mientras espera datos
            let silencio = 0;           // hashchange que causamos nosotros
            let pendiente = null;
          """,
          """  let aplicando = false;      // el router esta imponiendo una ruta
            let restaurando = false;    // preserva el hash inicial mientras espera datos
            let navegacionUsuario = 0;  // version independiente: una accion real del operador gana al startup
            let silencio = 0;           // hashchange que causamos nosotros
            let pendiente = null;
          """, 'router state')

          replace_once(
          """  function programarRefresco(opciones) {
              clearTimeout(pendiente);
              pendiente = setTimeout(() => { try { refrescarHash(opciones); } catch (e) {} }, 45);
            }

            // ---------------------------------------------------------- datos listos
          """,
          """  function programarRefresco(opciones) {
              clearTimeout(pendiente);
              pendiente = setTimeout(() => { try { refrescarHash(opciones); } catch (e) {} }, 45);
            }

            // Durante restaurar() no alcanza con mirar location.hash: los repintados
            // automaticos deben quedar silenciados, pero una navegacion REAL del operador
            // tiene que ganar aunque el hash inicial siga temporalmente en la barra.
            //
            // Se observa el resultado visible de un click/change confiable. Si la ruta
            // que describe la pantalla cambia, se registra una nueva version de intencion
            // de usuario y se publica esa ruta directamente. publicar() silencia su propio
            // hashchange, de modo que no hay reentrada; restaurar() detecta la version y
            // descarta el deep-link capturado al inicio.
            function observarNavegacionUsuario(ev) {
              if (!restaurando || !ev || ev.isTrusted !== true) return;
              const antes = rutaVigente();
              let resuelta = false;
              const verificar = () => {
                if (resuelta || !restaurando) return;
                const despues = rutaVigente();
                if (!despues || despues === antes) return;
                resuelta = true;
                navegacionUsuario++;
                publicar(despues);
              };
              // La mayoria de los botones cambia vista en el mismo dispatch; algunas
              // capas V2 sincronizan despues. Se cubren ambos sin convertir un simple
              // click sin navegacion en cancelacion del restore.
              setTimeout(verificar, 0);
              setTimeout(verificar, 90);
              setTimeout(verificar, 220);
            }

            // ---------------------------------------------------------- datos listos
          """, 'user navigation observer')

          replace_once(
          """      const inicial = hashActual();
                if (!inicial) {
          """,
          """      const inicial = hashActual();
                const versionUsuarioInicial = navegacionUsuario;
                if (!inicial) {
          """, 'restore user version')

          replace_once(
          """      const listo = await esperarArranque();
                // esperarArranque() es asincrono. Si durante esa espera el operador ya
                // navego, la ruta capturada al inicio quedo obsoleta y NO puede volver a
                // imponerse sobre su accion mas reciente.
                if (hashActual() !== inicial) return;
          """,
          """      const listo = await esperarArranque();
                // esperarArranque() es asincrono. Si durante esa espera el operador ya
                // navego, la ruta capturada al inicio quedo obsoleta y NO puede volver a
                // imponerse sobre su accion mas reciente. La version de usuario es
                // independiente del hash: cubre justamente el intervalo en que los
                // refrescos automaticos estan suspendidos por restaurando=true.
                if (navegacionUsuario !== versionUsuarioInicial) return;
                if (hashActual() !== inicial) return;
          """, 'restore stale guard')

          replace_once(
          """      await aplicar(inicial);
                for (const ms of [700, 1800]) {
                  await dormir(ms);
                  await reafirmar(inicial);
                }
          """,
          """      await aplicar(inicial);
                for (const ms of [700, 1800]) {
                  await dormir(ms);
                  if (navegacionUsuario !== versionUsuarioInicial) return;
                  await reafirmar(inicial);
                }
          """, 'reaffirm user guard')

          replace_once(
          """  if (!window.__COI_H10_ROUTER_BOUND__) {
              window.__COI_H10_ROUTER_BOUND__ = true;

              window.addEventListener('hashchange', () => {
          """,
          """  if (!window.__COI_H10_ROUTER_BOUND__) {
              window.__COI_H10_ROUTER_BOUND__ = true;

              // Captura solo interacciones reales del operador. Los MutationObserver,
              // temporizadores y repintados programaticos no son eventos trusted y no
              // pueden cancelar una restauracion valida.
              document.addEventListener('click', observarNavegacionUsuario, true);
              document.addEventListener('change', observarNavegacionUsuario, true);

              window.addEventListener('hashchange', () => {
          """, 'bind trusted navigation')

          p.write_text(text, encoding='utf-8')

          tp = Path('tests/h10_routing_cierre_archivo.spec.js')
          t = tp.read_text(encoding='utf-8')

          def treplace(old, new, label):
              global t
              if t.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {t.count(old)}')
              t = t.replace(old, new, 1)

          treplace(
          """  expect(intentos).toHaveLength(1);
            expect(intentos[0]).toHaveProperty('estado_coi', 'Cerrada');
            expect(intentos[0]).toHaveProperty('fecha_cierre_operativo');
            expect(intentos[0]).toHaveProperty('observacion_cierre', 'Cierre operativo de prueba');
            expect(intentos[0]).not.toHaveProperty('estado_registro');
          """,
          """  expect(intentos).toHaveLength(1);
            // El repositorio normaliza el patch contra la fila remota que acaba de leer.
            // Si otro operador ya puso estado_coi='Cerrada', ese campo redundante puede
            // desaparecer antes de llamar al RPC. Lo que importa es que el intento de
            // cambiar la auditoria llegue al guard server-side y sea rechazado.
            expect(intentos[0]).toHaveProperty('fecha_cierre_operativo');
            expect(intentos[0]).toHaveProperty('observacion_cierre', 'Cierre operativo de prueba');
            expect(intentos[0]).not.toHaveProperty('estado_registro');
            if (Object.prototype.hasOwnProperty.call(intentos[0], 'estado_coi')) {
              expect(intentos[0].estado_coi).toBe('Cerrada');
            }
          """, 'H10-57 expectation')

          treplace(
          """  await page.click('#btnOrdenes');
            await page.waitForTimeout(1800);
          """,
          """  // El shell V2 oculta los botones legacy de #moduleNav; navegar por el
            // entry point ordinario evita que el test dependa de un control de respaldo
            // deliberadamente no visible y sigue cubriendo la limpieza de rutaError.
            await page.evaluate(() => window.mostrarVista('vistaOrdenes'));
            await page.waitForTimeout(1800);
          """, 'H10-60 navigation')

          anchor = """test('H10-61 · P2 · el arranque lento no reabre la ruta inicial después de que el operador navegó', async ({ page }) => {
            await prepararH10(page, { fallaOrdenes: true });
            await page.goto('/index.html#ficha-oc/' + OC_ACTIVA.nro_oc, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.COI_ROUTING_H10), null, { timeout: 20000 });

            // Mientras restaurar() espera el snapshot de Órdenes, el operador sale a Red.
            await page.evaluate(() => { location.hash = '#red'; });
            await page.waitForTimeout(7500);

            const e = await estadoRuta(page);
            expect(e.hash).toBe('#red');
            expect(e.vista).toBe('vistaRed');
            expect(e.errorCatalogo).toBe(false);
          });
          """
          addition = anchor + """
          // ---------------------------------------------------------------- P2 · navegación real durante restauración

          test('H10-70 · P2 · un click real del sidebar durante startup gana al deep-link inicial', async ({ page }) => {
            await prepararH10(page, { fallaOrdenes: true });
            await page.goto('/index.html#ficha-oc/' + OC_ACTIVA.nro_oc, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.COI_ROUTING_H10), null, { timeout: 20000 });
            await page.waitForSelector('[data-v2-nav="btnRed"]', { state: 'visible', timeout: 12000 });

            // Este es el caso que no cubría H10-61: el operador NO toca location.hash;
            // usa la navegación real. El guard de restauración no debe tragarse su click.
            await page.click('[data-v2-nav="btnRed"]');
            await page.waitForTimeout(7500);

            const e = await estadoRuta(page);
            expect(e.hash).toBe('#red');
            expect(e.vista).toBe('vistaRed');
            expect(e.errorCatalogo).toBe(false);
          });
          """
          if t.count(anchor) != 1:
              raise SystemExit(f'H10-70 anchor: expected one match, got {t.count(anchor)}')
          t = t.replace(anchor, addition, 1)
          tp.write_text(t, encoding='utf-8')

      - name: Syntax-check final patch
        shell: bash
        run: |
          node --check tests/h10_routing_cierre_archivo.spec.js
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="coi-h10-routing-hash">\s*(.*?)\s*</script>', text, re.S)
          if not m:
              raise SystemExit('H10 router script not found')
          Path('/tmp/h10-router.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/h10-router.js

      - name: Commit final fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/h10-finalize-once.yml
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add index.html tests/h10_routing_cierre_archivo.spec.js .github/workflows/h10-finalize-once.yml
          git diff --cached --check
          git commit -m "fix(h10): preserve operator navigation during startup"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
