name: Privacy contract refresh (one-shot)

on:
  push:
    branches:
      - hardening/supabase-privacy-20260911

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-contract-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/supabase-privacy-20260911
          fetch-depth: 0
      - name: Reconciliar fixture con PROD endurecido
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('tests/fixtures/production_schema_contract.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def upsert_policy(table, policy):
              policies = data[table].setdefault('policies', [])
              policies[:] = [p for p in policies if p.get('nombre') != policy['nombre']]
              policies.append(policy)

          roles_rw_alertas = "(coi_current_role() = ANY (ARRAY['administrador'::text, 'jefatura'::text, 'editor'::text, 'planificacion'::text, 'control'::text, 'supervisor'::text]))"
          roles_rw_obs = "(coi_current_role() = ANY (ARRAY['administrador'::text, 'jefatura'::text, 'editor'::text, 'planificacion'::text, 'control'::text, 'supervisor'::text, 'inspector'::text]))"

          for policy in [
              {'nombre':'coi_alertas_select_guard_privacy','cmd':'SELECT','roles':['authenticated'],'permissive':False,'using':'(coi_current_role() IS NOT NULL)','with_check':None},
              {'nombre':'coi_alertas_insert_guard_privacy','cmd':'INSERT','roles':['authenticated'],'permissive':False,'using':None,'with_check':roles_rw_alertas},
              {'nombre':'coi_alertas_update_guard_privacy','cmd':'UPDATE','roles':['authenticated'],'permissive':False,'using':roles_rw_alertas,'with_check':roles_rw_alertas},
          ]:
              upsert_policy('coi_alertas', policy)

          for policy in [
              {'nombre':'coi_observaciones_select_guard_privacy','cmd':'SELECT','roles':['authenticated'],'permissive':False,'using':'(coi_current_role() IS NOT NULL)','with_check':None},
              {'nombre':'coi_observaciones_insert_guard_privacy','cmd':'INSERT','roles':['authenticated'],'permissive':False,'using':None,'with_check':roles_rw_obs},
              {'nombre':'coi_observaciones_update_guard_privacy','cmd':'UPDATE','roles':['authenticated'],'permissive':False,'using':roles_rw_obs,'with_check':roles_rw_obs},
          ]:
              upsert_policy('coi_observaciones_oc', policy)

          pending = data.get('_divergencias_pendientes', {})
          pending['_doc_objetos_h11'] = (
              'Objetos H11 ya aplicados en STAGING y PRODUCCION el 2026-09-11. '
              'Se conserva el registro bajo objetos_h11 por compatibilidad del contrato, '
              'pero produccion y repo deben figurar ambos como presente.'
          )
          for item in pending.get('objetos_h11', []):
              item['produccion'] = 'presente'
              item['repo'] = 'presente'
              item['aplicada_en_remoto'] = '2026-09-11'

          data['_doc'] = (
              'Snapshot de information_schema y pg_catalog de PRODUCCION, reconciliado con STAGING. '
              'Actualizado 2026-09-11 tras hardening de privacidad Supabase. '
              'nn=NOT NULL, def=fragmento esperado del default, gen=generated always stored, '
              'tipo=fragmento de data_type. fk=[columna, tabla_destino, accion ON DELETE].'
          )

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/production_schema_contract.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "test: reconcile privacy contract with production [privacy-contract-bot]"
          git push origin HEAD:hardening/supabase-privacy-20260911
