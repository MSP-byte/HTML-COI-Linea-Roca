name: Apply alerts P2 fixes

on:
  push:
    branches: [fix/alerts-collapsible-init]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alerts-collapsible-init
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused P2 patch
        run: python3 .github/scripts/apply_alerts_p2_fixes.py
      - name: Validate static suite
        run: |
          npm test
          git diff --check
      - name: Run focused Chromium regression
        run: |
          npx playwright install chromium
          npx playwright test tests/alerts_collapsible_init.spec.js --project=chromium-desktop --project=chromium-mobile
      - name: Commit product fix
        run: |
          if git diff --quiet; then
            echo "No product diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: stabilize collapsible alerts across real renders"
          git push origin HEAD:fix/alerts-collapsible-init
