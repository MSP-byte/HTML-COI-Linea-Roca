name: H10 trace quick access focus

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-debug-route-race.yml

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build candidate and instrument H10-80 focus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, re, subprocess
          from pathlib import Path
          y = Path('.github/workflows/h10-final-review-patch-v2.yml').read_text(encoding='utf-8')
          m = re.search(r"printf '%s' '([^']+)' \| base64 -d > /tmp/h10_build_final.py", y)
          if not m:
              raise SystemExit('candidate payload missing')
          Path('/tmp/h10_build_final.py').write_bytes(base64.b64decode(m.group(1)))
          subprocess.check_call(['python','/tmp/h10_build_final.py'])

          q = Path('tests/h10_routing_cierre_archivo.spec.js')
          s = q.read_text(encoding='utf-8')
          old = "  const acceso = page.locator('[data-v2-open-module=\"btnRed\"]').first();\n  await acceso.focus();\n  await acceso.press('Enter');\n  await page.waitForTimeout(7500);\n  const e = await estadoRuta(page);"
          new = "  const acceso = page.locator('[data-v2-open-module=\"btnRed\"]').first();\n  const infoAntes = await acceso.evaluate((el) => ({tag:el.tagName, cls:el.className, tabIndex:el.tabIndex, connected:el.isConnected, outer:el.outerHTML.slice(0,240)}));\n  console.log('H80 element before focus', JSON.stringify(infoAntes));\n  await acceso.focus();\n  console.log('H80 focus immediate', JSON.stringify(await page.evaluate(() => ({tag:document.activeElement?.tagName||'', cls:document.activeElement?.className||'', module:document.activeElement?.getAttribute?.('data-v2-open-module')||'', connected:document.activeElement?.isConnected||false}))));\n  await page.waitForTimeout(50);\n  console.log('H80 focus 50ms', JSON.stringify(await page.evaluate(() => ({tag:document.activeElement?.tagName||'', cls:document.activeElement?.className||'', module:document.activeElement?.getAttribute?.('data-v2-open-module')||'', connected:document.activeElement?.isConnected||false}))));\n  await page.waitForTimeout(150);\n  console.log('H80 focus 200ms', JSON.stringify(await page.evaluate(() => ({tag:document.activeElement?.tagName||'', cls:document.activeElement?.className||'', module:document.activeElement?.getAttribute?.('data-v2-open-module')||'', connected:document.activeElement?.isConnected||false, quickCount:document.querySelectorAll('.coi-v2-quick[data-v2-open-module=\"btnRed\"]').length}))));\n  console.log('H80 locator current', JSON.stringify(await acceso.evaluate((el) => ({tag:el.tagName, cls:el.className, connected:el.isConnected, sameAsActive:el===document.activeElement}))));\n  await acceso.press('Enter');\n  await page.waitForTimeout(500);\n  console.log('H80 after enter', JSON.stringify(await estadoRuta(page)), JSON.stringify(await page.evaluate(() => ({activeTag:document.activeElement?.tagName||'', activeModule:document.activeElement?.getAttribute?.('data-v2-open-module')||''}))));\n  await page.waitForTimeout(7000);\n  const e = await estadoRuta(page);"
          if s.count(old) != 1:
              raise SystemExit(f'H10-80 block mismatch: {s.count(old)}')
          q.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Trace H10-80 focus
        run: npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-80' --project=chromium-desktop --workers=1 --retries=0
