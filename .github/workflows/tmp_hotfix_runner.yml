name: TMP runner hotfix Etapa1
'on':
  push:
    branches:
      - hotfix/etapa1-fecha-rpc-v3
    paths:
      - .github/workflows/tmp_hotfix_runner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/etapa1-fecha-rpc-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Aplicar patch
        run: |
          python3 scripts/tmp_hotfix_etapa1.py
          python3 scripts/tmp_fix_etapa1_acl_test.py
      - name: Instalar
        run: npm ci
      - name: Validar
        run: |
          node tests/check_etapa1_fecha_rpc_v3_hardening.js
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json tests/etapa1_ficha_integracion.spec.js tests/check_etapa1_pipeline_contractual.js
          git commit -m "fix: cerrar bordes de fecha efectiva en Ficha OC"
          git push origin HEAD:hotfix/etapa1-fecha-rpc-v3
# final rerun contractual
