name: H17 Apply Certification Structure

on:
  push:
    branches:
      - feat/h17-carga-certificacion-estructura

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply H17 certification structure
        run: python .github/scripts/h17_patch.py

      - name: Validate H17 markers
        shell: bash
        run: |
          grep -q "const CERTIFICACION_CONFIGS={" index.html
          grep -q "'N° HES','N° IF'" index.html
          grep -q "'ID OBRA','TIPO DE SERVICIO'" index.html
          grep -q "nro_hes:normalized.nro_hes" index.html
          grep -q "proveedor:normalized.proveedor" index.html

      - name: Commit generated index change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(h17): restructure certification grids by type"
          git push origin HEAD:feat/h17-carga-certificacion-estructura
