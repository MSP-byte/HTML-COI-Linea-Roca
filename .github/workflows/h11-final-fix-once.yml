name: H11 final fixes once

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: add one-shot H11 final review fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply H11 final fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 occurrence, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Review findings: secure generic audit RPC and make reviewed-alert state user-scoped.
          migration = Path('supabase/migrations/202609100001_h11_online_only_review_hardening.sql')
          migration.write_text("""-- COI Línea Roca · H11 online-only review hardening
          -- Persistencia remota de auditoría frontend y acuses de revisión de alertas.
          -- No modifica datos operativos existentes ni relaja RLS de tablas actuales.

          begin;

          create or replace function public.coi_registrar_auditoria_frontend(
            p_accion text,
            p_entidad text default 'general',
            p_registro_id text default null,
            p_nro_oc text default null,
            p_datos_anteriores jsonb default null,
            p_datos_nuevos jsonb default null,
            p_contexto jsonb default '{}'::jsonb
          )
          returns bigint
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_id bigint;
            v_role text;
          begin
            if auth.uid() is null then
              raise exception using errcode = '42501', message = 'COI_AUTH_REQUIRED';
            end if;
            v_role := public.coi_current_role();
            if v_role is null then
              raise exception using errcode = '42501', message = 'COI_ROLE_REQUIRED';
            end if;
            if v_role is distinct from 'administrador' then
              raise exception using errcode = '42501', message = 'COI_ADMIN_REQUIRED';
            end if;
            if nullif(btrim(coalesce(p_accion, '')), '') is null then
              raise exception using errcode = '22023', message = 'COI_AUDIT_ACTION_REQUIRED';
            end if;
            insert into public.coi_operaciones_auditoria (
              usuario_id, usuario_email, rol, accion, entidad, registro_id, nro_oc,
              datos_anteriores, datos_nuevos, contexto
            ) values (
              auth.uid(), nullif(auth.jwt() ->> 'email', ''), v_role, btrim(p_accion),
              coalesce(nullif(btrim(coalesce(p_entidad, '')), ''), 'general'),
              nullif(btrim(coalesce(p_registro_id, '')), ''),
              nullif(btrim(coalesce(p_nro_oc, '')), ''),
              p_datos_anteriores, p_datos_nuevos,
              coalesce(p_contexto, '{}'::jsonb) || jsonb_build_object('origen_writer', 'frontend_h11')
            ) returning id into v_id;
            return v_id;
          end;
          $$;
          revoke all on function public.coi_registrar_auditoria_frontend(text,text,text,text,jsonb,jsonb,jsonb) from public, anon;
          grant execute on function public.coi_registrar_auditoria_frontend(text,text,text,text,jsonb,jsonb,jsonb) to authenticated;

          create table if not exists public.coi_alertas_revisadas (
            alerta_id text not null,
            revisada_por uuid not null references auth.users(id) on delete cascade,
            fecha_revision timestamptz not null default clock_timestamp(),
            primary key (revisada_por, alerta_id)
          );
          alter table public.coi_alertas_revisadas enable row level security;
          revoke all on table public.coi_alertas_revisadas from public, anon, authenticated;
          create index if not exists coi_alertas_revisadas_fecha_idx on public.coi_alertas_revisadas (fecha_revision desc);

          create or replace function public.coi_marcar_alerta_revisada(p_alerta_id text)
          returns boolean
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_role text;
            v_alerta text;
          begin
            if auth.uid() is null then raise exception using errcode = '42501', message = 'COI_AUTH_REQUIRED'; end if;
            v_role := public.coi_current_role();
            if v_role is null then raise exception using errcode = '42501', message = 'COI_ROLE_REQUIRED'; end if;
            v_alerta := nullif(btrim(coalesce(p_alerta_id, '')), '');
            if v_alerta is null then raise exception using errcode = '22023', message = 'COI_ALERT_ID_REQUIRED'; end if;
            insert into public.coi_alertas_revisadas (alerta_id, revisada_por, fecha_revision)
            values (v_alerta, auth.uid(), clock_timestamp())
            on conflict (revisada_por, alerta_id) do update set fecha_revision = excluded.fecha_revision;
            insert into public.coi_operaciones_auditoria (
              usuario_id, usuario_email, rol, accion, entidad, registro_id, contexto
            ) values (
              auth.uid(), nullif(auth.jwt() ->> 'email', ''), v_role,
              'REVISAR_ALERTA', 'coi_alertas_revisadas', v_alerta,
              jsonb_build_object('alerta_id', v_alerta, 'origen_writer', 'frontend_h11')
            );
            return true;
          end;
          $$;
          revoke all on function public.coi_marcar_alerta_revisada(text) from public, anon;
          grant execute on function public.coi_marcar_alerta_revisada(text) to authenticated;

          create or replace function public.coi_listar_alertas_revisadas()
          returns table (alerta_id text, fecha_revision timestamptz, revisada_por uuid)
          language plpgsql
          security definer
          stable
          set search_path = public, pg_temp
          as $$
          declare v_role text;
          begin
            if auth.uid() is null then raise exception using errcode = '42501', message = 'COI_AUTH_REQUIRED'; end if;
            v_role := public.coi_current_role();
            if v_role is null then raise exception using errcode = '42501', message = 'COI_ROLE_REQUIRED'; end if;
            return query
              select r.alerta_id, r.fecha_revision, r.revisada_por
              from public.coi_alertas_revisadas r
              where r.revisada_por = auth.uid()
              order by r.fecha_revision desc;
          end;
          $$;
          revoke all on function public.coi_listar_alertas_revisadas() from public, anon;
          grant execute on function public.coi_listar_alertas_revisadas() to authenticated;

          commit;
          """.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Explicitly record the new H11 DB objects as pending production-contract divergences.
          fixture_path = Path('tests/fixtures/production_schema_contract.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          pending = fixture['_divergencias_pendientes']
          pending['_doc_objetos_h11'] = (
              'Objetos H11 presentes en el repositorio y todavía ausentes en producción. '
              'Su forma, permisos y aislamiento por usuario se verifican en check_h11_review_hardening_schema.js.'
          )
          pending['objetos_h11'] = [
              {
                  'tipo': 'table',
                  'objeto': 'coi_alertas_revisadas',
                  'produccion': 'ausente',
                  'repo': 'presente',
                  'migracion': '202609100001_h11_online_only_review_hardening.sql',
                  'contrato': 'PK compuesta (revisada_por, alerta_id); FK auth.users(id) ON DELETE CASCADE; RLS activa; sin acceso directo public/anon/authenticated'
              },
              {
                  'tipo': 'function',
                  'objeto': 'coi_registrar_auditoria_frontend(text,text,text,text,jsonb,jsonb,jsonb)',
                  'produccion': 'ausente',
                  'repo': 'presente',
                  'migracion': '202609100001_h11_online_only_review_hardening.sql',
                  'contrato': 'SECURITY DEFINER; exige rol administrador; EXECUTE solo authenticated entre roles de aplicación'
              },
              {
                  'tipo': 'function',
                  'objeto': 'coi_marcar_alerta_revisada(text)',
                  'produccion': 'ausente',
                  'repo': 'presente',
                  'migracion': '202609100001_h11_online_only_review_hardening.sql',
                  'contrato': 'SECURITY DEFINER; upsert por (revisada_por, alerta_id); identidad de usuario derivada de auth.uid()'
              },
              {
                  'tipo': 'function',
                  'objeto': 'coi_listar_alertas_revisadas()',
                  'produccion': 'ausente',
                  'repo': 'presente',
                  'migracion': '202609100001_h11_online_only_review_hardening.sql',
                  'contrato': 'SECURITY DEFINER; devuelve únicamente filas con revisada_por = auth.uid()'
              }
          ]
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Wire a focused authoritative H11 schema/security contract into test:sql.
          contract_test = Path('tests/check_h11_review_hardening_schema.js')
          contract_test.write_text(r"""const fs = require('fs');
          const path = require('path');

          const migrationName = '202609100001_h11_online_only_review_hardening.sql';
          const migrationPath = path.join(__dirname, '..', 'supabase', 'migrations', migrationName);
          const fixturePath = path.join(__dirname, 'fixtures', 'production_schema_contract.json');
          const sql = fs.readFileSync(migrationPath, 'utf8');
          const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));

          function must(re, label, source = sql) {
            if (!re.test(source)) {
              console.error(`❌ H11 schema contract: ${label}`);
              process.exit(1);
            }
          }

          must(/create\s+table\s+if\s+not\s+exists\s+public\.coi_alertas_revisadas\s*\([\s\S]*?primary\s+key\s*\(\s*revisada_por\s*,\s*alerta_id\s*\)[\s\S]*?\);/i,
            'coi_alertas_revisadas debe tener PK compuesta por usuario + alerta');
          must(/revisada_por\s+uuid\s+not\s+null\s+references\s+auth\.users\s*\(\s*id\s*\)\s+on\s+delete\s+cascade/i,
            'revisada_por debe referenciar auth.users con ON DELETE CASCADE');
          must(/alter\s+table\s+public\.coi_alertas_revisadas\s+enable\s+row\s+level\s+security/i,
            'la tabla debe tener RLS habilitada');
          must(/revoke\s+all\s+on\s+table\s+public\.coi_alertas_revisadas\s+from\s+public\s*,\s*anon\s*,\s*authenticated/i,
            'la tabla no debe exponer DML directo a roles de aplicación');

          const audit = sql.match(/create\s+or\s+replace\s+function\s+public\.coi_registrar_auditoria_frontend[\s\S]*?\$\$;/i)?.[0] || '';
          must(/security\s+definer/i, 'auditoría frontend debe ser SECURITY DEFINER', audit);
          must(/v_role\s+is\s+distinct\s+from\s+'administrador'/i, 'auditoría frontend debe exigir administrador', audit);
          must(/grant\s+execute\s+on\s+function\s+public\.coi_registrar_auditoria_frontend\([^;]+\)\s+to\s+authenticated/i,
            'authenticated debe ejecutar la RPC de auditoría, quedando la autorización dentro de la RPC');
          must(/revoke\s+all\s+on\s+function\s+public\.coi_registrar_auditoria_frontend\([^;]+\)\s+from\s+public\s*,\s*anon/i,
            'public/anon no deben ejecutar auditoría frontend');

          const mark = sql.match(/create\s+or\s+replace\s+function\s+public\.coi_marcar_alerta_revisada[\s\S]*?\$\$;/i)?.[0] || '';
          must(/security\s+definer/i, 'marcar alerta revisada debe ser SECURITY DEFINER', mark);
          must(/on\s+conflict\s*\(\s*revisada_por\s*,\s*alerta_id\s*\)/i,
            'el upsert de alertas revisadas debe ser por usuario + alerta', mark);
          must(/values\s*\(\s*v_alerta\s*,\s*auth\.uid\(\)/i,
            'la identidad del revisor debe provenir de auth.uid()', mark);

          const list = sql.match(/create\s+or\s+replace\s+function\s+public\.coi_listar_alertas_revisadas[\s\S]*?\$\$;/i)?.[0] || '';
          must(/security\s+definer/i, 'listar alertas revisadas debe ser SECURITY DEFINER', list);
          must(/where\s+r\.revisada_por\s*=\s*auth\.uid\(\)/i,
            'el listado debe estar aislado por el usuario actual', list);

          const pending = fixture?._divergencias_pendientes?.objetos_h11;
          if (!Array.isArray(pending)) {
            console.error('❌ H11 schema contract: falta objetos_h11 en production_schema_contract.json');
            process.exit(1);
          }
          const names = new Set(pending.map((x) => x.objeto));
          for (const expected of [
            'coi_alertas_revisadas',
            'coi_registrar_auditoria_frontend(text,text,text,text,jsonb,jsonb,jsonb)',
            'coi_marcar_alerta_revisada(text)',
            'coi_listar_alertas_revisadas()'
          ]) {
            if (!names.has(expected)) {
              console.error(`❌ H11 schema contract: falta divergencia pendiente ${expected}`);
              process.exit(1);
            }
          }
          if (pending.some((x) => x.migracion !== migrationName || x.repo !== 'presente' || x.produccion !== 'ausente')) {
            console.error('❌ H11 schema contract: metadatos de divergencia pendientes inconsistentes');
            process.exit(1);
          }

          console.log('✅ H11 review hardening schema contract OK');
          """.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          needle = 'node tests/check_schema_reproducibility.js && node tests/check_estado_coi_default.js'
          replacement = 'node tests/check_schema_reproducibility.js && node tests/check_h11_review_hardening_schema.js && node tests/check_estado_coi_default.js'
          if package_text.count(needle) != 1:
              raise SystemExit('package.json: test:sql insertion point not found exactly once')
          package_path.write_text(package_text.replace(needle, replacement, 1), encoding='utf-8')

          # H11 means legacy persistent preferences are opaque residue: the app must not purge/read them.
          replace_once(
              'tests/dashboard_charts_motion_paused.spec.js',
              "  await page.waitForFunction(() => (\n    !document.body.classList.contains('coi-motion-off') &&\n    localStorage.getItem('coi.visual.motion.enabled') === null\n  ));",
              "  await page.waitForFunction(() => !document.body.classList.contains('coi-motion-off'));"
          )
          replace_once(
              'tests/dashboard_charts_motion_paused.spec.js',
              '  expect(state.storedMotion).toBeNull();',
              "  expect(state.storedMotion).toBe('0');"
          )

          replace_once(
              'tests/delete_button.spec.js',
              "test('sin sesión no se exponen órdenes ni posiciones sembradas en caché', async ({ page }) => {",
              "test('sin sesión no se exponen órdenes ni posiciones sembradas en residuo legacy', async ({ page }) => {"
          )
          replace_once(
              'tests/delete_button.spec.js',
              "  expect(await page.evaluate(() => localStorage.getItem('coi_supabase_ordenes_cache_v2'))).toBeNull();\n  expect(await page.evaluate(() => localStorage.getItem('coi_cache_posiciones_oc_supabase_v1'))).toBeNull();",
              "  expect(await page.evaluate(() => localStorage.getItem('coi_supabase_ordenes_cache_v2'))).not.toBeNull();\n  expect(await page.evaluate(() => localStorage.getItem('coi_cache_posiciones_oc_supabase_v1'))).not.toBeNull();"
          )

          # H05: inspect legacy residue directly from the test harness; do not depend on an app bridge removed by H11.
          replace_once(
              'tests/h05_um_st_supabase_first.spec.js',
              "  legacyUMReal: window.__COI_UM_H05_LEGACY_RAW__('coi_roca_unidades_mantenimiento'),",
              "  legacyUMReal: localStorage.getItem('coi_roca_unidades_mantenimiento'),"
          )

          # H03: no persistent cutover marker is created/read by the app in online-only mode.
          h03_path = Path('tests/h03_observaciones_supabase_first.spec.js')
          h03 = h03_path.read_text(encoding='utf-8')
          marker_assert = '  expect(corteVigente(e.marker)).toBe(true);'
          if h03.count(marker_assert) != 2:
              raise SystemExit(f'H03: expected 2 legacy marker assertions, found {h03.count(marker_assert)}')
          h03 = h03.replace(marker_assert, '  expect(e.marker).toBeNull();')

          n13_pattern = re.compile(r"test\('N13 · con legado pendiente de migrar ninguna mutacion llega a Supabase',[\s\S]*?\n\}\);\n\ntest\('N13b · sin legado pendiente el alta comun sigue funcionando'", re.M)
          n13_replacement = r"""test('N13 · el residuo legacy H11 es opaco y no bloquea mutaciones Supabase válidas', async ({ page }) => {
            test.slow();
            // H11 no lee localStorage: un residuo historico puede seguir fisicamente en el
            // navegador, pero no participa del modelo ni de las compuertas operativas.
            await prepararEntorno(page, { filas: [], legado: LEGACY });
            await abrir(page);
            await sembrarOC(page);
            await fijarAdmin(page, true);
            let e = await estado(page);
            expect(e.origen).toBe('supabase');
            expect(e.cuarentena).toBe(0);
            expect(e.observaciones).toHaveLength(0);
            expect(e.legacyKey).not.toBeNull();

            await page.evaluate(async (id) => {
              window.prompt = () => 'NO DEBERIA LLEGAR';
              // Las dos altas validas siguen la ruta remota aun con residuo legacy inerte.
              const ta = document.createElement('textarea');
              ta.id = 'v65NuevaObservacion';
              ta.value = 'ALTA ONLINE-ONLY';
              document.body.appendChild(ta);
              window.guardarObservacionOC('4530008964');
              const b = document.createElement('button');
              b.type = 'button';
              b.id = 'btnAlertaOnlineOnly';
              b.setAttribute('data-r15-alert-to-obs', '4530008964');
              b.setAttribute('data-r15-alert-text', 'ALERTA ONLINE-ONLY');
              document.body.appendChild(b);
              b.click();
              // Un UUID legacy inexistente en Supabase nunca habilita UPDATE/DELETE.
              window.editarObservacionR13(id);
              window.resolverObservacionOC(id);
              window.reabrirObservacionOC(id);
              await new Promise((r) => setTimeout(r, 1500));
            }, LEGACY[0].idObservacion);
            e = await estado(page);

            expect(soloOp(e, 'insert')).toHaveLength(2);
            expect(soloOp(e, 'update')).toHaveLength(0);
            expect(soloOp(e, 'delete')).toHaveLength(0);
            expect(e.cuarentena).toBe(0);
            expect(e.legacyKey).not.toBeNull();
            expect(e.observaciones.map((o) => o.texto)).not.toContain('LEGADO UNO');
            expect(e.marker).toBeNull();
            expect(e.escriturasLegacy).toEqual([]);
          });

          test('N13b · sin legado pendiente el alta comun sigue funcionando'""".replace('\n          ', '\n').lstrip()
          h03, n = n13_pattern.subn(n13_replacement, h03, count=1)
          if n != 1:
              raise SystemExit(f'H03: N13 block replacement count={n}')
          h03_path.write_text(h03, encoding='utf-8')
          PY

      - name: Validate focused contract and diff
        run: |
          node tests/check_h11_review_hardening_schema.js
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add package.json tests supabase/migrations/202609100001_h11_online_only_review_hardening.sql
          git commit -m "fix: close H11 review and legacy test alignment"
          git push origin HEAD:fix/h11-online-only-no-localstorage
