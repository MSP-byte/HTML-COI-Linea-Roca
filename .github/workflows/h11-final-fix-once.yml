name: H11 final fixes once

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: run one-shot H11 final review fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final fixes
        run: python .github/scripts/h11_final_fix.py

      - name: Validate focused contract and diff
        run: |
          node tests/check_h11_review_hardening_schema.js
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add package.json tests supabase/migrations/202609100001_h11_online_only_review_hardening.sql
          git commit -m "fix: close H11 review and legacy test alignment"
          git push origin HEAD:fix/h11-online-only-no-localstorage
