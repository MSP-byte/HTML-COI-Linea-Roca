name: H05 Final Formatting
"on":
  push:
    paths:
      - .github/workflows/h05-p2-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h05-unidades-mantenimiento-supabase-first
          fetch-depth: 0
      - name: Normalize formatting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count={s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          one('index.html',
              """        if (!perfilFinal.ok || !perfilFinal.rol) {
runtime.rol = null;
throw new Error('El perfil Supabase dejó de estar activo durante la sincronización.');
        }
""",
              """        if (!perfilFinal.ok || !perfilFinal.rol) {
          runtime.rol = null;
          throw new Error('El perfil Supabase dejó de estar activo durante la sincronización.');
        }
""")

          one('tests/h05_um_st_supabase_first.spec.js',
              """        const rolActual = verificacionesRol > 1 && c.rolTrasPrimeraVerificacion !== undefined
? c.rolTrasPrimeraVerificacion
: c.rol;
""",
              """        const rolActual = verificacionesRol > 1 && c.rolTrasPrimeraVerificacion !== undefined
          ? c.rolTrasPrimeraVerificacion
          : c.rol;
""")
          PY
          git diff --check
          node tests/check_h05_um_supabase_first.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/h05_um_st_supabase_first.spec.js
          git commit -m "style: normalize final H05 patch formatting"
          git push origin HEAD:fix/h05-unidades-mantenimiento-supabase-first
