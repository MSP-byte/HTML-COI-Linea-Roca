name: TEMP Timeline Inspect
on:
  push:
    branches: [fix/timeline-filters-views]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch and validate Timeline filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text(encoding='utf-8').splitlines()

          old_filters="filters:{fecha:'',fecha_desde:'',fecha_hasta:'',semana:'',oc:'',proveedor:'',rubro:'',estado:'',riesgo:'',tipo_evento:'',origen:'',responsable_accion:''}"
          new_filters="filters:{fecha:'',fecha_desde:'',oc:'',proveedor:'',rubro:'',tipo_evento:'',origen:'',responsable_accion:''}"
          hits=[i for i,l in enumerate(lines) if old_filters in l]
          if len(hits)!=1: raise SystemExit(f'state.filters matches={len(hits)}')
          lines[hits[0]]=lines[hits[0]].replace(old_filters,new_filters)

          remove_tokens=[
            "if(f.fecha_hasta&&",
            "if(f.semana&&",
            "if(f.estado&&",
            "if(f.riesgo&&",
            "${field('Fecha hasta'",
            "${field('Semana'",
            "${field('Estado'",
            "${field('Riesgo'",
          ]
          for token in remove_tokens:
            idx=[i for i,l in enumerate(lines) if token in l]
            if len(idx)!=1: raise SystemExit(f'{token} matches={len(idx)}')
            lines.pop(idx[0])

          start=next(i for i,l in enumerate(lines) if 'function renderTimelineCOI(){' in l)
          end=next(i for i,l in enumerate(lines[start:],start) if 'window.renderTimelineCOI=renderTimelineCOI;' in l)
          def find_between(token):
            found=[i for i in range(start,end) if token in lines[i]]
            if len(found)!=1: raise SystemExit(f'{token} matches={len(found)}')
            return found[0]
          fi=find_between('${filtersMarkup()}')
          ei=find_between('${editorMarkup()}')
          bi=find_between('${bulkImportMarkup()}')
          hi=find_between('<div class="timeline-section-head">')
          ri=find_between('<div class="timeline-result">${result}</div>')
          if [ei,bi,hi,ri] != [fi+1,fi+2,fi+3,fi+4]:
            raise SystemExit(f'unexpected render order: {[fi,ei,bi,hi,ri]}')
          indent=lines[fi][:len(lines[fi])-len(lines[fi].lstrip())]
          filters_line=lines[fi]
          editor_line=lines[ei]
          bulk_line=lines[bi]
          head_line=lines[hi]
          result_line=lines[ri]
          replacement=[
            filters_line,
            indent+'<section id="timelineResultsAnchor" class="timeline-results-section" aria-live="polite">',
            indent+'  '+head_line.strip(),
            indent+'  '+result_line.strip(),
            indent+'</section>',
            editor_line,
            bulk_line,
          ]
          lines[fi:ri+1]=replacement

          tab_old="if(tab){state.view=tab.dataset.timelineView;state.editingId='';renderTimelineCOI();return;}"
          tab_new="if(tab){state.view=tab.dataset.timelineView;state.editingId='';renderTimelineCOI();requestAnimationFrame(()=>byId('timelineResultsAnchor')?.scrollIntoView({block:'nearest'}));return;}"
          apply_old="if(target.closest('#btnTimelineAplicarFiltros')){readFilters();renderTimelineCOI();return;}"
          apply_new="if(target.closest('#btnTimelineAplicarFiltros')){readFilters();state.editingId='';renderTimelineCOI();requestAnimationFrame(()=>byId('timelineResultsAnchor')?.scrollIntoView({block:'nearest'}));return;}"
          for old,new in [(tab_old,tab_new),(apply_old,apply_new)]:
            idx=[i for i,l in enumerate(lines) if old in l]
            if len(idx)!=1: raise SystemExit(f'handler matches={len(idx)} for {old[:30]}')
            lines[idx[0]]=lines[idx[0]].replace(old,new)

          text='\n'.join(lines)+'\n'
          for forbidden in ['timelineFilter_fecha_hasta','timelineFilter_semana','timelineFilter_estado','timelineFilter_riesgo','if(f.fecha_hasta&&','if(f.semana&&','if(f.estado&&','if(f.riesgo&&']:
            if forbidden in text: raise SystemExit('forbidden remains: '+forbidden)
          for required in ['timelineFilter_fecha_desde','timelineFilter_oc','timelineFilter_proveedor','timelineFilter_rubro','timelineFilter_tipo_evento','timelineFilter_origen','timelineFilter_responsable_accion','timelineResultsAnchor']:
            if required not in text: raise SystemExit('required missing: '+required)
          p.write_text(text,encoding='utf-8')
          PY

          cat > tests/timeline_filters_views.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');
          const SOURCE = fs.readFileSync(path.resolve(__dirname, '..', 'index.html'), 'utf8');
          function between(a,b){const x=SOURCE.indexOf(a),y=SOURCE.indexOf(b,x);if(x<0||y<0)throw new Error(`Bloque no encontrado: ${a}`);return SOURCE.slice(x,y);}
          const FILTERS=between('  function filtersMarkup(){','  function kpisMarkup(');
          const MATCHES=between('  function eventMatches(event){','  function filteredEvents(');
          const RENDER=between('  function renderTimelineCOI(){','  window.renderTimelineCOI=renderTimelineCOI;');
          const BIND=between('  function bindEvents(){','  async function initializeStore(');

          test('Timeline conserva solo los siete filtros operativos solicitados', async () => {
            for(const id of ['timelineFilter_fecha_desde','timelineFilter_oc','timelineFilter_proveedor','timelineFilter_rubro','timelineFilter_tipo_evento','timelineFilter_origen','timelineFilter_responsable_accion']) expect(FILTERS).toContain(id);
            for(const id of ['timelineFilter_fecha_hasta','timelineFilter_semana','timelineFilter_estado','timelineFilter_riesgo']) expect(FILTERS).not.toContain(id);
          });
          test('eventMatches deja de aplicar filtros retirados', async () => {
            for(const token of ['f.fecha_desde','f.oc','f.proveedor','f.rubro','f.tipo_evento','f.origen','f.responsable_accion']) expect(MATCHES).toContain(token);
            for(const token of ['f.fecha_hasta','f.semana','f.estado','f.riesgo']) expect(MATCHES).not.toContain(token);
          });
          test('resultado visible se renderiza antes del editor y carga masiva', async () => {
            const a=RENDER.indexOf('${filtersMarkup()}'), b=RENDER.indexOf('timelineResultsAnchor'), c=RENDER.indexOf('${editorMarkup()}'), d=RENDER.indexOf('${bulkImportMarkup()}');
            expect(a).toBeGreaterThan(-1); expect(b).toBeGreaterThan(a); expect(c).toBeGreaterThan(b); expect(d).toBeGreaterThan(c);
          });
          test('botones de vistas y Aplicar filtros rerenderizan y enfocan resultados', async () => {
            expect(BIND).toContain("target.closest('[data-timeline-view]')");
            expect(BIND).toContain("target.closest('#btnTimelineAplicarFiltros')");
            expect(BIND.match(/timelineResultsAnchor/g)?.length||0).toBeGreaterThanOrEqual(2);
          });
          JS

          node --check tests/timeline_filters_views.spec.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/timeline_filters_views.spec.js
          git commit -m 'fix: make Timeline filters and views visible [skip ci]'
          git push
