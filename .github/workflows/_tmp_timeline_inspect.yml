name: TEMP Timeline Inspect
on:
  push:
    branches: [fix/timeline-filters-views]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Timeline snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          terms=['state={','filters:{','btnTimelineAplicarFiltros','btnTimelineLimpiarFiltros','data-timeline-view','timelineCOIBody','eventMatches','dailyMarkup','weeklyMarkup','ocMarkup','addEventListener']
          out=[]
          lines=src.splitlines()
          for term in terms:
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower() and 19500 <= i+1 <= 21600]
              out.append(f'===== {term} :: {hits} =====')
              for i in hits[:12]:
                  a=max(0,i-18); b=min(len(lines),i+45)
                  out.extend(f'{j+1:05d}: {lines[j]}' for j in range(a,b))
                  out.append('---')
          Path('timeline_inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add timeline_inspect.txt
          git commit -m 'chore: capture timeline binding snippets [skip ci]'
          git push
