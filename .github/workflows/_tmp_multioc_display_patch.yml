name: TEMP Historical Multi OC Inspect
on:
  push:
    branches: [fix/timeline-historical-multi-oc-display]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract exact Timeline blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          specs=[
            ('extract','  function extractTimelineOCRefs','  function normalizeTimelineOCSource'),
            ('card','  function eventCard(event,compact){','  function dailyMarkup(events){'),
            ('ocview','  function ocMarkup(events){','  function nextAction('),
          ]
          out=[]
          for name,a,b in specs:
              x=s.index(a); y=s.index(b,x)
              out += [f'===== {name} =====', s[x:y], '']
          Path('multioc_inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add multioc_inspect.txt
          git commit -m 'chore: capture current multi-OC blocks [skip ci]'
          git push
