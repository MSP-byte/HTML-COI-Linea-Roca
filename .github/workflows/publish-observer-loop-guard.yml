name: Publish observer loop guard

on:
  push:
    branches: [fix/alerts-collapsible-init]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alerts-collapsible-init
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/guard_exec_alert_mutations.py
      - run: |
          npm test
          git diff --check
      - name: Commit product guard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: ignore internal collapsible alert mutations"
          git push origin HEAD:fix/alerts-collapsible-init
