name: Security Inspection Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'security/hardening-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exportar fuente para auditoria puntual
        uses: actions/upload-artifact@v4
        with:
          name: coi-security-source
          path: index.html
          if-no-files-found: error
          retention-days: 1
