name: PR65 final focus menu fix

on:
  push:
    branches:
      - fix/dashboard-focus-motion-defaults

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fix desktop menu behavior in forced Dashboard focus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_old = "  body.dashboard-focus-mode.coi-v2-ready #coiV2Topbar{left:var(--v2-side-collapsed)!important}\n"
          css_new = css_old + "  body.dashboard-focus-mode.coi-v2-ready #coiV2Menu{display:none!important}\n"
          if text.count(css_old) != 1:
              raise SystemExit(f'Expected one focus topbar CSS rule, found {text.count(css_old)}')
          if '#coiV2Menu{display:none!important}' not in text:
              text = text.replace(css_old, css_new, 1)

          js_old = "    $('coiV2Menu')?.addEventListener('click',()=>{if(matchMedia('(max-width: 760px)').matches){document.body.classList.toggle('coi-v2-mobile-open')}else{const collapsed=document.body.classList.toggle('coi-v2-sidebar-collapsed');localStorage.setItem('coi_v2_sidebar_collapsed',collapsed?'1':'0')}});"
          js_new = "    $('coiV2Menu')?.addEventListener('click',()=>{if(matchMedia('(max-width: 760px)').matches){document.body.classList.toggle('coi-v2-mobile-open')}else{if(document.body.classList.contains('dashboard-focus-mode'))return;const collapsed=document.body.classList.toggle('coi-v2-sidebar-collapsed');localStorage.setItem('coi_v2_sidebar_collapsed',collapsed?'1':'0')}});"
          if text.count(js_old) != 1:
              raise SystemExit(f'Expected one coiV2Menu handler, found {text.count(js_old)}')
          text = text.replace(js_old, js_new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Extend desktop focus regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/dashboard_focus_v2_shell.spec.js')
          text = path.read_text(encoding='utf-8')

          old = "  await expect(page.locator('#coiV2Menu')).toBeVisible();"
          new = "  await expect(page.locator('#coiV2Menu')).toBeHidden();"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one visible desktop menu assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = "  expect(focusMetrics.navTitle).toMatch(/Órdenes/i);\n\n  const ordersNav = page.locator('#coiV2Sidebar [data-v2-view=\"vistaOrdenes\"]');"
          insert = "  expect(focusMetrics.navTitle).toMatch(/Órdenes/i);\n\n  // En foco forzado, el control desktop no debe mutar silenciosamente la preferencia normal del sidebar.\n  const focusMenuState = await page.evaluate(() => {\n    const beforeClass = document.body.classList.contains('coi-v2-sidebar-collapsed');\n    const beforeSaved = localStorage.getItem('coi_v2_sidebar_collapsed');\n    document.getElementById('coiV2Menu')?.click();\n    return {\n      beforeClass,\n      afterClass: document.body.classList.contains('coi-v2-sidebar-collapsed'),\n      beforeSaved,\n      afterSaved: localStorage.getItem('coi_v2_sidebar_collapsed')\n    };\n  });\n  expect(focusMenuState.afterClass).toBe(focusMenuState.beforeClass);\n  expect(focusMenuState.afterSaved).toBe(focusMenuState.beforeSaved);\n\n  const ordersNav = page.locator('#coiV2Sidebar [data-v2-view=\"vistaOrdenes\"]');"
          if text.count(anchor) != 1:
              raise SystemExit('Expected focus assertion anchor exactly once')
          text = text.replace(anchor, insert, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Static contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          test = Path('tests/dashboard_focus_v2_shell.spec.js').read_text(encoding='utf-8')
          assert 'body.dashboard-focus-mode.coi-v2-ready #coiV2Menu{display:none!important}' in text
          assert "if(document.body.classList.contains('dashboard-focus-mode'))return;" in text
          assert "await expect(page.locator('#coiV2Menu')).toBeHidden();" in test
          assert "afterSaved: localStorage.getItem('coi_v2_sidebar_collapsed')" in test
          print('PR65 focus menu contract: OK')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused Chromium regressions
        shell: bash
        run: |
          npx playwright test tests/dashboard_focus_v2_shell.spec.js tests/dashboard_charts_motion_paused.spec.js
          npx playwright test tests/delete_button.spec.js tests/final_ux_alerts_orders_filter.spec.js
          npx playwright test tests/h10_routing_cierre_archivo.spec.js -g "H10-23"

      - name: Run static suite
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Commit validated menu fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/dashboard_focus_v2_shell.spec.js
          git commit -m "fix: freeze desktop menu state during Dashboard focus"
          git push origin HEAD:fix/dashboard-focus-motion-defaults
