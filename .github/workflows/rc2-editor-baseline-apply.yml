name: RC2 Editor Baseline Patch

on:
  push:
    branches:
      - hotfix/rc2-editor-baseline
    paths:
      - .coi-qa/apply-editor-baseline-hotfix.mjs
      - .github/workflows/rc2-editor-baseline-apply.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama hotfix
        uses: actions/checkout@v4
        with:
          ref: hotfix/rc2-editor-baseline
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar parche exacto
        run: node .coi-qa/apply-editor-baseline-hotfix.mjs

      - name: Validar diff
        run: |
          git diff --check
          test "$(git diff --numstat -- index.html | wc -l)" -eq 1

      - name: Commit del hotfix generado
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios que confirmar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(editor): usar baseline remoto y omitir campos DOM ausentes"
          git push origin HEAD:hotfix/rc2-editor-baseline
