name: Diagnose final UI
on:
  push:
    branches:
      - fix/ficha-obras-alertas-supabase
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose index renderers
        run: node .coi-qa/diagnose_final_ui.mjs
