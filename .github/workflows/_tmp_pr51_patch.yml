name: TEMP PR51 Patch
on:
  push:
    branches:
      - 'feat/ficha-oc-indicadores-obra-servicio'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          a = "    const porcentaje=normalizarNumeroCertificacion(campoHistorico(row,['aux_porcentaje','aux','AUX'],cantidad>0?(acumulado/cantidad)*100:0));"
          b = "    const auxPorcentajePersistido=campoHistorico(row,['aux_porcentaje','aux','AUX'],null);\n    const porcentaje=normalizarNumeroCertificacion(auxPorcentajePersistido===null||auxPorcentajePersistido===undefined||clean(auxPorcentajePersistido)===''?(cantidad>0?(acumulado/cantidad)*100:0):auxPorcentajePersistido);"
          if s.count(a) != 1: raise SystemExit('anchor porcentaje')
          s = s.replace(a,b,1)
          a = "      aux_porcentaje:porcentaje,"
          b = "      aux_porcentaje:porcentaje,\n      _aux_porcentaje_persistido:auxPorcentajePersistido,"
          if s.count(a) != 1: raise SystemExit('anchor marker')
          s = s.replace(a,b,1)
          a = "  function progressFromPersistedCertification(row){\n    if(!row||row.aux_porcentaje===null||row.aux_porcentaje===undefined||clean(row.aux_porcentaje)==='')return null;\n    const value=Number(row.aux_porcentaje);\n    return Number.isFinite(value)?value:null;\n  }"
          b = "  function progressFromPersistedCertification(row){\n    if(!row)return null;\n    const persisted=Object.prototype.hasOwnProperty.call(row,'_aux_porcentaje_persistido')?row._aux_porcentaje_persistido:row.aux_porcentaje;\n    if(persisted===null||persisted===undefined||clean(persisted)==='')return null;\n    const value=Number(persisted);\n    return Number.isFinite(value)?value:null;\n  }"
          if s.count(a) != 1: raise SystemExit('anchor helper')
          p.write_text(s.replace(a,b,1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/_tmp_pr51_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/_tmp_pr51_patch.yml
          git commit -m 'fix: use only persisted progress in Ficha OC'
          git push
