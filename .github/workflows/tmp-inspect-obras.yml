name: TMP inspect ficha obras
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar inspeccion
        run: |
          python3 - <<'PY' > inspection.txt
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8',errors='replace')
          terms=['RESUMEN GENERAL','Resumen General','REPOSITORIO DOCUMENTAL','Repositorio documental','OneDrive','ESTADO CONTRACTUAL','ESTADO FINANCIERO','Semáforo','SEMÁFORO','ultima certificacion','última certificación','porcentaje avance','avance']
          lines=text.splitlines()
          print('TOTAL_LINES',len(lines))
          for term in terms:
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
              print('\n=== TERM',term,'HITS',len(hits),'===')
              for i in hits[:25]:
                  a=max(0,i-14); b=min(len(lines),i+22)
                  print(f'--- context lines {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY
      - name: Commit inspection snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot inspeccion ficha obras"
          git push