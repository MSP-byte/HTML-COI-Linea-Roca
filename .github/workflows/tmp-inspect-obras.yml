name: TMP inspect ficha obras
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar inspeccion acotada
        run: |
          python3 - <<'PY' > inspection_hits.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          terms=[
            'RESUMEN GENERAL','REPOSITORIO DOCUMENTAL','OneDrive',
            'ESTADO CONTRACTUAL / CIRCUITO ADMINISTRATIVO','ESTADO FINANCIERO',
            'ID_OBRA','fecha_vencimiento','vencimiento','porcentaje_avance',
            'avance_obra','avance_pct','acta_medicion_nro','proxima_acta_medicion_fecha',
            'ultima_certificacion','última certificación','certificaciones'
          ]
          print('TOTAL_LINES',len(lines))
          for term in terms:
              hits=[(i+1,l.strip()) for i,l in enumerate(lines) if term.lower() in l.lower()]
              print(f'\n=== {term} | HITS {len(hits)} ===')
              for n,l in hits[:40]:
                  print(f'{n}: {l[:900]}')
          PY
      - name: Commit inspection hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_hits.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot hits ficha obras"
          git push