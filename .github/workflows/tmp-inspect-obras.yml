name: TMP apply obra summary Supabase fix
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar hotfix acotado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='COI-OBRA-RESUMEN-SUPABASE-V1'

          old_repo='''          <div><b>Repositorio documental</b>${coiURLHTTPValida(item.linkOneDrive)?'<a href="'+esc(item.linkOneDrive)+'" target="_blank" rel="noopener noreferrer">Abrir OneDrive</a>':'—'}</div>'''
          new_repo='''          <div><b>Repositorio documental</b><span data-coi-repo-supabase>Supabase Storage</span></div>'''
          if old_repo in text:
              text=text.replace(old_repo,new_repo,1)

          text=text.replace('Carpetas OneDrive y documentos vinculados a la OC ${esc(nro(o))}.','Vínculos documentales registrados en Supabase para la OC ${esc(nro(o))}.')

          patch=r'''
<script id="coi-obra-resumen-supabase-v1">
/* COI-OBRA-RESUMEN-SUPABASE-V1
   Ajuste final de Ficha OC: Obras muestran vencimiento, ultima certificacion y avance
   usando Supabase; el repositorio contractual refleja Supabase Storage. */
(function(){
  'use strict';
  if(window.__COI_OBRA_RESUMEN_SUPABASE_V1__)return;
  window.__COI_OBRA_RESUMEN_SUPABASE_V1__=true;

  const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
  const clean=v=>String(v??'').trim();
  const isObra=item=>norm(item?.tipo||item?.TIPO)==='OBRA';
  const pctNumber=v=>{const n=Number(String(v??'').replace('%','').replace(',','.'));return Number.isFinite(n)?n:null;};
  const fmtPct=n=>`${new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1}).format(n)}%`;
  const fmtDate=v=>{if(!v)return '—';try{if(typeof window.fmtFecha==='function')return window.fmtFecha(v)||'—';}catch(e){}const s=clean(v).slice(0,10);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:s||'—';};
  const orderKey=item=>clean(item?.numeroOC||item?.nro_oc||item?.oc||item?.OC_NRO||item?.idObra||item?.idOC);
  let renderSeq=0;

  function resolveItem(reference){
    try{const found=typeof window.obtenerOC==='function'?window.obtenerOC(reference):null;if(found?.item)return found.item;if(found&&typeof found==='object')return found;}catch(e){}
    try{const rows=typeof window.todasLasOC==='function'?window.todasLasOC():[];const target=norm(reference);const row=rows.find(r=>{const item=r?.item||r;return [item?.numeroOC,item?.nro_oc,item?.oc,item?.idObra,item?.idOC].some(v=>norm(v)===target);});return row?.item||row||null;}catch(e){}
    return null;
  }

  function cardByTitle(body,title){return [...body.querySelectorAll('.expediente-card,.ficha-oc-panel')].find(card=>norm(card.querySelector('h3')?.textContent).includes(norm(title)))||null;}
  function fieldByLabel(root,label){return [...(root?.querySelectorAll('.grid > div')||[])].find(div=>norm(div.querySelector('b')?.textContent)===norm(label))||null;}
  function ensureField(grid,label,attr){
    let div=fieldByLabel(grid,label);
    if(!div){div=document.createElement('div');grid.appendChild(div);}
    div.innerHTML='';
    const b=document.createElement('b');b.textContent=label;div.appendChild(b);
    const span=document.createElement('span');if(attr)span.setAttribute(attr,'');span.textContent='—';div.appendChild(span);
    return span;
  }

  function getVencimiento(item){return item?._supabaseRaw?.fecha_vencimiento||item?.fechaVencimiento||item?.vencimiento||item?.fechaFin||'';}

  function patchResumenObra(item){
    if(!isObra(item))return null;
    const body=document.getElementById('fichaOCBody');if(!body)return null;
    const card=cardByTitle(body,'1. Resumen general');if(!card)return null;
    const grid=card.querySelector('.grid');if(!grid)return null;
    card.dataset.coiObraResumenSource='supabase';

    let sector=fieldByLabel(grid,'Sector');
    if(!sector)sector=fieldByLabel(grid,'Vencimiento');
    if(sector){
      sector.innerHTML='';
      const b=document.createElement('b');b.textContent='Vencimiento';sector.appendChild(b);
      const span=document.createElement('span');span.dataset.coiObraVencimiento='';span.textContent=fmtDate(getVencimiento(item));sector.appendChild(span);
    }
    const ultima=ensureField(grid,'Última certificación','data-coi-obra-ultima-cert');
    ultima.textContent='Consultando Supabase…';
    const avance=ensureField(grid,'% de avance','data-coi-obra-avance');
    avance.textContent='Consultando Supabase…';
    return {card,ultima,avance};
  }

  function patchRepositorioBase(){
    const body=document.getElementById('fichaOCBody');if(!body)return null;
    const candidates=[...body.querySelectorAll('.grid > div')];
    const div=candidates.find(el=>norm(el.querySelector('b')?.textContent)==='REPOSITORIO DOCUMENTAL');
    if(!div)return null;
    div.innerHTML='';
    const b=document.createElement('b');b.textContent='Repositorio documental';div.appendChild(b);
    const span=document.createElement('span');span.dataset.coiRepoSupabase='';span.textContent='Supabase Storage · verificando…';div.appendChild(span);
    return span;
  }

  async function waitSupabaseReady(){
    for(let i=0;i<15;i++){
      let user=null,client=null;
      try{client=typeof window.getSupabaseClient==='function'?window.getSupabaseClient():null;}catch(e){}
      try{user=typeof window.getUsuarioActual==='function'?await window.getUsuarioActual():null;}catch(e){}
      if(navigator.onLine&&client&&user)return true;
      await new Promise(r=>setTimeout(r,120));
    }
    return false;
  }

  function latestCertification(rows){
    const live=(Array.isArray(rows)?rows:[]).filter(r=>r&&!r._legacy);
    if(!live.length)return null;
    const sorted=live.slice().sort((a,b)=>{
      const da=clean(a.fecha_fin||a.fecha_inicio),db=clean(b.fecha_fin||b.fecha_inicio);
      if(da!==db)return db.localeCompare(da);
      const na=Number(a.acta_medicion_nro)||0,nb=Number(b.acta_medicion_nro)||0;
      return nb-na;
    });
    const last=sorted[0];
    const acta=clean(last.acta_medicion_nro);
    const fecha=clean(last.fecha_fin||last.fecha_inicio);
    const group=live.filter(r=>acta?clean(r.acta_medicion_nro)===acta:clean(r.fecha_fin||r.fecha_inicio)===fecha);
    const values=group.map(r=>pctNumber(r.aux_porcentaje)).filter(v=>v!==null);
    let avanceText='—',avanceTitle='';
    if(values.length){
      const unique=[...new Set(values.map(v=>v.toFixed(6)))];
      const avg=values.reduce((a,b)=>a+b,0)/values.length;
      if(unique.length===1)avanceText=fmtPct(values[0]);
      else{
        avanceText=`Prom. ${fmtPct(avg)}`;
        avanceTitle=`Promedio simple de AUX % de ${values.length} posiciones de la última acta registrada en Supabase.`;
      }
    }
    const label=[acta?`Acta N° ${acta}`:'Certificación',fecha?fmtDate(fecha):''].filter(Boolean).join(' · ');
    return {label:label||'Certificación registrada',avanceText,avanceTitle};
  }

  async function enrichFromSupabase(reference,item,ui,repoSpan,seq){
    const ready=await waitSupabaseReady();
    if(seq!==renderSeq)return;
    if(!ready){
      if(ui){ui.ultima.textContent='Supabase no disponible';ui.avance.textContent='—';}
      if(repoSpan)repoSpan.textContent='Supabase Storage · no disponible';
      return;
    }

    if(ui&&typeof window.cargarCertificacionesPorOC==='function'){
      try{
        const rows=await window.cargarCertificacionesPorOC(item||reference);
        if(seq!==renderSeq)return;
        const last=latestCertification(rows);
        if(last){ui.ultima.textContent=last.label;ui.avance.textContent=last.avanceText;ui.avance.title=last.avanceTitle||'';}
        else{ui.ultima.textContent='Sin certificaciones en Supabase';ui.avance.textContent='—';ui.avance.title='';}
      }catch(error){
        if(seq===renderSeq){ui.ultima.textContent='No disponible';ui.ultima.title=error?.message||'';ui.avance.textContent='—';}
      }
    }

    if(repoSpan&&typeof window.cargarDocumentosStorageOC==='function'){
      try{
        const docs=await window.cargarDocumentosStorageOC(item||reference,{force:false});
        if(seq!==renderSeq)return;
        const count=Array.isArray(docs)?docs.length:0;
        repoSpan.textContent=count?`Supabase Storage · ${count} documento${count===1?'':'s'}`:'Supabase Storage · sin documentos cargados';
      }catch(error){
        if(seq===renderSeq){repoSpan.textContent='Supabase Storage · no disponible';repoSpan.title=error?.message||'';}
      }
    }
  }

  function enhance(reference){
    const seq=++renderSeq;
    const item=resolveItem(reference);
    const ui=item?patchResumenObra(item):null;
    const repoSpan=patchRepositorioBase();
    if(ui||repoSpan)enrichFromSupabase(reference,item,ui,repoSpan,seq);
  }

  function installAlertStyles(){
    if(document.getElementById('coi-alertas-table-fix-v1'))return;
    const style=document.createElement('style');style.id='coi-alertas-table-fix-v1';style.textContent=`
      #vistaCentroAlertas .table-wrap{overflow-x:auto;max-width:100%}
      #vistaCentroAlertas table{min-width:1500px;table-layout:auto}
      #vistaCentroAlertas th,#vistaCentroAlertas td{vertical-align:top;word-break:normal;overflow-wrap:normal}
      #vistaCentroAlertas th:nth-child(1),#vistaCentroAlertas td:nth-child(1){min-width:110px;white-space:nowrap}
      #vistaCentroAlertas th:nth-child(2),#vistaCentroAlertas td:nth-child(2){min-width:125px}
      #vistaCentroAlertas th:nth-child(3),#vistaCentroAlertas td:nth-child(3){min-width:145px}
      #vistaCentroAlertas th:nth-child(4),#vistaCentroAlertas td:nth-child(4){min-width:145px}
      #vistaCentroAlertas th:nth-child(5),#vistaCentroAlertas td:nth-child(5){min-width:300px}
      #vistaCentroAlertas th:nth-child(6),#vistaCentroAlertas td:nth-child(6){min-width:105px;white-space:nowrap}
      #vistaCentroAlertas th:nth-child(7),#vistaCentroAlertas td:nth-child(7){min-width:70px;white-space:nowrap;text-align:center}
      #vistaCentroAlertas th:nth-child(8),#vistaCentroAlertas td:nth-child(8){min-width:170px}
      #vistaCentroAlertas th:nth-child(9),#vistaCentroAlertas td:nth-child(9){min-width:205px}
      #vistaCentroAlertas th:nth-child(10),#vistaCentroAlertas td:nth-child(10){min-width:190px}
      #vistaCentroAlertas th:nth-child(11),#vistaCentroAlertas td:nth-child(11){min-width:155px;white-space:nowrap}
    `;document.head.appendChild(style);
  }

  installAlertStyles();
  const previous=window.renderFichaOC;
  if(typeof previous==='function'){
    window.renderFichaOC=function(reference){
      const result=previous.apply(this,arguments);
      setTimeout(()=>enhance(reference),0);
      return result;
    };
  }
})();
</script>
'''
          if marker not in text:
              pos=text.lower().rfind('</body>')
              if pos<0: raise SystemExit('No se encontro </body>')
              text=text[:pos]+patch+'\n'+text[pos:]

          p.write_text(text,encoding='utf-8')
          PY

          cat > tests/obra_resumen_supabase.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          async function openIsolated(page) {
            await page.route(/^https?:\/(?!\/127\.0\.0\.1)/, route => route.abort());
            await page.addInitScript(() => { localStorage.clear(); sessionStorage.clear(); });
            await page.goto('/index.html', { waitUntil: 'domcontentloaded' });
            await expect(page.locator('body')).toBeVisible();
            await page.waitForFunction(() => typeof window.renderFichaOC === 'function' && typeof window.todasLasOC === 'function');
          }

          async function renderTypeWithSupabaseStubs(page, tipo) {
            return page.evaluate(async tipoBuscado => {
              const rows = window.todasLasOC();
              const row = rows.find(r => String((r.item || r).tipo || '').toLowerCase() === tipoBuscado.toLowerCase());
              if (!row) return { ok:false, reason:`No hay ${tipoBuscado} demo` };
              const item = row.item || row;
              const ref = item.idObra || item.idOC || item.numeroOC || item.oc;
              Object.defineProperty(navigator, 'onLine', { configurable:true, get:() => true });
              window.getSupabaseClient = () => ({ from:()=>({}) });
              window.getUsuarioActual = async () => ({ id:'qa-user' });
              window.cargarCertificacionesPorOC = async () => [
                { nro_oc:item.numeroOC||item.oc, acta_medicion_nro:'7', fecha_inicio:'2026-07-01', fecha_fin:'2026-07-31', aux_porcentaje:62.5 },
                { nro_oc:item.numeroOC||item.oc, acta_medicion_nro:'6', fecha_inicio:'2026-06-01', fecha_fin:'2026-06-30', aux_porcentaje:50 }
              ];
              window.cargarDocumentosStorageOC = async () => [
                { id:'doc-1', nro_oc:item.numeroOC||item.oc, storage_path:'qa/a.pdf' },
                { id:'doc-2', nro_oc:item.numeroOC||item.oc, storage_path:'qa/b.pdf' }
              ];
              window.renderFichaOC(ref);
              return { ok:true, ref };
            }, tipo);
          }

          test('Obra muestra VTO, última certificación y avance desde Supabase sin tocar Finanzas', async ({ page }) => {
            await openIsolated(page);
            const result = await renderTypeWithSupabaseStubs(page, 'Obra');
            expect(result.ok, result.reason || '').toBe(true);
            await expect(page.locator('[data-coi-obra-resumen-source="supabase"]')).toBeVisible();
            const card = page.locator('[data-coi-obra-resumen-source="supabase"]');
            await expect(card).toContainText('Vencimiento');
            await expect(card).toContainText('Última certificación');
            await expect(card).toContainText('% de avance');
            const labels = await card.locator('.grid > div > b').allTextContents();
            expect(labels.map(x=>x.trim().toLowerCase())).not.toContain('sector');
            await expect(card.locator('[data-coi-obra-ultima-cert]')).toContainText('Acta N° 7');
            await expect(card.locator('[data-coi-obra-ultima-cert]')).toContainText('31/07/2026');
            await expect(card.locator('[data-coi-obra-avance]')).toHaveText('62,5%');
            await expect(page.getByText('4. ESTADO FINANCIERO', { exact:false })).toBeVisible();
          });

          test('Repositorio contractual usa Supabase Storage y no ofrece OneDrive', async ({ page }) => {
            await openIsolated(page);
            const result = await renderTypeWithSupabaseStubs(page, 'Obra');
            expect(result.ok, result.reason || '').toBe(true);
            const repo = page.locator('[data-coi-repo-supabase]').first();
            await expect(repo).toHaveText(/Supabase Storage · 2 documentos/);
            const repoParent = repo.locator('..');
            await expect(repoParent).not.toContainText(/OneDrive/i);
            await expect(repoParent.locator('a')).toHaveCount(0);
          });

          test('Servicios conservan Sector en su Resumen General', async ({ page }) => {
            await openIsolated(page);
            const result = await renderTypeWithSupabaseStubs(page, 'Servicio');
            expect(result.ok, result.reason || '').toBe(true);
            await page.waitForTimeout(50);
            const summary = page.locator('.expediente-card').filter({ has: page.getByRole('heading', { name:/1\. Resumen general/i }) }).first();
            await expect(summary).toBeVisible();
            const labels = await summary.locator('.grid > div > b').allTextContents();
            expect(labels.map(x=>x.trim().toLowerCase())).toContain('sector');
            await expect(summary.locator('[data-coi-obra-ultima-cert]')).toHaveCount(0);
          });

          test('Centro de Alertas evita el quiebre vertical de OC y fechas', async ({ page }) => {
            await openIsolated(page);
            await expect(page.locator('#coi-alertas-table-fix-v1')).toHaveCount(1);
            const rules = await page.locator('#coi-alertas-table-fix-v1').textContent();
            expect(rules).toContain('white-space:nowrap');
            expect(rules).toContain('min-width:1500px');
          });
          EOF
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/obra_resumen_supabase.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resumen operativo de Obras con Supabase"
          git push