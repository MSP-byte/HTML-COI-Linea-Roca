name: TMP apply obra summary Supabase fix
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche
        run: python3 .coi-qa/apply_obra_summary_patch.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resumen operativo de Obras con Supabase"
          git push