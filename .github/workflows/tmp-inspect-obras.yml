name: TMP inspect ficha obras
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar runtime documental Supabase
        run: |
          python3 - <<'PY' > inspection_docs_hits.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          terms=['coi_documentos_oc','abrirDocumentoStorageOC','documentosStorage','documentacionOC','cargarDocumentos','renderDocumentos','storage_bucket','storage_path','renderLinksDocumentalesOC','obtenerDocumentos']
          for term in terms:
              hits=[(i+1,l.strip()) for i,l in enumerate(lines) if term in l]
              print(f'\n=== {term} | {len(hits)} ===')
              for n,l in hits[:100]: print(f'{n}: {l[:1800]}')
          PY
      - name: Commit docs hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_docs_hits.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot runtime documental Supabase"
          git push