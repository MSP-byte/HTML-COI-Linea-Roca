name: TMP inspect ficha obras
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar contextos de certificaciones
        run: |
          python3 - <<'PY' > inspection_context2.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          ranges=[
            (3150,3265,'CALCULO FILAS OC / CERTIFICACIONES'),
            (7800,8110,'V62-V64 FICHA CERTIFICACIONES Y DOCUMENTOS'),
            (13220,13680,'CACHE / CRUD CERTIFICACIONES SUPABASE')
          ]
          for a,b,title in ranges:
              print(f'\n===== {title} | {a}-{b} =====')
              for n in range(a,b+1):
                  if n<=len(lines): print(f'{n}: {lines[n-1]}')
          PY
      - name: Commit inspection context 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_context2.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot certificaciones Supabase"
          git push