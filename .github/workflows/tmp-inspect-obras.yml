name: TMP inspect ficha obras
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar runtime de certificaciones
        run: |
          python3 - <<'PY' > inspection_runtime_hits.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          terms=['obtenerResumenCertificacionesOC','certificacionesCacheOC','cargarCertificaciones','obtenerCertificaciones','normalizarCertificacionDesdeSupabase','CERTIFICACIONES_TABLE','renderFichaOC=function','_renderFichaOC','renderFichaOC = function','renderFichaOC=function']
          for term in terms:
              hits=[(i+1,l.strip()) for i,l in enumerate(lines) if term in l]
              print(f'\n=== {term} | {len(hits)} ===')
              for n,l in hits[:80]: print(f'{n}: {l[:1500]}')
          PY
      - name: Commit runtime hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_runtime_hits.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot runtime certificaciones"
          git push