name: Temporary apply E1 PR78

on:
  push:
    branches:
      - feat/etapa1-pipeline-contractual
    paths:
      - .github/workflows/tmp-apply-e1-pr78.yml

permissions:
  contents: write

jobs:
  apply-e1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/etapa1-pipeline-contractual
          fetch-depth: 0
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded E1 fix
        run: python tools/tmp_apply_e1_pr78.py
      - name: Install locked dependencies
        run: npm ci
      - name: Run full repository tests
        run: npm test
      - name: Validate diff and JavaScript syntax
        run: |
          git diff --check
          node --check tests/etapa1_pipeline_contractual.spec.js
          node --check tests/check_etapa1_hardening.js
      - name: Commit to the existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden Etapa 1 contractual gate"
          git push origin HEAD:feat/etapa1-pipeline-contractual
