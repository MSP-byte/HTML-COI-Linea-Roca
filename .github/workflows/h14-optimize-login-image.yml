name: H14 Optimize Login Image

on:
  push:
    branches:
      - feat/h14-login-auth-seguridad
    paths:
      - .github/workflows/h14-optimize-login-image.yml
      - index.html
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h14-optimize-login-image.yml
      - index.html

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/h14-login-auth-seguridad
          fetch-depth: 0

      - name: Extract embedded JPEG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data:image/jpeg;base64,'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('No embedded H14 JPEG found')
          data_start = start + len(marker)
          end = s.find('"', data_start)
          if end < 0:
              raise SystemExit('Could not find closing quote for embedded H14 JPEG')
          payload = re.sub(r'\s+', '', s[data_start:end])
          raw = base64.b64decode(payload + '===', validate=False)
          Path('/tmp/h14-login-source.jpg').write_bytes(raw)
          print(f'Extracted {len(raw)} bytes')
          PY

      - name: Install ImageMagick
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Recompress login image
        shell: bash
        run: |
          convert /tmp/h14-login-source.jpg -auto-orient -resize '1600x1200>' -strip -interlace Plane -quality 68 /tmp/h14-login-optimized.jpg
          ls -lh /tmp/h14-login-source.jpg /tmp/h14-login-optimized.jpg

      - name: Replace embedded JPEG with optimized payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data:image/jpeg;base64,'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('No embedded H14 JPEG found during replacement')
          data_start = start + len(marker)
          end = s.find('"', data_start)
          if end < 0:
              raise SystemExit('Could not find closing quote during replacement')
          payload = base64.b64encode(Path('/tmp/h14-login-optimized.jpg').read_bytes()).decode('ascii')
          s = s[:data_start] + payload + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')
          print(f'New base64 payload chars: {len(payload)}')
          PY

      - name: Sanity checks
        shell: bash
        run: |
          test $(grep -Eio '<!doctype[[:space:]]+html[[:space:]]*>' index.html | wc -l) -eq 1
          git diff --check
          echo "index.html bytes: $(wc -c < index.html)"

      - name: Commit optimized image
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore(h14): optimize embedded login image'
          git push origin HEAD:feat/h14-login-auth-seguridad
