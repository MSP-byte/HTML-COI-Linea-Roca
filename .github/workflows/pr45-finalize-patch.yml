name: PR45 finalize patch

on:
  push:
    branches:
      - feat/timeline-supabase-first
    paths:
      - .github/workflows/pr45-finalize-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true

      - name: Patch final review findings and mobile smoke
        run: python tools/pr45_patch.py

      - name: Validate Timeline static contract
        run: |
          npm ci
          node tests/check_timeline_supabase_first.js
          git diff --check

      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm .github/workflows/pr45-finalize-patch.yml tools/pr45_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/delete_button.spec.js tests/final_ux_alerts_orders_filter.spec.js tests/check_timeline_supabase_first.js .github/workflows/pr45-finalize-patch.yml tools/pr45_patch.py
          git commit -m "fix: cerrar review final del timeline"
          git push origin HEAD:feat/timeline-supabase-first
