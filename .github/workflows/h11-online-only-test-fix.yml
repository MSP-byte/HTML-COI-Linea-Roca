name: H11 online-only test contract fix

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[h11-testbot]') && !contains(github.event.head_commit.message, '[h11-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          persist-credentials: true
          fetch-depth: 0

      - name: Patch static contracts for session-only storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/check_h07_cierre_localstorage.js')
          s = p.read_text(encoding='utf-8')
          old = "check(purge.indexOf('localStorage.removeItem(CACHE_KEY);') >= 0,"
          new = "check(purge.indexOf('sessionStorage.removeItem(CACHE_KEY);') >= 0,"
          if old not in s:
              raise SystemExit('H11: expected H07 purge assertion not found')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          pkg = Path('package.json')
          q = pkg.read_text(encoding='utf-8')
          needle = 'node tests/check_h06_localstorage_non_authoritative.js && node tests/check_h07_cierre_localstorage.js'
          repl = 'node tests/check_h11_online_only.js && node tests/check_h06_localstorage_non_authoritative.js && node tests/check_h07_cierre_localstorage.js'
          if needle not in q:
              raise SystemExit('H11: package test chain anchor not found')
          q = q.replace(needle,repl,1)
          pkg.write_text(q,encoding='utf-8')
          PY

      - name: Commit contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/check_h07_cierre_localstorage.js package.json
          git diff --cached --check
          git commit -m "[h11-testbot] test: align static contracts with online-only storage"
          git push origin HEAD:fix/h11-online-only-no-localstorage

      - name: Install dependencies
        run: npm ci

      - name: Run full static suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused browser regressions
        run: npx playwright test tests/h06_localstorage_non_authoritative.spec.js tests/h07_cierre_localstorage.spec.js tests/dashboard_focus_v2_shell.spec.js tests/dashboard_charts_motion_paused.spec.js --project=chromium-desktop --workers=1
