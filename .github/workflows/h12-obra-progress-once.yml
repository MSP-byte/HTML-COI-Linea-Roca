name: H12 obra progress one-shot

on:
  push:
    branches:
      - feat/obra-avance-manual

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/obra-avance-manual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Expediente Digital Obra
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'COI_OBRA_PROGRESS_MANUAL_H12'
          fragment = Path('tools/h12_obra_progress_fragment.html').read_text(encoding='utf-8')
          close = '</body></html>'
          if marker in s:
              raise SystemExit('H12 marker already present')
          if s.count(close) != 1:
              raise SystemExit(f'Expected one closing marker, found {s.count(close)}')
          p.write_text(s.replace(close, fragment + close), encoding='utf-8')
          PY
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate implementation
        run: |
          node tests/check_obra_avance_manual.js
          npm run validate:html
          node tests/check_css_syntax.js
          npx playwright test tests/obra_avance_manual.spec.js
      - name: Commit implementation
        shell: bash
        run: |
          rm -f tools/h12_obra_progress_fragment.html
          rm -f .github/workflows/h12-obra-progress-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/obra_avance_manual.spec.js tests/check_obra_avance_manual.js tools/h12_obra_progress_fragment.html .github/workflows/h12-obra-progress-once.yml
          git commit -m "feat: add manual obra progress and latest acta card"
          git push origin HEAD:feat/obra-avance-manual
