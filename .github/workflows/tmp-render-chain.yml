name: TMP inspect final render chain
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer renderer efectivo
        run: |
          python3 - <<'PY' > inspection_render_effective.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          ranges=[
            (5450,5840,'RENDER BASE FICHA'),
            (14920,15125,'WRAPPER MULTIESTACION'),
            (15840,16040,'SUPABASE EDIT / REFRESH'),
            (17280,17435,'CANONICAL ORDER WRAPPER'),
            (25220,25425,'HOTFIX ACTUAL')
          ]
          for a,b,title in ranges:
              print(f'\n===== {title} {a}-{b} =====')
              for n in range(a,b+1):
                  if n<=len(lines): print(f'{n}: {lines[n-1]}')
          PY
      - name: Commit inspeccion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_render_effective.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot renderer efectivo"
          git push