name: TMP inspect final render chain
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer cadena final de render
        run: |
          python3 - <<'PY' > inspection_render_chain.txt
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8',errors='replace').splitlines()
          terms=['window.renderFichaOC','renderFichaOC =','renderFichaOC=','function renderFichaOC','fichaOCBody','buscarOrdenPorReferencia','obtenerOC','APP_STATE','ordenSeleccionada','ocSeleccionada']
          seen=[]
          for term in terms:
              hits=[i for i,l in enumerate(lines) if term in l]
              print(f'\n### {term} | HITS {len(hits)}')
              for i in hits:
                  if term.startswith('renderFichaOC') or term=='window.renderFichaOC' or term=='function renderFichaOC':
                      key=(max(0,i-55),min(len(lines),i+100))
                      if key in seen: continue
                      seen.append(key)
                      a,b=key
                      print(f'\n===== CONTEXT {a+1}-{b} =====')
                      for j in range(a,b): print(f'{j+1}: {lines[j]}')
                  else:
                      print(f'{i+1}: {lines[i][:1800]}')
          PY
      - name: Commit inspeccion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection_render_chain.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot cadena final de render"
          git push