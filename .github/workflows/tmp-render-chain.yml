name: TMP apply QA hook obra summary
# retrigger 2026-08-18
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar hook QA acotado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='COI_OBRA_RESUMEN_QA_HOOK_V1'
          old='''  installAlertStyles();\n  const previous=window.renderFichaOC;'''
          new='''  /* COI_OBRA_RESUMEN_QA_HOOK_V1: usa exactamente el mismo decorador productivo, sin persistir datos. */\n  window.COI_OBRA_RESUMEN_SUPABASE_V1=Object.freeze({\n    async decorateForQA(reference,item){\n      const seq=++renderSeq;\n      const ui=item?patchResumenObra(item):null;\n      const repoSpan=patchRepositorioBase();\n      if(ui||repoSpan) await enrichFromSupabase(reference,item,ui,repoSpan,seq);\n      return {obra:Boolean(ui),repositorio:Boolean(repoSpan)};\n    },\n    latestCertification\n  });\n\n  installAlertStyles();\n  const previous=window.renderFichaOC;'''
          if marker not in text:
              if old not in text: raise SystemExit('No se encontro ancla del hotfix Obras')
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: exponer hook QA del resumen de Obras"
          git push