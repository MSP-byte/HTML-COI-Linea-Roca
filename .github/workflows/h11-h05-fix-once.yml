name: H11 H05 test alignment once

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage
    paths:
      - .github/workflows/h11-h05-fix-once.yml

permissions:
  contents: write

jobs:
  align-h05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          fetch-depth: 0
      - name: Align H05 residue assertions with H11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/h05_um_st_supabase_first.spec.js')
          s = p.read_text(encoding='utf-8')
          old1 = """  // El legado se conserva fisicamente: no se borra, solo deja de ser autoridad.\n  expect(e.legacyUMReal).not.toBeNull();\n  expect(JSON.parse(e.legacyUMReal)).toHaveLength(UM_LEGACY.length);"""
          new1 = """  // H11 no exige preservar fisicamente el residuo: solo que nunca entre al runtime\n  // ni reciba escrituras operativas desde la aplicacion.\n  expect(e.escriturasLegacy).toEqual([]);"""
          if old1 not in s:
              raise SystemExit('No se encontro la asercion H05 #1 esperada')
          s = s.replace(old1, new1, 1)
          s = s.replace("  const antes = JSON.stringify(UM_LEGACY);\n", "", 1)
          old_expect = "  expect(e.legacyUMReal).toBe(antes);\n"
          if old_expect not in s:
              raise SystemExit('No se encontro la asercion H05 #3 esperada')
          s = s.replace(old_expect, "", 1)
          s = s.replace(
              "  // Ninguna escritura llega al almacenamiento: el contenido legado sigue siendo\n  // byte a byte el que estaba antes de arrancar.\n",
              "  // Ninguna escritura operativa de UM/ST llega al almacenamiento persistente.\n  // El residuo fisico pre-H11 es opaco y no forma parte del contrato runtime.\n",
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/h05_um_st_supabase_first.spec.js
          git rm .github/workflows/h11-h05-fix-once.yml
          git commit -m "test: align H05 legacy residue with H11 cutover"
          git push origin HEAD:fix/h11-online-only-no-localstorage
