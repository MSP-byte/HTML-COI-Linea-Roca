name: H10 Router Finalize

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0

      - name: Apply deterministic H10 patch
        run: python3 .github/h10_router_finalize.py

      - name: Install dependencies
        run: npm ci

      - name: Run static regression suite
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Remove one-shot finalizer
        run: |
          rm -f .github/h10_router_finalize.py
          rm -f .github/workflows/h10-router-finalize.yml

      - name: Commit and push final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/h10_routing_cierre_archivo.spec.js .github/h10_router_finalize.py .github/workflows/h10-router-finalize.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(h10): preserve startup route during restore"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
