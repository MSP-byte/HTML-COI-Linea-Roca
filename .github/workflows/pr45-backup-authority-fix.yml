name: PR45 Backup Authority Fix

on:
  push:
    branches: ["feat/timeline-supabase-first"]
    paths: [".github/workflows/pr45-backup-authority-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true
          fetch-depth: 0

      - name: Apply backup authority patch
        run: python3 tests/pr45_backup_authority_patch.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              f = Path(tempfile.gettempdir()) / f'coi-pr45-backup-{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'inline script {i} failed')
          print(f'{len(scripts)} inline scripts OK')
          PY

      - name: Commit fix and remove temporary runner
        run: |
          git rm .github/workflows/pr45-backup-authority-fix.yml tests/pr45_backup_authority_patch.py
          git add index.html
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git commit -m "fix: block Timeline backups until Supabase is authoritative"
          git push origin HEAD:feat/timeline-supabase-first
