name: Apply unsaved edit guard navigation fix

on:
  push:
    branches: [fix/final-navigation-top-scrollbars]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-navigation-top-scrollbars
          persist-credentials: true
          fetch-depth: 0
      - run: python3 .github/scripts/apply_unsaved_guard_nav_fix.py
      - run: git diff --check
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve unsaved-edit guard on OC back navigation"
          git push origin HEAD:fix/final-navigation-top-scrollbars
