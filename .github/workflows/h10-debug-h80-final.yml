name: H10 debug H80 final

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-debug-h80-final.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, re, subprocess
          from pathlib import Path
          old = subprocess.check_output(['git','show','bb6a0da52bc4de40173392653dee8ed48bd1fc5b:.github/workflows/h10-final-review-patch.yml'], text=True)
          m = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", old)
          if not m: raise SystemExit('payload missing')
          Path('/tmp/h10_final_review_patch.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          subprocess.check_call(['python','/tmp/h10_final_review_patch.py'])
          import textwrap
          y = Path('.github/workflows/h10-final-review-patch-v2.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s+PY", y, flags=re.S)
          for idx in [1,2,3,4,5]:
              exec(compile(textwrap.dedent(blocks[idx]), f'<helper-{idx}>', 'exec'), {})
          PY
      - name: Capture generated H10-80 and routing code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('tests/h10_routing_cierre_archivo.spec.js').read_text(encoding='utf-8')
          i=t.index('H10-80')
          start=t.rfind('test(',0,i)
          end=t.find('\ntest(',i)
          if end<0: end=min(len(t),i+5000)
          s=Path('index.html').read_text(encoding='utf-8')
          chunks=[]
          for marker in ['function rutaIntencionDesdeEvento', 'function navegarVistaUsuario', 'function observarNavegacionUsuario', 'async function aplicar(ruta)', "document.addEventListener('keydown',event=>"]:
              p=s.find(marker)
              if p>=0: chunks.append(s[p:p+3500])
          out=['# H10-80 generated diagnostic','', '## TEST', '```js', t[start:end], '```','', '## ROUTER / V2', '```js', '\n\n---\n\n'.join(chunks), '```','']
          Path('docs/agent/H10_DEBUG_H80.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Install Chromium
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run H10-80 and append output
        shell: bash
        run: |
          set +e
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-80' --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=0 --reporter=line > /tmp/h80.log 2>&1
          status=$?
          {
            echo
            echo '## PLAYWRIGHT OUTPUT'
            echo '```text'
            cat /tmp/h80.log
            echo '```'
            echo
            echo "exit_status=$status"
          } >> docs/agent/H10_DEBUG_H80.md
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MSP-byte'
          git config user.email 'mespecial92@gmail.com'
          git add docs/agent/H10_DEBUG_H80.md
          git commit -m 'debug(h10): capture H10-80 generated candidate' || exit 0
          git push origin HEAD:fix/h10-routing-close-archive-workflow
