name: COI Final UI Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/ficha-obras-alertas-supabase' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: fix/ficha-obras-alertas-supabase
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar parche definitivo y limpiar temporales
        run: node .coi-qa/apply-final-ui-v1.mjs
      - name: Validar instalación del parche
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="coi-ficha-obra-final-v1"' index.html
          grep -q 'coi-centro-alertas-legibilidad-v1' index.html
          grep -q 'data-coi-obra-ultima-certificacion' index.html
          grep -q 'data-coi-obra-avance' index.html
      - name: Commit del parche final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios para commitear'
            exit 0
          fi
          git commit -m 'fix: cerrar ficha Obras y Centro de Alertas [final-ui-applied]'
          git push origin HEAD:fix/ficha-obras-alertas-supabase
