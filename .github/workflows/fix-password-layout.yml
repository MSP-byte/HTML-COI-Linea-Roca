name: Fix password button layout
on:
  push:
    branches: [feat/cambio-password-seguro]
    paths: [.github/workflows/fix-password-layout.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cambio-password-seguro
      - name: Move security action out of content overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="#coiPwdBtn{position:fixed;right:22px;bottom:22px;z-index:99990;border:0;border-radius:10px;padding:11px 15px;background:#1f4e79;color:#fff;font:600 13px system-ui;box-shadow:0 4px 18px #0003;cursor:pointer}"
          new="#coiPwdBtn{position:static;display:block;margin:20px 22px 20px auto;border:0;border-radius:10px;padding:11px 15px;background:#1f4e79;color:#fff;font:600 13px system-ui;box-shadow:0 4px 18px #0003;cursor:pointer}"
          if old not in s:
              raise SystemExit("expected password button CSS not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep password action out of operational controls"
          git push origin HEAD:feat/cambio-password-seguro
