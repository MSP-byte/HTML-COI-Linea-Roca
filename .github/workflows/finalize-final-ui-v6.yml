name: Finalize final UI v6
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
    paths:
      - .coi-qa/finalize.trigger6
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obra-resumen-repositorio-supabase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar v4
        id: patch
        continue-on-error: true
        run: |
          set +e
          node .coi-qa/finalize_final_ui_v4.mjs > .coi-qa/finalize-result-v4.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> .coi-qa/finalize-result-v4.txt
          exit $code
      - if: steps.patch.outcome == 'success'
        run: node --check tests/obra_resumen_supabase.spec.js
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coi-qa/finalize-result-v4.txt
          if [ "${{ steps.patch.outcome }}" = "success" ]; then git add index.html tests/obra_resumen_supabase.spec.js; fi
          git commit -m "fix: cerrar limpieza OneDrive y PyC" || exit 0
          git push origin HEAD:fix/obra-resumen-repositorio-supabase
