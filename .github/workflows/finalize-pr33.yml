name: Finalize PR33

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.ref == 'fix/ficha-obras-alertas-supabase' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fix/ficha-obras-alertas-supabase
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar cierre final
        run: node .coi-qa/finalize-pr33.mjs
      - name: Validar resultados
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="coi-ficha-obra-final-v1"' index.html
          grep -q 'data-coi-obra-ultima-certificacion' index.html
          grep -q 'data-coi-obra-avance' index.html
          ! grep -qi '>Agregar link documental<' index.html
          ! grep -qi '>Marcar enviado a PyC<' index.html
          ! grep -qi 'Abrir OneDrive' index.html
          test -f tests/final_ui_obras_alertas.spec.js
      - name: Commit definitivo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
            exit 0
          fi
          git commit -m 'fix: finalizar ficha Obras y Centro de Alertas'
          git push origin HEAD:fix/ficha-obras-alertas-supabase
