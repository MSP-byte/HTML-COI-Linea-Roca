name: H13 observer stabilization
on:
  push:
    branches: [fix/h13-ordenes-avance-acta-alertas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h13-ordenes-avance-acta-alertas
          fetch-depth: 0
      - name: Stabilize observer
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const root=q('#vistaOrdenes');if(root)new MutationObserver(schedule).observe(root,{subtree:true,childList:true});"
          new="const root=q('#vistaOrdenes');if(root)new MutationObserver(()=>{const heads=qa('table.ordenes-table thead th',root);if(heads.some(h=>['SECTOR','ESTADO COI'].includes(fold(h.textContent))))schedule();}).observe(root,{subtree:true,childList:true});"
          if old not in s: raise SystemExit('observer target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit stabilization
        run: |
          rm .github/workflows/h13-fix-observer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/h13-fix-observer.yml
          git commit -m "fix: stabilize H13 orders observer"
          git push origin HEAD:fix/h13-ordenes-avance-acta-alertas
