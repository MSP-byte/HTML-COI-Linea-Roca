name: PR45 Order Authority

on:
  push:
    branches: ["feat/timeline-supabase-first"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true
          fetch-depth: 0

      - name: Patch index
        run: python3 tests/pr45_order_authority_patch.py

      - name: Check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              f = Path(tempfile.gettempdir()) / ('coi-pr45-' + str(i) + '.js')
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(i)
          print('inline JavaScript OK')
          PY

      - name: Commit
        run: |
          git rm .github/workflows/pr45-order-authority-fix.yml tests/pr45_order_authority_patch.py
          git add index.html
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git commit -m "fix: resolve Timeline OC identity in Supabase"
          git push origin HEAD:feat/timeline-supabase-first
