name: H11 online-only migration

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[h11-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Migrate runtime away from localStorage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s.count('localStorage')
          # H11 policy: no persistent browser-local storage. Session-only browser
          # state is allowed for auth/session/UI; operational truth remains Supabase.
          s = s.replace('localStorage', 'sessionStorage')
          # Make Supabase Auth persistence explicitly session-scoped instead of the
          # library default persistent storage.
          needle = "auth: {\n              persistSession: true,\n              autoRefreshToken: true,\n              detectSessionInUrl: true\n            }"
          repl = "auth: {\n              persistSession: true,\n              storage: window.sessionStorage,\n              autoRefreshToken: true,\n              detectSessionInUrl: true\n            }"
          if needle not in s:
              raise SystemExit('H11: Supabase auth block not found')
          s = s.replace(needle, repl, 1)
          # Correct current visible guidance so the live app no longer tells users
          # that operational data is stored in the browser.
          s = s.replace('Use Carga para importar CSV desde Excel y guardar en sessionStorage.',
                        'Use Carga para importar y sincronizar datos con Supabase.')
          s = s.replace('Se guarda automáticamente en sessionStorage al escribir.',
                        'La persistencia operativa local está deshabilitada; use el circuito documental en Supabase.')
          p.write_text(s, encoding='utf-8')
          after = s.count('localStorage')
          print(f'H11 localStorage occurrences: {before} -> {after}')
          if after != 0:
              raise SystemExit('H11: localStorage remains in index.html')
          if 'storage: window.sessionStorage' not in s:
              raise SystemExit('H11: Supabase Auth is not pinned to sessionStorage')
          PY

      - name: Add H11 static contract
        shell: bash
        run: |
          cat > tests/check_h11_online_only.js <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const assert = (cond,msg)=>{ if(!cond){ console.error('H11 FAIL:',msg); process.exit(1); } };
          assert(!html.includes('localStorage'), 'index.html must contain zero localStorage references');
          assert(html.includes('storage: window.sessionStorage'), 'Supabase Auth must use sessionStorage explicitly');
          assert(html.includes('__COI_SUPABASE_SOURCE_OF_TRUTH__'), 'Supabase source-of-truth guard must remain present');
          assert(html.includes("url: \"https://ooepgbzqlpjrtpaoqawc.supabase.co\""), 'production Supabase project must remain configured');
          console.log('H11 online-only static contract: PASS');
          JS
          node tests/check_h11_online_only.js

      - name: Commit migration
        shell: bash
        run: |
          git add index.html tests/check_h11_online_only.js
          git diff --cached --check
          git commit -m "[h11-bot] refactor: remove persistent localStorage runtime"
          git push origin HEAD:fix/h11-online-only-no-localstorage

      - name: Install dependencies
        run: npm ci

      - name: Run static suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused online-only regressions
        run: npx playwright test tests/h06_localstorage_non_authoritative.spec.js tests/dashboard_focus_v2_shell.spec.js tests/dashboard_charts_motion_paused.spec.js --project=chromium-desktop --workers=1
