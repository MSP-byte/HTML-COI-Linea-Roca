name: Apply final filters and expiry order

on:
  push:
    branches: [fix/final-filters-expiry-order]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-filters-expiry-order
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused patch
        run: python3 .github/scripts/apply_final_filters_expiry.py
      - name: Validate static suite
        run: |
          npm test
          git diff --check
      - name: Commit product patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: simplify filters and restore expiry ordering"
          git push origin HEAD:fix/final-filters-expiry-order
