name: TMP PR81 final review

on:
  push:
    branches: [hotfix/etapa1-fecha-rpc-v3]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/etapa1-fecha-rpc-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply final review fixes
        run: python .github/scripts/fix_pr81_round2.py
      - name: Install dependencies
        run: npm ci
      - name: Static regression
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Contractual integration desktop and mobile
        run: npx playwright test tests/etapa1_ficha_integracion.spec.js --project=chromium-desktop --project=chromium-mobile
      - name: Validate diff
        run: |
          git diff --check
          test "$(grep -c '<!DOCTYPE html>' index.html)" -eq 1
      - name: Commit final fixes
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git rm .github/workflows/tmp-pr81-round2.yml .github/scripts/fix_pr81_round2.py
          git add index.html supabase/migrations tests
          git commit -m "fix: cerrar reingresos y aliases legacy de etapa contractual"
          git push origin HEAD:hotfix/etapa1-fecha-rpc-v3
