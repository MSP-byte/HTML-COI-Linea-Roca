name: Admin Login Render Fix

on:
  push:
    branches:
      - fix/admin-login-supabase
    paths:
      - .coi-qa/apply-admin-login-render-fix.mjs
      - .github/workflows/admin-login-render-fix.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-login-supabase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar normalización final
        run: node .coi-qa/apply-admin-login-render-fix.mjs
      - name: Validar parche
        run: |
          git diff --check
          grep -q "Cerrar sesión de administrador" index.html
          if grep -q "Administrador autenticado':(isAdmin?'Cerrar sesion de administrador':'Iniciar sesion como administrador" index.html; then
            echo "Persistió el renderer legacy"
            exit 1
          fi
      - name: Commit del parche
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(auth): unificar renderer del botón administrador"
          git push origin HEAD:fix/admin-login-supabase
