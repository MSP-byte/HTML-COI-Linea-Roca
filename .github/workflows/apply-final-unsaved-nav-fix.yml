name: Apply final unsaved navigation fix

on:
  push:
    branches: [fix/final-navigation-top-scrollbars]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-navigation-top-scrollbars
          persist-credentials: true
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/scripts/apply_final_unsaved_nav_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve unsaved edit guard on OC return"
          git push origin HEAD:fix/final-navigation-top-scrollbars
