name: H10 final review corrections

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-final-review-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decode and apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/h10_final_review_patch.py
          python /tmp/h10_final_review_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate static suite
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/h10_routing_cierre_archivo.spec.js
          npm test
          git diff --check

      - name: Validate new H10 regressions desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --project=chromium-desktop --project=chromium-mobile --grep 'H10-(71|72|73|74|75|76|77|78|79|80|81|82|83)' --workers=1

      - name: Commit clean final review corrections
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/h10-final-review-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase/migrations/202609070001_h10_order_lifecycle_guard.sql tests/h10_routing_cierre_archivo.spec.js tests/check_h10_routing_cierre_archivo.js tests/check_h10_insert_lifecycle_guard.js .github/workflows/h10-final-review-patch.yml
          git diff --cached --check
          git commit -m "fix(h10): close final lifecycle and routing review gaps"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
