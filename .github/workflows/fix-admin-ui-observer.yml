name: Apply admin UI observer fix

on:
  push:
    branches:
      - feat/admin-resumen-economico-duplicados
    paths:
      - tools/fix_admin_ui_observer.js

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/fix_admin_ui_observer.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: scope admin UI observer to orders table"
          git push
