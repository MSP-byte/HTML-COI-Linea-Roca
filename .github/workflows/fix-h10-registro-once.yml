name: Fix H10 registro filter once

on:
  push:
    branches:
      - fix/h10-registro-filter-v581r

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-registro-filter-v581r
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch active V58.1R orders filter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = ",mesC=clean($('ordenesFiltroMesCert')?.value),onlyActive=fold($('uxOrderContext')?.textContent).includes('SOLO OCS ACTIVAS');"
          new1 = ",mesC=clean($('ordenesFiltroMesCert')?.value),registro=clean($('ordenesFiltroRegistro')?.value).toLowerCase()||'activas',onlyActive=fold($('uxOrderContext')?.textContent).includes('SOLO OCS ACTIVAS');"
          if s.count(old1) != 1:
              raise SystemExit(f'Expected exactly one filter declaration target, found {s.count(old1)}')
          s = s.replace(old1, new1, 1)

          old2 = "const i=rowItem(row),type=rowType(row),text=fold([rowId(row),rowOC(row),type,row.estacion||i.estacion,row.proveedor||i.proveedor,row.sector||i.sector,row.umVinculada||i.umVinculada||i.unidadMantenimiento,row.tipoTrabajo||i.tipoTrabajo||i.tipo_trabajo,row.estado||i.estado||i.estado_coi,row.estadoDocumental||i.estadoDocumental||i.estado_documental].join(' '));"
          new2 = "const i=rowItem(row),type=rowType(row),estadoRegistro=String(row.estadoRegistro||row.estado_registro||i.estadoRegistro||i.estado_registro||(i._supabaseRaw&&i._supabaseRaw.estado_registro)||'').trim().toUpperCase(),archivada=estadoRegistro==='ARCHIVADO'||estadoRegistro==='ARCHIVADA',text=fold([rowId(row),rowOC(row),type,row.estacion||i.estacion,row.proveedor||i.proveedor,row.sector||i.sector,row.umVinculada||i.umVinculada||i.unidadMantenimiento,row.tipoTrabajo||i.tipoTrabajo||i.tipo_trabajo,row.estado||i.estado||i.estado_coi,row.estadoDocumental||i.estadoDocumental||i.estado_documental].join(' '));"
          if s.count(old2) != 1:
              raise SystemExit(f'Expected exactly one row filter target, found {s.count(old2)}')
          s = s.replace(old2, new2, 1)

          old3 = "&&(!mesV||monthKey(rowVenc(row))===mesV)&&(!mesC||monthKey(rowCert(row))===mesC)&&(!onlyActive||isActive(row));"
          new3 = "&&(!mesV||monthKey(rowVenc(row))===mesV)&&(!mesC||monthKey(rowCert(row))===mesC)&&(registro==='todas'||(registro==='archivadas'?archivada:!archivada))&&(!onlyActive||isActive(row));"
          if s.count(old3) != 1:
              raise SystemExit(f'Expected exactly one return predicate target, found {s.count(old3)}')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run focused H10 registro tests
        run: npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep "H10-(53|54|55)"

      - name: Static syntax sanity
        run: |
          npm run validate:html
          node tests/check_css_syntax.js

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-h10-registro-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-h10-registro-once.yml
          git commit -m "fix: enforce registro filter in active orders renderer"
          git push origin HEAD:fix/h10-registro-filter-v581r
