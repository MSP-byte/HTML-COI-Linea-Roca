name: Ficha OC hydration one-shot

on:
  push:
    branches:
      - fix/ficha-oc-supabase-hydration
    paths:
      - .github/workflows/ficha-oc-hydration-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ficha-oc-supabase-hydration
          fetch-depth: 0

      - name: Apply focused fix
        run: python3 .github/scripts/fix_ficha_oc_hydration.py

      - name: Validate diff
        run: |
          git diff --check
          test "$(grep -o 'id="coi-expediente-hydration-r1"' index.html | wc -l)" -eq 1
          test -f tests/ficha_oc_supabase_hydration.spec.js

      - name: Commit and push
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: hydrate expediente OC from Supabase fields"
          git push origin HEAD:fix/ficha-oc-supabase-hydration
