name: Aplicar corrección de selección de órdenes

on:
  push:
    branches:
      - fix/seleccion-ordenes-checkbox
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    name: Corregir selección sin abrir expediente
    if: ${{ !contains(github.event.head_commit.message || '', '[checkbox-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Aplicar corrección y prueba de regresión
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old_handler_1 = """  document.addEventListener('click',ev=>{\n    const btn=ev.target.closest('[data-open-oc]');\n    if(btn){ ev.preventDefault(); abrirFichaOC(btn.dataset.openOc); }\n  });"""
          new_handler_1 = """  document.addEventListener('click',ev=>{\n    /* coi-orders-selection-propagation-fix-v60: los controles de selección no abren la ficha de la fila. */\n    if(ev.target.closest('#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas')) return;\n    const btn=ev.target.closest('[data-open-oc]');\n    if(btn){ ev.preventDefault(); abrirFichaOC(btn.dataset.openOc); }\n  });"""

          old_handler_2 = """    document.addEventListener('click',ev=>{\n      const oc=ev.target.closest('[data-open-oc]'); if(oc){ev.preventDefault(); ev.stopPropagation(); safeOpenOCFix(oc.dataset.openOc); return;}"""
          new_handler_2 = """    document.addEventListener('click',ev=>{\n      /* coi-orders-selection-propagation-fix-v60: evita que el click del checkbox burbujee como apertura de expediente. */\n      if(ev.target.closest('#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas')) return;\n      const oc=ev.target.closest('[data-open-oc]'); if(oc){ev.preventDefault(); ev.stopPropagation(); safeOpenOCFix(oc.dataset.openOc); return;}"""

          if text.count(old_handler_1) != 1:
              raise SystemExit(f'No se encontró exactamente una vez el primer handler esperado: {text.count(old_handler_1)}')
          if text.count(old_handler_2) != 1:
              raise SystemExit(f'No se encontró exactamente una vez el segundo handler esperado: {text.count(old_handler_2)}')

          text = text.replace(old_handler_1, new_handler_1, 1)
          text = text.replace(old_handler_2, new_handler_2, 1)
          index.write_text(text, encoding='utf-8', newline='')

          test = Path('tests/check_order_selection.js')
          test.write_text("""'use strict';

const assert = require('assert');
const fs = require('fs');

const html = fs.readFileSync('index.html', 'utf8');
const guard = "#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas";

assert.strictEqual((html.match(/coi-orders-selection-propagation-fix-v60/g) || []).length, 2,
  'Los dos handlers globales que abren la OC deben proteger la selección');

const firstHandler = html.match(/\/\* coi-orders-selection-propagation-fix-v60: los controles[\s\S]{0,500}?abrirFichaOC\(btn\.dataset\.openOc\);/);
assert(firstHandler, 'Existe el guard del handler histórico de apertura de ficha');
assert(firstHandler[0].indexOf("closest('#vistaOrdenes") < firstHandler[0].indexOf("closest('[data-open-oc]')"),
  'El guard se evalúa antes de buscar data-open-oc');

const secondHandler = html.match(/\/\* coi-orders-selection-propagation-fix-v60: evita[\s\S]{0,600}?safeOpenOCFix\(oc\.dataset\.openOc\);/);
assert(secondHandler, 'Existe el guard del handler seguro de apertura');
assert(secondHandler[0].indexOf("closest('#vistaOrdenes") < secondHandler[0].indexOf("closest('[data-open-oc]')"),
  'El guard seguro se evalúa antes de abrir la OC');

assert(html.includes("row&&!ev.target.closest('input,button,a,select,textarea,label')"),
  'El handler final de la fila sigue ignorando controles interactivos');
assert(html.includes("const chk=ev.target.closest('.chk-orden-row')"),
  'Se conserva el handler de cambio de los checkboxes');
assert(html.includes("if($('btnBorrarSeleccionadas'))$('btnBorrarSeleccionadas').disabled=!total"),
  'La selección continúa habilitando Borrar seleccionadas');
assert.strictEqual((html.match(/id="btnBorrarSeleccionadas"/g) || []).length, 1,
  'Existe un único botón Borrar seleccionadas');

function shouldOpen(target) {
  if (target.closest(guard)) return false;
  return Boolean(target.closest('[data-open-oc]'));
}
const fake = (matches) => ({ closest: (selector) => matches.has(selector) ? {} : null });
assert.strictEqual(shouldOpen(fake(new Set([guard, '[data-open-oc]']))), false,
  'Un checkbox dentro de una fila no abre el expediente');
assert.strictEqual(shouldOpen(fake(new Set(['[data-open-oc]']))), true,
  'Una celda normal de la fila conserva la apertura del expediente');

console.log('Selección Órdenes: checkbox aislado, selección masiva, botón de borrado y apertura de fila protegidos.');
""", encoding='utf-8', newline='')

          workflow = Path('.github/workflows/quality-gate.yml')
          quality = workflow.read_text(encoding='utf-8')
          anchor = """      - name: Ejecutar CRUD seguro de Ordenes con mocks\n        run: node tests/check_crud_ordenes.js\n"""
          addition = anchor + """\n      - name: Validar selección de órdenes sin apertura accidental\n        run: node tests/check_order_selection.js\n"""
          if 'node tests/check_order_selection.js' not in quality:
              if quality.count(anchor) != 1:
                  raise SystemExit('No se encontró el punto de inserción en quality-gate.yml')
              quality = quality.replace(anchor, addition, 1)
              workflow.write_text(quality, encoding='utf-8', newline='')
          PY

      - name: Ejecutar controles automáticos
        shell: bash
        run: |
          node tests/check_baseline.js
          node tests/check_order_selection.js
          node tests/check_delete_persistence.js
          node tests/check_crud_ordenes.js
          node tests/check_fase_b_v60.js

      - name: Retirar workflow temporal y publicar el commit
        shell: bash
        run: |
          rm .github/workflows/apply-checkbox-selection-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_order_selection.js .github/workflows/quality-gate.yml .github/workflows/apply-checkbox-selection-fix.yml
          git diff --cached --check
          git commit -m "fix: seleccionar órdenes sin abrir expediente [checkbox-fix-applied]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
