name: H10 Finalize PR64

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout H10 branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact review fixes
        run: python .github/scripts/h10_finalize_pr64.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run static and integration suite
        run: npm test

      - name: Validate patch
        run: git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_h10_routing_cierre_archivo.js
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "fix(h10): keep startup pending and sync executive close"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
