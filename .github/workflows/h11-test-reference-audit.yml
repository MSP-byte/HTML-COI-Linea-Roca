name: H11 test reference audit

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[h11-auditbot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          persist-credentials: true
          fetch-depth: 0

      - name: Inventory localStorage references in tests
        shell: bash
        run: |
          {
            echo '# H11 localStorage test reference audit'
            echo
            echo 'Generated from branch fix/h11-online-only-no-localstorage.'
            echo
            grep -RIn --include='*.js' --include='*.spec.js' 'localStorage' tests || true
          } > .h11-localstorage-test-audit.txt
          cat .h11-localstorage-test-audit.txt

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .h11-localstorage-test-audit.txt
          git diff --cached --check
          git commit -m "[h11-auditbot] chore: inventory legacy localStorage test references"
          git push origin HEAD:fix/h11-online-only-no-localstorage
