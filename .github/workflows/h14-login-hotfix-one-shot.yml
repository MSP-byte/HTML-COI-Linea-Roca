name: H14 Login Hotfix One Shot

on:
  push:
    branches:
      - fix/h14-login-imagen-credenciales

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h14-login-imagen-credenciales
          persist-credentials: true
          fetch-depth: 0

      - name: Patch H14 login
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = "H14-LOGIN-HOTFIX-2"
          if marker in html:
              print('H14 hotfix already applied')
          else:
              style_start = html.index('<style id="coi-auth-h14-style">')
              style_end = html.index('</style>', style_start)
              style = html[style_start:style_end]
              style, image_count = re.subn(
                  r'url\("data:image/jpeg;base64,[^"]+"\)',
                  'url("assets/plaza-constitucion-login-2024.jpg")',
                  style,
                  count=1,
              )
              if image_count != 1:
                  raise SystemExit(f'Expected exactly one H14 embedded image, got {image_count}')
              if 'background-repeat:no-repeat' not in style:
                  style = style.replace(
                      'background-size:cover;background-position:center center;',
                      'background-size:cover;background-position:center center;background-repeat:no-repeat;',
                      1,
                  )
              html = html[:style_start] + style + html[style_end:]

              clean_line = "const clean=v=>String(v??'').trim();"
              if clean_line not in html:
                  raise SystemExit('H14 clean helper anchor not found')
              html = html.replace(
                  clean_line,
                  clean_line + "\nconst H14_LOGIN_HOTFIX='H14-LOGIN-HOTFIX-2';\nconst normalizarEmailLogin=value=>clean(value).toLowerCase().replace(/[.,;:]+$/g,'');",
                  1,
              )

              old_submit = "const email=clean($('coiAuthEmailH14')?.value),password=String($('coiAuthPasswordH14')?.value||'');"
              new_submit = "const emailInput=$('coiAuthEmailH14'),email=normalizarEmailLogin(emailInput?.value),password=String($('coiAuthPasswordH14')?.value||'');\n  if(emailInput)emailInput.value=email;"
              if old_submit not in html:
                  raise SystemExit('H14 submit anchor not found')
              html = html.replace(old_submit, new_submit, 1)

              old_error = "setMessage(error?.message||'No se pudo iniciar sesión.','error');"
              new_error = "const raw=clean(error?.message);\n    const friendly=fold(raw).includes('invalid login credentials')?'Correo o contraseña incorrectos. Revisá los datos e intentá nuevamente.':(raw||'No se pudo iniciar sesión.');\n    setMessage(friendly,'error');"
              if old_error not in html:
                  raise SystemExit('H14 login error anchor not found')
              html = html.replace(old_error, new_error, 1)
              p.write_text(html, encoding='utf-8')

          p = Path('tests/check_h14_auth_gate.js')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              "assert(html.includes('data:image/jpeg;base64,'), 'La imagen de Plaza Constitución debe quedar embebida en index.html');",
              "assert(html.includes('assets/plaza-constitucion-login-2024.jpg'), 'H14 debe usar la imagen HD de Plaza Constitución como asset');\nconst h14Style = html.match(/<style id=\"coi-auth-h14-style\">[\\s\\S]*?<\\/style>/i)?.[0]||'';\nassert(!h14Style.includes('data:image/jpeg;base64,'), 'H14 no debe degradar la imagen mediante un data URL embebido');\nassert(html.includes('normalizarEmailLogin'), 'H14 debe normalizar el correo antes de autenticar');\nassert(html.includes('Correo o contraseña incorrectos.'), 'H14 debe mostrar un error de credenciales en español');"
          )
          p.write_text(t, encoding='utf-8')

          p = Path('tests/h14_auth_gate.spec.js')
          t = p.read_text(encoding='utf-8')
          t = t.replace("expect(background).toContain('data:image/jpeg;base64');", "expect(background).toContain('plaza-constitucion-login-2024.jpg');")
          p.write_text(t, encoding='utf-8')

      - name: Validate focused H14 contracts
        run: |
          test -f assets/plaza-constitucion-login-2024.jpg
          grep -q 'H14-LOGIN-HOTFIX-2' index.html
          grep -q 'assets/plaza-constitucion-login-2024.jpg' index.html
          grep -q 'normalizarEmailLogin' index.html
          grep -q 'Correo o contraseña incorrectos.' index.html

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_h14_auth_gate.js tests/h14_auth_gate.spec.js
          git commit -m "fix(h14): apply HD login background and normalize credentials"
          git push origin HEAD:fix/h14-login-imagen-credenciales
