name: H11 fast alignment validation v2

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[h11-fastv2bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          persist-credentials: true
          fetch-depth: 0
      - name: Apply H11 alignment
        run: |
          python scripts/h11_align_legacy_tests.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/h03_observaciones_supabase_first.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("expect(resultado.legadoPersistente).toBe(31);", "expect(resultado.legadoPersistente).toBe(0);", 1)
          s=s.replace("expect(estadoLegacy.persistentes).toBe(2);", "expect(estadoLegacy.persistentes).toBe(0);", 1)
          s=s.replace("F10b · sin marker el residuo localStorage queda intacto pero invisible para H11", "F10b · sin marker el residuo localStorage queda invisible para H11", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static suite
        run: |
          npm ci
          npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Targeted H11 browser regressions
        run: |
          set +e
          npx playwright test tests/h03_observaciones_supabase_first.spec.js --project=chromium-desktop --workers=1 --grep "Supabase vacio ignora|F10 ·|F10b ·|ningun writer activo"
          a=$?
          npx playwright test tests/h05_um_st_supabase_first.spec.js --project=chromium-desktop --workers=1 --grep "3b ·|4 · el residuo|45 ·|85 ·|86 ·|crear UM escribe|crear ST escribe|guardar la edicion"
          b=$?
          npx playwright test tests/h06_localstorage_non_authoritative.spec.js --project=chromium-desktop --workers=1
          c=$?
          npx playwright test tests/h01_contain_legacy_localstorage.spec.js tests/h11_online_only.spec.js tests/proxima_certificacion.spec.js tests/final_ux_alerts_orders_filter.spec.js tests/dashboard_focus_v2_shell.spec.js --project=chromium-desktop --workers=1
          d=$?
          echo "H03=$a H05=$b H06=$c adjacent=$d"
          test $a -eq 0 -a $b -eq 0 -a $c -eq 0 -a $d -eq 0
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/h03_observaciones_supabase_first.spec.js tests/h05_um_st_supabase_first.spec.js tests/h06_localstorage_non_authoritative.spec.js
          git diff --cached --check
          git commit -m "[h11-fastv2bot] test: align legacy regressions with online-only visibility"
          git push origin HEAD:fix/h11-online-only-no-localstorage