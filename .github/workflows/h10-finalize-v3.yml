name: H10 finalize v3

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-finalize-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild validated candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, re, subprocess, textwrap
          from pathlib import Path
          old = subprocess.check_output(['git','show','bb6a0da52bc4de40173392653dee8ed48bd1fc5b:.github/workflows/h10-final-review-patch.yml'], text=True)
          m = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", old)
          if not m: raise SystemExit('payload missing')
          Path('/tmp/h10_final_review_patch.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          subprocess.check_call(['python','/tmp/h10_final_review_patch.py'])
          y = Path('.github/workflows/h10-final-review-patch-v2.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s+PY", y, flags=re.S)
          if len(blocks) < 6: raise SystemExit(f'expected >=6 python blocks, got {len(blocks)}')
          for idx in [1,2,3,4,5]:
              exec(compile(textwrap.dedent(blocks[idx]), f'<helper-{idx}>', 'exec'), {})
          PY
      - name: Resolve quick access directly by module id
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""    const acceso = t.closest('[data-v2-open-module]');
    if (acceso) {
      const id = texto(acceso.getAttribute('data-v2-open-module'));
      const botones = Array.from(document.querySelectorAll('[data-v2-nav]'));
      const espejo = botones.find((b) => texto(b.getAttribute('data-v2-nav')) === id);
      if (espejo) return rutaIntencionDesdeVista(espejo.getAttribute('data-v2-view'));
    }"""
          new="""    const acceso = t.closest('[data-v2-open-module]');
    if (acceso) {
      const id = texto(acceso.getAttribute('data-v2-open-module'));
      const vistasPorModulo = {
        btnDashboard: 'vistaDashboard', btnOrdenes: 'vistaOrdenes',
        btnCalendarioCOI: 'vistaCalendarioCOI', btnCentroAlertas: 'vistaCentroAlertas',
        btnRed: 'vistaRed', btnUnidadesMantenimiento: 'vistaUnidadesMantenimiento',
        btnCarga: 'vistaCarga', btnTimelineCOI: 'vistaTimelineCOI',
        btnAdministracionSistema: 'vistaAdministracionSistema', btnAcercaSistema: 'vistaAcercaSistema'
      };
      const vistaDirecta = vistasPorModulo[id] || '';
      if (vistaDirecta) return rutaIntencionDesdeVista(vistaDirecta);
      const espejo = Array.from(document.querySelectorAll('[data-v2-nav]'))
        .find((b) => texto(b.getAttribute('data-v2-nav')) === id);
      if (espejo) return rutaIntencionDesdeVista(espejo.getAttribute('data-v2-view'));
    }"""
          if s.count(old)!=1: raise SystemExit(f'module resolver matches={s.count(old)}')
          s=s.replace(old,new,1)
          old2="const id=module.dataset.v2OpenModule;const vista=NAV.find(item=>item.id===id)?.view||'';const rutaTemprana="
          new2="const id=module.dataset.v2OpenModule;const vista={btnDashboard:'vistaDashboard',btnOrdenes:'vistaOrdenes',btnCalendarioCOI:'vistaCalendarioCOI',btnCentroAlertas:'vistaCentroAlertas',btnRed:'vistaRed',btnUnidadesMantenimiento:'vistaUnidadesMantenimiento',btnCarga:'vistaCarga',btnTimelineCOI:'vistaTimelineCOI',btnAdministracionSistema:'vistaAdministracionSistema',btnAcercaSistema:'vistaAcercaSistema'}[id]||NAV.find(item=>item.id===id)?.view||'';const rutaTemprana="
          if s.count(old2)!=1: raise SystemExit(f'early module resolver matches={s.count(old2)}')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Normalize text EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['tests/check_h10_insert_lifecycle_guard.js','tests/check_h10_routing_cierre_archivo.js','tests/h10_routing_cierre_archivo.spec.js']:
              p=Path(f); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
      - name: Install and validate static suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check tests/h10_routing_cierre_archivo.spec.js
          npm test
          git diff --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate H10-80 desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-80' --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=0
      - name: Validate H10-71 to H10-83 desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-(71|72|73|74|75|76|77|78|79|80|81|82|83)' --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=0
      - name: Commit functional corrections and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/h10-final-review-patch.yml \
            .github/workflows/h10-final-review-patch-v2.yml \
            .github/workflows/h10-inspect-h80.yml \
            .github/workflows/h10-test-direct-intent.yml \
            .github/workflows/h10-debug-h80-final.yml \
            .github/workflows/h10-finalize-v3.yml \
            docs/agent/H10_DEBUG_H80.md
          git config user.name 'MSP-byte'
          git config user.email 'mespecial92@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(h10): close lifecycle routing and final review gaps'
          git push origin HEAD:fix/h10-routing-close-archive-workflow
