name: H10 final review corrections v2

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-final-review-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build final H10 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, re, subprocess, textwrap
          from pathlib import Path

          def replace_one(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old, new, 1)

          # 1) Rebuild the deterministic final-review candidate.
          old = subprocess.check_output([
              'git','show','bb6a0da52bc4de40173392653dee8ed48bd1fc5b:.github/workflows/h10-final-review-patch.yml'
          ], text=True)
          m = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", old)
          if not m:
              raise SystemExit('validated payload missing')
          Path('/tmp/h10_final_review_patch.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          subprocess.check_call(['python','/tmp/h10_final_review_patch.py'])

          # 2) Apply the five validated follow-up transformations from the last executable v2 helper.
          y = subprocess.check_output([
              'git','show','792e94538a4775f094f4a15eb6e0179748e3c910:.github/workflows/h10-final-review-patch-v2.yml'
          ], text=True)
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s+PY", y, flags=re.S)
          if len(blocks) < 6:
              raise SystemExit(f'expected >=6 python blocks, got {len(blocks)}')
          for idx in [1,2,3,4,5]:
              exec(compile(textwrap.dedent(blocks[idx]), f'<helper-{idx}>', 'exec'), {})

          # 3) H10-80: resolve quick-access module intent directly, without depending on a sidebar mirror.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_resolver = """    const acceso = t.closest('[data-v2-open-module]');
    if (acceso) {
      const id = texto(acceso.getAttribute('data-v2-open-module'));
      const botones = Array.from(document.querySelectorAll('[data-v2-nav]'));
      const espejo = botones.find((b) => texto(b.getAttribute('data-v2-nav')) === id);
      if (espejo) return rutaIntencionDesdeVista(espejo.getAttribute('data-v2-view'));
    }"""
          new_resolver = """    const acceso = t.closest('[data-v2-open-module]');
    if (acceso) {
      const id = texto(acceso.getAttribute('data-v2-open-module'));
      const vistasPorModulo = {
        btnDashboard: 'vistaDashboard', btnOrdenes: 'vistaOrdenes',
        btnCalendarioCOI: 'vistaCalendarioCOI', btnCentroAlertas: 'vistaCentroAlertas',
        btnRed: 'vistaRed', btnUnidadesMantenimiento: 'vistaUnidadesMantenimiento',
        btnCarga: 'vistaCarga', btnTimelineCOI: 'vistaTimelineCOI',
        btnAdministracionSistema: 'vistaAdministracionSistema', btnAcercaSistema: 'vistaAcercaSistema'
      };
      const vistaDirecta = vistasPorModulo[id] || '';
      if (vistaDirecta) return rutaIntencionDesdeVista(vistaDirecta);
      const espejo = Array.from(document.querySelectorAll('[data-v2-nav]'))
        .find((b) => texto(b.getAttribute('data-v2-nav')) === id);
      if (espejo) return rutaIntencionDesdeVista(espejo.getAttribute('data-v2-view'));
    }"""
          s = replace_one(s, old_resolver, new_resolver, 'direct module intent resolver')

          # 4) The H10 observer already understands keydown, but it must own trusted Enter/Space
          #    in CAPTURE phase; otherwise the V2 bubble handler can synthesize a click and race
          #    the startup deep-link back into the ficha.
          old_keyboard = """    if (intencion) {
      const desdeTeclado = ev.type === 'keydown';
      if (desdeTeclado) ev.preventDefault();
      navegacionUsuario++;
      publicar(intencion);
      if (desdeTeclado || aplicando) Promise.resolve(aplicar(intencion)).catch(() => {});
      return;
    }"""
          new_keyboard = """    if (intencion) {
      const desdeTeclado = ev.type === 'keydown';
      if (desdeTeclado) {
        ev.preventDefault();
        ev.stopPropagation();
        ev.stopImmediatePropagation();
      }
      navegacionUsuario++;
      publicar(intencion);
      if (desdeTeclado || aplicando) Promise.resolve(aplicar(intencion)).catch(() => {});
      return;
    }"""
          s = replace_one(s, old_keyboard, new_keyboard, 'keyboard ownership')

          old_bind = """    document.addEventListener('click', observarNavegacionUsuario, true);
    document.addEventListener('change', observarNavegacionUsuario, true);"""
          new_bind = """    document.addEventListener('click', observarNavegacionUsuario, true);
    document.addEventListener('keydown', observarNavegacionUsuario, true);
    document.addEventListener('change', observarNavegacionUsuario, true);"""
          s = replace_one(s, old_bind, new_bind, 'keydown capture bind')

          # Keep the pre-router V2 keyboard fallback deterministic too.
          old_early = "const id=module.dataset.v2OpenModule;const vista=NAV.find(item=>item.id===id)?.view||'';const rutaTemprana="
          new_early = "const id=module.dataset.v2OpenModule;const vista={btnDashboard:'vistaDashboard',btnOrdenes:'vistaOrdenes',btnCalendarioCOI:'vistaCalendarioCOI',btnCentroAlertas:'vistaCentroAlertas',btnRed:'vistaRed',btnUnidadesMantenimiento:'vistaUnidadesMantenimiento',btnCarga:'vistaCarga',btnTimelineCOI:'vistaTimelineCOI',btnAdministracionSistema:'vistaAdministracionSistema',btnAcercaSistema:'vistaAcercaSistema'}[id]||NAV.find(item=>item.id===id)?.view||'';const rutaTemprana="
          s = replace_one(s, old_early, new_early, 'pre-router direct module map')
          p.write_text(s, encoding='utf-8')

          # Lock this exact regression statically in addition to H10-80 runtime coverage.
          q = Path('tests/check_h10_routing_cierre_archivo.js')
          t = q.read_text(encoding='utf-8')
          marker = "console.log('H10 final review guards: OK');"
          extra = """check(routerCodigo.indexOf(\"document.addEventListener('keydown', observarNavegacionUsuario, true);\") >= 0,
  'H10 debe capturar Enter/Espacio antes del handler V2 durante una ruta pendiente');
check(routerCodigo.indexOf('ev.stopImmediatePropagation();') >= 0,
  'la intención de teclado H10 debe impedir que el handler legacy vuelva a sintetizar navegación');

"""
          if extra.strip() not in t:
              if marker not in t:
                  raise SystemExit('static marker missing')
              t = t.replace(marker, extra + marker, 1)
          q.write_text(t.rstrip() + '\n', encoding='utf-8')

          for f in ['tests/check_h10_insert_lifecycle_guard.js','tests/h10_routing_cierre_archivo.spec.js']:
              z = Path(f)
              z.write_text(z.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate static suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check tests/h10_routing_cierre_archivo.spec.js
          npm test
          git diff --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate H10-80 desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-80' --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=0

      - name: Validate H10-71 to H10-83 desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-(71|72|73|74|75|76|77|78|79|80|81|82|83)' --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=0

      - name: Commit functional corrections and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/h10-final-review-patch.yml
          rm -f .github/workflows/h10-final-review-patch-v2.yml
          rm -f .github/workflows/h10-inspect-h80.yml
          rm -f .github/workflows/h10-test-direct-intent.yml
          rm -f .github/workflows/h10-debug-h80-final.yml
          rm -f .github/workflows/h10-finalize-v3.yml
          rm -f docs/agent/H10_DEBUG_H80.md
          git config user.name 'MSP-byte'
          git config user.email 'mespecial92@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(h10): close lifecycle routing and final review gaps'
          git push origin HEAD:fix/h10-routing-close-archive-workflow
