name: TMP fix contractual v3 fixtures
on:
  push:
    branches:
      - feat/etapa1-tipo-fecha-efectiva
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fixture-v3-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/etapa1-tipo-fecha-efectiva
          fetch-depth: 0
      - name: Actualizar fixture contractual a RPC v3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/contractual_ct_hotfix.spec.js')
          s = p.read_text(encoding='utf-8')

          old = "if (name === 'coi_confirmar_etapa_circuito_v2') {"
          new = "if (name === 'coi_confirmar_etapa_circuito_v2' || name === 'coi_confirmar_etapa_circuito_v3') {"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('No se encontró el mock contractual v2/v3')

          if 'fecha_efectiva: args.p_fecha_efectiva || null,' not in s:
              s, n = re.subn(
                  r"(\s+fecha_evento: new Date\(\)\.toISOString\(\),\n)(\s+usuario_email: user\.email)",
                  r"\1                fecha_efectiva: args.p_fecha_efectiva || null,\n\2",
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit(f'No se encontró bloque de historial del mock: {n}')

          old_filter = "const confirmaciones = state.writes.filter(write => write.name === 'coi_confirmar_etapa_circuito_v2');"
          new_filter = "const confirmaciones = state.writes.filter(write => write.name === 'coi_confirmar_etapa_circuito_v3');"
          if old_filter in s:
              s = s.replace(old_filter, new_filter, 1)
          elif new_filter not in s:
              raise SystemExit('No se encontró aserción de RPC contractual')

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -q "coi_confirmar_etapa_circuito_v2' || name === 'coi_confirmar_etapa_circuito_v3" tests/contractual_ct_hotfix.spec.js
          grep -q "fecha_efectiva: args.p_fecha_efectiva || null" tests/contractual_ct_hotfix.spec.js
          grep -q "write.name === 'coi_confirmar_etapa_circuito_v3'" tests/contractual_ct_hotfix.spec.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/contractual_ct_hotfix.spec.js
          git commit -m 'test: adaptar fixture contractual a RPC v3 [fixture-v3-done]'
          git push origin HEAD:feat/etapa1-tipo-fecha-efectiva
