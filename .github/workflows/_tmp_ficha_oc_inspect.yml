name: TEMP Ficha OC Validate
on:
  push:
    branches:
      - feat/ficha-oc-indicadores-obra-servicio
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch and capture validation
        run: |
          python .github/scripts/_tmp_apply_ficha_oc.py
          set +e
          node --check tests/ficha_oc_indicadores_obra_servicio.spec.js > ficha_validate.log 2>&1
          echo "NODE_CHECK_EXIT=$?" >> ficha_validate.log
          npm run test:unit >> ficha_validate.log 2>&1
          echo "UNIT_EXIT=$?" >> ficha_validate.log
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ficha_validate.log
          git commit -m 'chore: capture Ficha OC validation log [skip ci]'
          git push
