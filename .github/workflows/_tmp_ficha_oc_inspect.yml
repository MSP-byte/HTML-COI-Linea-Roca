name: TEMP Ficha OC Finalize
on:
  push:
    branches:
      - feat/ficha-oc-indicadores-obra-servicio
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python .github/scripts/_tmp_apply_ficha_oc.py
      - name: Validate
        run: |
          node --check tests/ficha_oc_indicadores_obra_servicio.spec.js
          npm run test:unit
      - name: Commit product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/ficha_oc_indicadores_obra_servicio.spec.js
          git commit -m 'feat: add Obra Servicio indicators to Ficha OC'
          git push
