name: TEMP Ficha OC Inspect
on:
  push:
    branches: [feat/ficha-oc-indicadores-obra-servicio]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Ficha OC snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          lines=src.splitlines()
          terms=[
            'function renderFichaOC',
            'renderFichaOC(',
            'progressFromPersistedCertification',
            'cargarCertificacionesPorOC',
            'function renderCTCard',
            'injectCT',
            'aux_porcentaje',
            'Días restantes',
            'Dias restantes',
            'Próxima certificación',
            'Proxima certificacion',
            'Estado documental',
            'Control de Terceros',
            'coi-ficha-obra-supabase-summary'
          ]
          out=[]
          for term in terms:
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
              out.append(f'===== {term} :: {[i+1 for i in hits]} =====')
              for i in hits[-8:]:
                  a=max(0,i-35); b=min(len(lines),i+70)
                  out.extend(f'{j+1:05d}: {lines[j]}' for j in range(a,b))
                  out.append('---')
          Path('ficha_oc_inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ficha_oc_inspect.txt
          git commit -m 'chore: capture active Ficha OC snippets [skip ci]'
          git push
