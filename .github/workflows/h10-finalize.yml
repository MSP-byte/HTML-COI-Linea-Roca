name: H10 Final Review Fix Gate

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow

permissions:
  contents: write

jobs:
  apply-final-h10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "f962f8d61cbe6fb58c2dc4cf9bc6e059623881a8"
          test "$(git hash-object tests/h10_routing_cierre_archivo.spec.js)" = "436b0a89452f79993db6797f39f2f7b55ebb1593"
          test "$(git hash-object tests/check_h10_routing_cierre_archivo.js)" = "94d10770db839b8cd38ea3f6ffe9a8c018acb5c6"

      - name: Apply deterministic H10 fixes
        run: |
          python3 .github/h10_finalize.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/h10_routing_cierre_archivo.spec.js')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tests/h10_routing_cierre_archivo.spec.js
          node --check tests/check_h10_routing_cierre_archivo.js
          grep -q "COI_CLOSURE_IMMUTABLE" supabase/migrations/202609070001_h10_order_lifecycle_guard.sql
          grep -q "COI_ARCHIVE_REQUIRES_CLOSED_ORDER" supabase/migrations/202609070001_h10_order_lifecycle_guard.sql

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete static and integration suite
        run: npm test

      - name: Publish functional commit on same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/h10_finalize.py .github/workflows/h10-finalize.yml
          git add index.html tests/h10_routing_cierre_archivo.spec.js tests/check_h10_routing_cierre_archivo.js \
            supabase/migrations/202609070001_h10_order_lifecycle_guard.sql \
            docs/agent/03_SUPABASE_DATA_MODEL.md docs/agent/04_FUNCTIONAL_RULES.md docs/agent/14_TECHNICAL_DECISIONS.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(h10): seal lifecycle invariants before merge"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
