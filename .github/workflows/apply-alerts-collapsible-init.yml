name: Apply alerts collapsible init hotfix

on:
  push:
    branches: [fix/alerts-collapsible-init-race]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alerts-collapsible-init-race
          persist-credentials: true
          fetch-depth: 0
      - name: Apply focused product patch
        run: python3 .github/scripts/apply_alerts_collapsible_init.py
      - name: Validate patch
        run: |
          git diff --check
          node --check tests/alerts_collapsible_init.spec.js
      - name: Commit product and regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/alerts_collapsible_init.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize and collapse executive alerts"
          git push origin HEAD:fix/alerts-collapsible-init-race
