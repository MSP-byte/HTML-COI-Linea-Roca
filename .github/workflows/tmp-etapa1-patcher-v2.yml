name: TMP validate Etapa1 tipo fecha
on:
  push:
    branches:
      - feat/etapa1-tipo-fecha-efectiva
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/etapa1-tipo-fecha-efectiva
          fetch-depth: 0
      - name: Repair idempotente del renderer
        shell: bash
        run: |
          python3 tools/tmp_patch_etapa1_tipo_fecha.py
          git diff --check
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: completar renderer por tipo y fecha efectiva [repair-done]"
            git push origin HEAD:feat/etapa1-tipo-fecha-efectiva
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: npm test
        run: npm test
      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright integración contractual desktop + mobile
        run: npx playwright test tests/etapa1_ficha_integracion.spec.js --project=chromium-desktop --project=chromium-mobile
