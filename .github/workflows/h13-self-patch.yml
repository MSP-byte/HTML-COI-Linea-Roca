name: H13 surgical patch
on:
  push:
    branches: [fix/h13-ordenes-avance-acta-alertas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h13-ordenes-avance-acta-alertas
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'coi-h13-ordenes-avance-acta-alertas' in s:
              raise SystemExit('H13 already present')
          patch=r'''<script id="coi-h13-ordenes-avance-acta-alertas">
          (function(){
            'use strict';
            const q=(s,c=document)=>c.querySelector(s),qa=(s,c=document)=>Array.from(c.querySelectorAll(s));
            const text=v=>String(v??'').trim(),fold=v=>text(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
            const client=()=>{try{return typeof window.getSupabaseClient==='function'?window.getSupabaseClient():(window.__COI_SUPABASE_CLIENT__||null);}catch(e){return null;}};
            const isAdmin=()=>{try{return typeof window.esAutorizacionAdministrativaSupabaseV60==='function'&&window.esAutorizacionAdministrativaSupabaseV60();}catch(e){return false;}};
            const itemOf=r=>r?.item||r||{},ocOf=r=>text(r?.oc||r?.nro_oc||itemOf(r).numeroOC||itemOf(r).oc||itemOf(r).nro_oc||itemOf(r)._supabaseRaw?.nro_oc),typeOf=r=>text(r?.tipo||itemOf(r).tipo);
            function progressOf(r){if(fold(typeOf(r))!=='OBRA')return '—';const i=itemOf(r),raw=i?._supabaseRaw||r?._supabaseRaw||{},v=raw.avance_obra_pct??i.avance_obra_pct??r?.avance_obra_pct;if(v===null||v===undefined||text(v)==='')return '—';const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(n)+'%':'—';}
            let seq=0;
            async function fillLastActs(){const my=++seq,cells=qa('#vistaOrdenes #ordenesTbody [data-h13-acta-oc]'),ocs=[...new Set(cells.map(x=>text(x.dataset.h13ActaOc)).filter(Boolean))];if(!ocs.length)return;try{if(window.__coiSupabaseReady)await window.__coiSupabaseReady;}catch(e){}const c=client();if(!c){cells.forEach(x=>x.textContent='—');return;}try{const res=await c.from('coi_certificaciones').select('nro_oc,acta_medicion_nro,fecha_inicio,fecha_fin,fecha_actualizacion').in('nro_oc',ocs).limit(5000);if(res.error)throw res.error;if(my!==seq)return;const best=new Map(),stamp=r=>text(r.fecha_fin||r.fecha_inicio||r.fecha_actualizacion);(res.data||[]).filter(r=>text(r.acta_medicion_nro)).forEach(r=>{const oc=text(r.nro_oc),prev=best.get(oc);if(!prev||stamp(r)>stamp(prev)||(stamp(r)===stamp(prev)&&Number(r.acta_medicion_nro||0)>Number(prev.acta_medicion_nro||0)))best.set(oc,r);});cells.forEach(x=>{const r=best.get(text(x.dataset.h13ActaOc));x.textContent=r?text(r.acta_medicion_nro):'—';x.title=r?'Última Acta de Medición registrada en Supabase':'Sin Acta de Medición registrada';});}catch(err){console.warn('COI H13 Actas',err);if(my===seq)cells.forEach(x=>x.textContent='—');}}
            function enhanceOrders(){const table=q('#vistaOrdenes table.ordenes-table'),tbody=q('#vistaOrdenes #ordenesTbody');if(!table||!tbody)return;const heads=qa('thead th',table),si=heads.findIndex(x=>fold(x.textContent)==='SECTOR'),ei=heads.findIndex(x=>fold(x.textContent)==='ESTADO COI');if(si>=0){heads[si].textContent='% AVANCE';heads[si].className='col-avance';}if(ei>=0){heads[ei].textContent='ULT. ACTA MED Nº';heads[ei].className='col-acta-med';}const rows=[];try{if(typeof window.obtenerOrdenesFiltradas==='function')rows.push(...(window.obtenerOrdenesFiltradas()||[]));else if(typeof window.todasLasOC==='function')rows.push(...(window.todasLasOC()||[]));}catch(e){}const map=new Map();rows.forEach(r=>{const i=itemOf(r);[r?.idObra,r?.idServicio,r?.idSeleccion,i?.idObra,i?.idServicio,i?.idOC,ocOf(r)].filter(Boolean).forEach(k=>map.set(text(k),r));});qa('tr[data-open-oc]',tbody).forEach(tr=>{const cs=Array.from(tr.cells),key=text(tr.dataset.openOc),r=map.get(key)||rows.find(x=>ocOf(x)===key)||null;if(si>=0&&cs[si]){cs[si].className='col-avance';cs[si].textContent=progressOf(r);cs[si].title=fold(typeOf(r))==='OBRA'?'Avance manual de obra':'No aplica a Servicios';}if(ei>=0&&cs[ei]){const oc=ocOf(r);cs[ei].className='col-acta-med';cs[ei].dataset.h13ActaOc=oc;cs[ei].textContent=oc?'…':'—';}});fillLastActs();}
            let timer=0;const schedule=()=>{clearTimeout(timer);timer=setTimeout(enhanceOrders,50);};
            function openAlerts(ev){if(!isAdmin())return;ev.preventDefault();ev.stopImmediatePropagation();try{if(typeof window.mostrarVista==='function')window.mostrarVista('vistaCentroAlertas');else{qa('.view').forEach(v=>v.classList.remove('active'));q('#vistaCentroAlertas')?.classList.add('active');}qa('#moduleNav button,.module-nav button').forEach(b=>b.classList.toggle('active',b.id==='btnCentroAlertas'));if(typeof window.renderCentroAlertas==='function')window.renderCentroAlertas();else if(typeof window.renderCentroAlertasFix==='function')window.renderCentroAlertasFix();}catch(err){console.error('COI H13 Centro Alertas',err);}}
            function bindAlerts(){const b=q('#btnCentroAlertas');if(!b||b.dataset.h13AlertsBound==='1')return;b.dataset.h13AlertsBound='1';b.addEventListener('click',openAlerts,true);}
            function init(){bindAlerts();schedule();const root=q('#vistaOrdenes');if(root)new MutationObserver(schedule).observe(root,{subtree:true,childList:true});new MutationObserver(bindAlerts).observe(document.body,{subtree:true,childList:true});window.COI_H13={enhanceOrders,fillLastActs,bindAlerts};}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          </script>'''
          if '</body>' not in s: raise SystemExit('Missing </body>')
          p.write_text(s.replace('</body>',patch+'\n</body>',1),encoding='utf-8')
      - name: Commit H13
        run: |
          rm .github/workflows/h13-self-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/h13-self-patch.yml
          git commit -m "fix: show obra progress, latest acta and restore alerts navigation"
          git push origin HEAD:fix/h13-ordenes-avance-acta-alertas
