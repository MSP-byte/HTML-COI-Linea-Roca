name: H06 Finalize Last Review

on:
  push:
    branches: [fix/h06-localstorage-non-authoritative]
    paths:
      - .github/workflows/h06-finalize-last-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h06-localstorage-non-authoritative
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar exactamente los dos fixes H06 pendientes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'index.html';
          const testPath = 'tests/check_h06_localstorage_non_authoritative.js';
          let html = fs.readFileSync(indexPath, 'utf8');
          let test = fs.readFileSync(testPath, 'utf8');

          function replaceOnce(source, from, to, label) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: se esperaban 1 coincidencia y hubo ${count}`);
            return source.replace(from, to);
          }

          html = replaceOnce(
            html,
            "  async function upsertOrdenSupabase(orden, options = {}) {\n    await requireSupabaseWriteAccess();",
            "  async function upsertOrdenSupabase(orden, options = {}) {\n    const user = await requireSupabaseWriteAccess();",
            'capturar UID del write de Ordenes'
          );

          html = replaceOnce(
            html,
            "    action = result.data?.accion || (existente ? 'updated' : 'inserted');\n    const canonicalRow = result.data?.orden || existente;\n    const cleanup = await consolidarDuplicadosSupabase(payload.nro_oc, canonicalRow);",
            "    action = result.data?.accion || (existente ? 'updated' : 'inserted');\n    const canonicalRow = result.data?.orden || existente;\n    // H06 final: el RPC ya confirmo la mutacion. El snapshot en memoria se\n    // actualiza ANTES de una recarga que podria fallar, para no restaurar la\n    // version pre-write en modo degradado.\n    if (canonicalRow) {\n      const normalizedConfirmed = normalizarOrdenDesdeSupabase(canonicalRow);\n      const confirmedKey = normalizeNroOC(normalizedConfirmed?.nro_oc || payload.nro_oc);\n      const confirmedBase = Array.isArray(ordenesConfirmadas) ? ordenesConfirmadas : [];\n      ordenesConfirmadas = deduplicarOrdenes([\n        ...confirmedBase.filter((item) => normalizeNroOC(item?.nro_oc) !== confirmedKey),\n        normalizedConfirmed\n      ]);\n      ordenesConfirmadasUid = user?.id || ordenesConfirmadasUid;\n    }\n    const cleanup = await consolidarDuplicadosSupabase(payload.nro_oc, canonicalRow);",
            'actualizar snapshot confirmado de Ordenes tras write'
          );

          html = replaceOnce(
            html,
            "  function purgarPosicionConfirmada(id){confirmadasFin=Array.isArray(confirmadasFin)?confirmadasFin.filter(row=>String(row?.id||row?.idPosicionFinanciera)!==String(id)):confirmadasFin;return confirmadasFin;}\n  const api=",
            "  function purgarPosicionConfirmada(id){confirmadasFin=Array.isArray(confirmadasFin)?confirmadasFin.filter(row=>String(row?.id||row?.idPosicionFinanciera)!==String(id)):confirmadasFin;return confirmadasFin;}\n  // H06 final: toda mutacion de consumos confirmada por RPC se publica primero\n  // en el snapshot en memoria. Si la recarga completa falla despues, el modo\n  // degradado conserva el estado POST-commit y no resucita la certificacion\n  // anterior. Las anuladas se quitan del conjunto confirmado.\n  function confirmarMutacionesFinancieras(rows){\n    const remotas=Array.isArray(rows)?rows:[rows];\n    if(!remotas.length)return confirmadasFin;\n    const ids=new Set(remotas.map(row=>String(row?.id||'')).filter(Boolean));\n    let next=(Array.isArray(confirmadasFin)?confirmadasFin:[]).filter(row=>!ids.has(String(row?.id||row?.idPosicionFinanciera||'')));\n    for(const row of remotas){\n      if(!row||text(row.estado).toUpperCase()==='ANULADA')continue;\n      next.push(fromRemoteConsumption(row));\n    }\n    // Recalcular saldos de los maestros a partir del conjunto confirmado.\n    // Esto evita que una recarga fallida deje montos pre-certificacion.\n    next=next.map(row=>{\n      if(!isMaster(row))return row;\n      const masterId=String(row?.id||row?.idPosicionFinanciera||'');\n      const consumos=next.filter(item=>!isMaster(item)&&String(item?.idPosicionOrigen||'')===masterId);\n      const montoConsumido=consumos.reduce((acc,item)=>acc+Number(item?.precioTotal||item?.montoCertificado||0),0);\n      const cantidadConsumida=consumos.reduce((acc,item)=>acc+Number(item?.cantidad||0),0);\n      const montoTotal=Number(row?.montoPosicion||row?.precioTotal||0);\n      const cantidadTotal=Number(row?.cantidadTotal||row?.cantidad||0);\n      return {...row,montoConsumido,montoDisponible:Math.max(0,montoTotal-montoConsumido),cantidadConsumida,cantidadDisponible:Math.max(0,cantidadTotal-cantidadConsumida)};\n    });\n    confirmadasFin=next;\n    confirmadasFinUid=runtime.sesion?.user?.id||confirmadasFinUid;\n    try{window.posicionesFinancieras=next;posicionesFinancieras=next;}catch(error){}\n    return next;\n  }\n  const api=",
            'helper snapshot financiero post-mutation'
          );

          html = replaceOnce(
            html,
            "const result=data.map(fromRemoteConsumption);try{await recargarCache();}",
            "const result=data.map(fromRemoteConsumption);confirmarMutacionesFinancieras(data);try{await recargarCache();}",
            'certificarPosiciones actualiza snapshot antes del refresh'
          );

          html = replaceOnce(
            html,
            "const result=fromRemoteConsumption(data);try{await recargarCache();}",
            "const result=fromRemoteConsumption(data);confirmarMutacionesFinancieras(data);try{await recargarCache();}",
            'actualizarCertificacion actualiza snapshot antes del refresh'
          );

          html = replaceOnce(
            html,
            "if(!data?.id||text(data.estado).toUpperCase()!=='ANULADA')throw new Error('Supabase no confirmó la anulación de la certificación.');try{await recargarCache();}",
            "if(!data?.id||text(data.estado).toUpperCase()!=='ANULADA')throw new Error('Supabase no confirmó la anulación de la certificación.');confirmarMutacionesFinancieras(data);try{await recargarCache();}",
            'anularCertificacion actualiza snapshot antes del refresh'
          );

          const marker = "check(html.includes('canonicalApi().purgarPosicionConfirmada(id);'),\n  'el borrado remoto de una posicion tiene que quitarla del snapshot financiero confirmado');\n";
          const extra = [
            "check(html.includes('ordenesConfirmadas = deduplicarOrdenes([') && html.includes('ordenesConfirmadasUid = user?.id || ordenesConfirmadasUid;'),",
            "  'un write confirmado de Ordenes tiene que actualizar el snapshot antes de la recarga');",
            "check(html.includes('function confirmarMutacionesFinancieras(rows){'),",
            "  'Finanzas tiene que tener un helper para publicar mutaciones confirmadas en el snapshot');",
            "check(html.includes('const result=data.map(fromRemoteConsumption);confirmarMutacionesFinancieras(data);try{await recargarCache();}'),",
            "  'certificar tiene que actualizar el snapshot confirmado antes del refresh');",
            "check(html.includes('const result=fromRemoteConsumption(data);confirmarMutacionesFinancieras(data);try{await recargarCache();}'),",
            "  'editar certificacion tiene que actualizar el snapshot confirmado antes del refresh');",
            "check(html.includes(\"text(data.estado).toUpperCase()!=='ANULADA')throw new Error\") && html.includes('confirmarMutacionesFinancieras(data);try{await recargarCache();}'),",
            "  'anular certificacion tiene que actualizar el snapshot confirmado antes del refresh');",
            ''
          ].join('\n');
          test = replaceOnce(test, marker, marker + extra, 'regresiones de los dos P2 finales');

          fs.writeFileSync(indexPath, html);
          fs.writeFileSync(testPath, test);
          NODE

      - name: Verificar H06 y suite estatica
        run: |
          node tests/check_h06_localstorage_non_authoritative.js
          npm test
          git diff --check

      - name: Commit de los dos findings finales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_h06_localstorage_non_authoritative.js
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi
          git commit -m "fix: close final H06 confirmed snapshot findings"
          git push origin HEAD:fix/h06-localstorage-non-authoritative
