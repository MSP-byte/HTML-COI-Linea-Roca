name: Dashboard focus motion one-shot

on:
  push:
    branches:
      - fix/dashboard-focus-motion-defaults

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply focused dashboard UX change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_functions = """  function button(id,label,title){const b=document.createElement('button');b.type='button';b.id=id;b.className='coi-visual-btn';b.textContent=label;b.title=title;return b;}\n  function motionEnabled(){if(reduced())return false;try{return localStorage.getItem(MOTION_KEY)!=='0';}catch(_e){return true;}}\n  function applyMotion(enabled){document.body.classList.toggle('coi-motion-off',!enabled);const b=$('coiToggleMotion');if(b){b.setAttribute('aria-pressed',String(enabled));b.textContent=enabled?'Movimiento activo':'Movimiento pausado';b.title=enabled?'Pausar animaciones decorativas':'Activar animaciones decorativas';}try{localStorage.setItem(MOTION_KEY,enabled?'1':'0');}catch(_e){}}\n  function toggleFocus(){const active=document.body.classList.toggle('dashboard-focus-mode');const b=$('coiFocusMode');if(b){b.setAttribute('aria-pressed',String(active));b.textContent=active?'Salir de modo foco':'Modo foco';}if(active)window.scrollTo({top:0,behavior:motionEnabled()?'smooth':'auto'});}\n"""
          new_functions = """  function motionEnabled(){return true;}\n  function applyMotion(){document.body.classList.remove('coi-motion-off');try{localStorage.removeItem(MOTION_KEY);}catch(_e){}}\n  function syncDashboardFocus(){const view=$('vistaDashboard');document.body.classList.toggle('dashboard-focus-mode',!!view?.classList.contains('active'));}\n  function toggleFocus(){syncDashboardFocus();}\n"""
          if text.count(old_functions) != 1:
              raise SystemExit(f'Expected one visual-control function block, found {text.count(old_functions)}')
          text = text.replace(old_functions, new_functions, 1)

          old_controls = """    if(!head.querySelector('.coi-visual-controls')){const controls=document.createElement('div');controls.className='coi-visual-controls';const motion=button('coiToggleMotion','Movimiento activo','Pausar animaciones decorativas');motion.setAttribute('aria-pressed','true');motion.addEventListener('click',()=>applyMotion(document.body.classList.contains('coi-motion-off')));const focus=button('coiFocusMode','Modo foco','Maximizar el Dashboard para presentación');focus.setAttribute('aria-pressed','false');focus.addEventListener('click',toggleFocus);controls.append(motion,focus);head.appendChild(controls);}\n"""
          if text.count(old_controls) != 1:
              raise SystemExit(f'Expected one visual controls renderer, found {text.count(old_controls)}')
          text = text.replace(old_controls, '', 1)

          old_decorate = "    applyMotion(motionEnabled());return true;"
          new_decorate = "    syncDashboardFocus();applyMotion(true);return true;"
          if text.count(old_decorate) != 1:
              raise SystemExit(f'Expected one decorate motion call, found {text.count(old_decorate)}')
          text = text.replace(old_decorate, new_decorate, 1)

          old_bind = """    const mount=$('dashboardInteractivoMount');\n    mount?.addEventListener('pointermove',event=>{const r=mount.getBoundingClientRect();mount.style.setProperty('--coi-pointer-x',`${event.clientX-r.left}px`);mount.style.setProperty('--coi-pointer-y',`${event.clientY-r.top}px`);const card=event.target.closest('.d33-card,.d33-kpi');if(card){const c=card.getBoundingClientRect();card.style.setProperty('--spot-x',`${event.clientX-c.left}px`);card.style.setProperty('--spot-y',`${event.clientY-c.top}px`);}} ,{passive:true});\n    document.addEventListener('click',event=>{const interactive=event.target.closest('.d33-kpi,.d33-chip,.d33-priority,.d33-activity,.d33-legend-item,.coi-visual-btn');if(interactive)springPress(interactive);if(event.target.closest('#moduleNav button')&&!event.target.closest('#btnDashboard'))document.body.classList.remove('dashboard-focus-mode');},true);\n    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.body.classList.contains('dashboard-focus-mode'))toggleFocus();});\n"""
          new_bind = """    const mount=$('dashboardInteractivoMount');\n    const dashboardView=$('vistaDashboard');\n    if(dashboardView){const focusObserver=new MutationObserver(syncDashboardFocus);focusObserver.observe(dashboardView,{attributes:true,attributeFilter:['class']});syncDashboardFocus();}\n    mount?.addEventListener('pointermove',event=>{const r=mount.getBoundingClientRect();mount.style.setProperty('--coi-pointer-x',`${event.clientX-r.left}px`);mount.style.setProperty('--coi-pointer-y',`${event.clientY-r.top}px`);const card=event.target.closest('.d33-card,.d33-kpi');if(card){const c=card.getBoundingClientRect();card.style.setProperty('--spot-x',`${event.clientX-c.left}px`);card.style.setProperty('--spot-y',`${event.clientY-c.top}px`);}} ,{passive:true});\n    document.addEventListener('click',event=>{const interactive=event.target.closest('.d33-kpi,.d33-chip,.d33-priority,.d33-activity,.d33-legend-item,.coi-visual-btn');if(interactive)springPress(interactive);},true);\n"""
          if text.count(old_bind) != 1:
              raise SystemExit(f'Expected one visual bind block, found {text.count(old_bind)}')
          text = text.replace(old_bind, new_bind, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate requested behavior statically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          forbidden = [
              "button('coiToggleMotion'",
              "button('coiFocusMode'",
              "textContent=enabled?'Movimiento activo'",
              "textContent=active?'Salir de modo foco'",
              "localStorage.getItem(MOTION_KEY)",
          ]
          for token in forbidden:
              assert token not in text, token
          required = [
              "function motionEnabled(){return true;}",
              "document.body.classList.remove('coi-motion-off')",
              "function syncDashboardFocus()",
              "new MutationObserver(syncDashboardFocus)",
              "syncDashboardFocus();applyMotion(true);return true;",
          ]
          for token in required:
              assert token in text, token
          print('Static dashboard focus/motion assertions: OK')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run full static/regression suite
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: keep dashboard focus and motion enabled"
          git push origin HEAD:fix/dashboard-focus-motion-defaults
