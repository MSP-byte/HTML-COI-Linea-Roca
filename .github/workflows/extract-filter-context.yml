name: Extract filter context

on:
  push:
    branches: [fix/final-filters-expiry-order]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-filters-expiry-order
          persist-credentials: true
      - name: Extract compact contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          def context_for(terms, radius=35):
              out=[]; seen=[]
              for term in terms:
                  hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
                  out.append(f'## {term!r} hits={len(hits)}')
                  for i in hits[:4]:
                      a=max(0,i-radius); b=min(len(lines),i+radius)
                      if any(abs(i-x)<radius for x in seen): continue
                      seen.append(i)
                      out.append(f'### line {i+1}')
                      out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
              return '\n'.join(out)
          Path('.github/dashboard_filter_context.txt').write_text(context_for([
              'Próximos 30 días','Todos los ramales','ESTADO CONTRACTUAL','Resumen operativo Línea Roca'
          ],45),encoding='utf-8')
          Path('.github/orders_filter_context.txt').write_text(context_for([
              'ordenesFiltroMesVenc','function renderOrdenes','getOrdenesFiltradasBase','ordenesFiltroMontoOrden'
          ],55),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dashboard_filter_context.txt .github/orders_filter_context.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture compact filter contexts"
          git push origin HEAD:fix/final-filters-expiry-order
