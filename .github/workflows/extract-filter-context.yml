name: Extract filter context

on:
  push:
    branches: [fix/final-filters-expiry-order]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-filters-expiry-order
          persist-credentials: true
      - name: Extract final orders sorter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          a,b=18235,18325
          Path('.github/orders_sorter_final.txt').write_text('\n'.join(f'{i+1}: {lines[i]}' for i in range(a-1,b)),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/orders_sorter_final.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture final orders sorter"
          git push origin HEAD:fix/final-filters-expiry-order
