name: Extract filter context

on:
  push:
    branches: [fix/final-filters-expiry-order]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-filters-expiry-order
          persist-credentials: true
      - name: Extract targeted index context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=[
            'Próximos 30 días','Proximos 30 dias','Todos los ramales','ESTADO CONTRACTUAL',
            'Resumen operativo Línea Roca','Resumen operativo Linea Roca','ordenesFiltroMesVenc',
            'ordenesFiltroEstado','ordenesFiltroDoc','function renderOrdenes','getOrdenesFiltradas',
            'ordenesFiltroMontoOrden','mesVenc','vencidas','proximas'
          ]
          out=[]
          for term in terms:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            out.append(f'## TERM {term!r} HITS={len(hits)}')
            for i in hits[:25]:
              a=max(0,i-12); b=min(len(lines),i+22)
              out.append(f'### around line {i+1}')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
              out.append('')
          Path('.github/filter_context_targeted.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/filter_context_targeted.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture targeted filter context"
          git push origin HEAD:fix/final-filters-expiry-order
