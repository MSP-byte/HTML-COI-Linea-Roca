name: H11 cross-tab sync fix

on:
  push:
    branches:
      - fix/h11-online-only-no-localstorage

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[h11-syncbot]') && !contains(github.event.head_commit.message, '[h11-bot]') && !contains(github.event.head_commit.message, '[h11-testbot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/h11-online-only-no-localstorage
          persist-credentials: true
          fetch-depth: 0

      - name: Preserve cross-tab Timeline sync without localStorage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor="  const TIMELINE_SYNC_PING_KEY='coi_timeline_sync_ping_v1';"
          insert=anchor+"\n  const TIMELINE_SYNC_CHANNEL='coi_timeline_sync_v2';\n  const timelineSyncChannel=typeof BroadcastChannel==='function'?new BroadcastChannel(TIMELINE_SYNC_CHANNEL):null;"
          if 'const TIMELINE_SYNC_CHANNEL=' not in s:
              if anchor not in s: raise SystemExit('H11 sync: Timeline key anchor missing')
              s=s.replace(anchor,insert,1)

          old="          sessionStorage.setItem(TIMELINE_SYNC_PING_KEY,JSON.stringify({en:new Date().toISOString(),eventos:normalized.length}));"
          new=old+"\n          if(timelineSyncChannel)timelineSyncChannel.postMessage({en:new Date().toISOString(),eventos:normalized.length});"
          if 'timelineSyncChannel.postMessage' not in s:
              if old not in s: raise SystemExit('H11 sync: Timeline emit anchor missing')
              s=s.replace(old,new,1)

          auth_anchor="    window.addEventListener('coi:supabase-auth',event=>{"
          listener="    if(timelineSyncChannel){\n      timelineSyncChannel.addEventListener('message',()=>{Promise.resolve(loadEvents({emitirSync:false})).catch(()=>{});});\n      window.addEventListener('beforeunload',()=>timelineSyncChannel.close(),{once:true});\n    }\n"
          if 'timelineSyncChannel.addEventListener' not in s:
              pos=s.find(auth_anchor, s.find(anchor))
              if pos<0: raise SystemExit('H11 sync: auth listener anchor missing')
              s=s[:pos]+listener+s[pos:]

          if 'localStorage' in s: raise SystemExit('H11 sync: localStorage reintroduced')
          p.write_text(s,encoding='utf-8')

          t=Path('tests/check_h11_online_only.js')
          q=t.read_text(encoding='utf-8')
          marker="assert(html.includes('__COI_SUPABASE_SOURCE_OF_TRUTH__'), 'Supabase source-of-truth guard must remain present');"
          extra="\nassert(html.includes(\"const TIMELINE_SYNC_CHANNEL='coi_timeline_sync_v2';\"), 'Timeline cross-tab sync must use BroadcastChannel');\nassert(html.includes('timelineSyncChannel.postMessage'), 'Timeline mutations must broadcast a reload signal');\nassert(html.includes(\"timelineSyncChannel.addEventListener('message'\"), 'other tabs must receive the BroadcastChannel signal');\n"
          if 'Timeline cross-tab sync must use BroadcastChannel' not in q:
              if marker not in q: raise SystemExit('H11 sync: static contract anchor missing')
              q=q.replace(marker,marker+extra,1)
          t.write_text(q,encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node tests/check_h11_online_only.js
          npm ci
          npm test
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_h11_online_only.js
          git commit -m "[h11-syncbot] fix: preserve cross-tab sync without localStorage"
          git push origin HEAD:fix/h11-online-only-no-localstorage
