name: TEMP Timeline Load MultiOC Patch
on:
  push:
    branches: [fix/timeline-load-top-multi-oc]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/tmp_timeline_load_multioc_patch.py
      - name: Validate regression test syntax
        run: node --check tests/timeline_load_top_multioc.spec.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/timeline_load_top_multioc.spec.js
          git commit -m 'fix: move Timeline load up and handle multiple OCs'
          git push
