name: TEMP Timeline Load MultiOC Inspect
on:
  push:
    branches: [fix/timeline-load-top-multi-oc]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract parser range
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          a,b=20790,20970
          out='\n'.join(f'{i+1:05d}: {lines[i]}' for i in range(a-1,min(b,len(lines))))
          Path('timeline_load_multioc_inspect.txt').write_text(out,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add timeline_load_multioc_inspect.txt
          git commit -m 'chore: capture Timeline bulk parser range [skip ci]'
          git push
