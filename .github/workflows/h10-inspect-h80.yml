name: H10 inspect H80

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-inspect-h80.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recover staged final patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, re, subprocess
          old = subprocess.check_output(['git','show','bb6a0da52bc4de40173392653dee8ed48bd1fc5b:.github/workflows/h10-final-review-patch.yml'], text=True)
          m = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", old)
          if not m:
              raise SystemExit('payload missing')
          raw = gzip.decompress(base64.b64decode(m.group(1)))
          open('/tmp/h10_final_review_patch.py','wb').write(raw)
          PY
          python /tmp/h10_final_review_patch.py

      - name: Apply current keyboard candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          y = Path('.github/workflows/h10-final-review-patch-v2.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s+PY", y, flags=re.S)
          if len(blocks) < 6:
              raise SystemExit(f'expected >=6 python blocks, got {len(blocks)}')
          # block 0 only recovers the payload; it already ran above.
          for idx in [1,2,3,4,5]:
              code = textwrap.dedent(blocks[idx])
              exec(compile(code, f'<helper-block-{idx}>', 'exec'), {})
          PY

      - name: Instrument H10 runtime and exact regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          one("  const hashActual = () => texto(location.hash).replace(/^#/, '');",
              "  const hashActual = () => texto(location.hash).replace(/^#/, '');\n  window.__H10_DEBUG = [];\n  function h10dbg(tag, data) {\n    try { window.__H10_DEBUG.push({ t: Math.round(performance.now()), tag, hash: location.hash, vista: document.querySelector('.view.active')?.id || '', nav: navegacionUsuario, restaurando, aplicando, data: data || null }); } catch (e) {}\n  }",
              'debug helper')

          one("  function publicar(ruta, opciones) {\n    const cfg = opciones || {};",
              "  function publicar(ruta, opciones) {\n    h10dbg('publicar:in', { ruta: texto(ruta), opciones: opciones || null });\n    const cfg = opciones || {};",
              'publicar in')

          one("  function abrirVista(id) {\n    try { if (typeof window.mostrarVista === 'function') window.mostrarVista(id); } catch (e) {}\n  }",
              "  function abrirVista(id) {\n    h10dbg('abrirVista:in', { id });\n    try { if (typeof window.mostrarVista === 'function') window.mostrarVista(id); } catch (e) {}\n    h10dbg('abrirVista:out', { id });\n  }",
              'abrirVista')

          one("  function navegarVistaUsuario(vista) {\n    const ruta = rutaIntencionDesdeVista(vista);",
              "  function navegarVistaUsuario(vista) {\n    h10dbg('navegarVistaUsuario:in', { vista });\n    const ruta = rutaIntencionDesdeVista(vista);",
              'navegar user')

          one("    Promise.resolve(aplicar(ruta)).catch(() => {});\n    return true;\n  }\n\n  function observarNavegacionUsuario(ev) {",
              "    Promise.resolve(aplicar(ruta)).catch(() => {});\n    h10dbg('navegarVistaUsuario:queued', { vista, ruta });\n    return true;\n  }\n\n  function observarNavegacionUsuario(ev) {",
              'navegar queued')

          one("    const intencion = rutaIntencionDesdeEvento(ev);\n    const tecladoConIntencion = ev.type === 'keydown' && Boolean(intencion);",
              "    const intencion = rutaIntencionDesdeEvento(ev);\n    h10dbg('observer', { type: ev.type, key: ev.key || '', trusted: ev.isTrusted, intencion });\n    const tecladoConIntencion = ev.type === 'keydown' && Boolean(intencion);",
              'observer log')

          one("  async function aplicar(ruta) {\n    versionAplicacion++;",
              "  async function aplicar(ruta) {\n    h10dbg('aplicar:in', { ruta: texto(ruta), solicitada, versionAplicacion });\n    versionAplicacion++;",
              'aplicar in')

          one("        const version = versionAplicacion;\n        await aplicarInterno(r, version);",
              "        const version = versionAplicacion;\n        h10dbg('aplicar:interno:before', { r, version });\n        await aplicarInterno(r, version);\n        h10dbg('aplicar:interno:after', { r, version });",
              'aplicar loop')

          one("    publicar(rutaVigente(), { reemplazar: true });\n  }\n\n  // ---------------------------------------------------------- envoltorios",
              "    h10dbg('aplicar:normaliza', { vigente: rutaVigente() });\n    publicar(rutaVigente(), { reemplazar: true });\n    h10dbg('aplicar:out', { ruta: texto(ruta), vigente: rutaVigente() });\n  }\n\n  // ---------------------------------------------------------- envoltorios",
              'aplicar out')

          one("  async function restaurar() {\n    if (arrancado) return;",
              "  async function restaurar() {\n    h10dbg('restaurar:call');\n    if (arrancado) return;",
              'restore call')

          one("      const inicial = hashActual();\n      const versionUsuarioInicial = navegacionUsuario;",
              "      const inicial = hashActual();\n      const versionUsuarioInicial = navegacionUsuario;\n      h10dbg('restaurar:captura', { inicial, versionUsuarioInicial });",
              'restore capture')

          one("      const listo = rutaNecesitaCatalogoOrdenes(inicial) ? await esperarArranque() : true;",
              "      const listo = rutaNecesitaCatalogoOrdenes(inicial) ? await esperarArranque() : true;\n      h10dbg('restaurar:post-wait', { inicial, versionUsuarioInicial, listo });",
              'restore wait')

          one("      if (navegacionUsuario !== versionUsuarioInicial) return;\n      if (hashActual() !== inicial) return;",
              "      if (navegacionUsuario !== versionUsuarioInicial) { h10dbg('restaurar:cancel-nav', { inicial, versionUsuarioInicial }); return; }\n      if (hashActual() !== inicial) { h10dbg('restaurar:cancel-hash', { inicial, actual: hashActual() }); return; }",
              'restore guards')

          one("      await aplicar(inicial);\n      for (const ms of [700, 1800]) {",
              "      h10dbg('restaurar:apply-inicial', { inicial });\n      await aplicar(inicial);\n      for (const ms of [700, 1800]) {",
              'restore apply')

          one("        if (navegacionUsuario !== versionUsuarioInicial) return;\n        await reafirmar(inicial);",
              "        if (navegacionUsuario !== versionUsuarioInicial) { h10dbg('restaurar:reaffirm-cancel-nav', { inicial, ms }); return; }\n        h10dbg('restaurar:reaffirm', { inicial, ms });\n        await reafirmar(inicial);",
              'restore reaffirm')

          one("      restaurando = false;\n      refrescarHash({ reemplazar: true });",
              "      h10dbg('restaurar:finally:before');\n      restaurando = false;\n      refrescarHash({ reemplazar: true });\n      h10dbg('restaurar:finally:after');",
              'restore finally')

          # V2 bubble handler, after the helper candidate has replaced the synthetic click version.
          marker = "const vista=NAV.find(item=>item.id===id)?.view||'';const rutaTemprana="
          if marker not in s:
              raise SystemExit('V2 debug marker missing')
          s = s.replace(marker,
              "window.__H10_DEBUG?.push({t:Math.round(performance.now()),tag:'v2-keydown',hash:location.hash,vista:document.querySelector('.view.active')?.id||'',nav:null,restaurando:null,aplicando:null,data:{id,key:event.key}});" + marker,
              1)
          p.write_text(s, encoding='utf-8')

          q = Path('tests/h10_routing_cierre_archivo.spec.js')
          t = q.read_text(encoding='utf-8')
          old = "  await acceso.press('Enter');\n  await page.waitForTimeout(7500);\n  const e = await estadoRuta(page);"
          new = "  await acceso.press('Enter');\n  console.log('H10DEBUG_AFTER_ENTER', JSON.stringify(await page.evaluate(() => ({hash:location.hash,vista:document.querySelector('.view.active')?.id||'',dbg:window.__H10_DEBUG||[]}))));\n  await page.waitForTimeout(7500);\n  console.log('H10DEBUG_FINAL', JSON.stringify(await page.evaluate(() => ({hash:location.hash,vista:document.querySelector('.view.active')?.id||'',dbg:window.__H10_DEBUG||[]}))));\n  const e = await estadoRuta(page);"
          if t.count(old) != 1:
              raise SystemExit(f'test instrumentation: expected 1 match, got {t.count(old)}')
          q.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run diagnostic H10-80 desktop
        shell: bash
        run: |
          npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep 'H10-80' --project=chromium-desktop --workers=1 --retries=0
