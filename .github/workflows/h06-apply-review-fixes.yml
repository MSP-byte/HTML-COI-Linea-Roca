name: H06 Apply Review Fixes

on:
  push:
    branches:
      - fix/h06-localstorage-non-authoritative
    paths:
      - .github/workflows/h06-apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run H06 review patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h06-localstorage-non-authoritative
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic H06 patch
        run: node scripts/apply_h06_review_patch.js

      - name: Verify H06 static guard
        run: node tests/check_h06_localstorage_non_authoritative.js

      - name: Run repository tests
        run: npm test

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit only final H06 files
        shell: bash
        run: |
          rm -f scripts/apply_h06_review_patch.js
          rm -f .github/workflows/h06-apply-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: close H06 review race conditions"
          git push origin HEAD:fix/h06-localstorage-non-authoritative
