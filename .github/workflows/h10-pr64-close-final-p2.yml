name: H10 PR64 close final P2

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Anchor helper to exact H09 mutation
        run: |
          python3 -c "from pathlib import Path; p=Path('.github/scripts/h10_pr64_close_final_p2.py'); s=p.read_text(encoding='utf-8'); old=\"execute_start = html.find('async function ejecutar(')\"; new=\"archive_script = html.find('<script id=\\\"coi-h09-archivar-oc-supabase\\\">')\\nif archive_script < 0:\\n    raise SystemExit('H09 archive script not found')\\nexecute_start = html.find('async function ejecutar(', archive_script)\"; assert old in s; s=s.replace(old,new,1); old2=\"persist_at = html.find('const salida = await persistir(item, destino);', execute_start)\"; new2=\"persist_at = html.find('const salida = await cambiarEstadoRegistro(referencia, destino);', execute_start)\"; assert old2 in s; p.write_text(s.replace(old2,new2,1), encoding='utf-8')"

      - name: Apply final P2 corrections
        run: python3 .github/scripts/h10_pr64_close_final_p2.py

      - name: Align existing retry static assertion
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/check_h10_routing_cierre_archivo.js'); s=p.read_text(encoding='utf-8'); old=\"if (!restaurando && !aplicando && !tecladoConIntencion) return;\"; new=\"if (!restaurando && !aplicando && !reintentando && !tecladoConIntencion) return;\"; assert old in s; p.write_text(s.replace(old,new,1), encoding='utf-8')"

      - name: Install locked dependencies
        run: npm ci

      - name: Static and regression suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused H10 browser regressions
        run: npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep "H10-84|H10-85|H10-86|H10-87"

      - name: Diff check
        run: git diff --check

      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add index.html tests/check_h10_routing_cierre_archivo.js tests/h10_routing_cierre_archivo.spec.js supabase/migrations/202609070001_h10_order_lifecycle_guard.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix(h10): close final PR64 review findings"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
