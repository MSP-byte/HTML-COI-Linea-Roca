name: H10 PR64 close final P2

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final P2 corrections
        run: python3 .github/scripts/h10_pr64_close_final_p2.py

      - name: Install locked dependencies
        run: npm ci

      - name: Static and regression suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused H10 browser regressions
        run: npx playwright test tests/h10_routing_cierre_archivo.spec.js --grep "H10-84|H10-85|H10-86|H10-87"

      - name: Diff check
        run: git diff --check

      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add index.html tests/check_h10_routing_cierre_archivo.js tests/h10_routing_cierre_archivo.spec.js supabase/migrations/202609070001_h10_order_lifecycle_guard.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix(h10): close final PR64 review findings"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
