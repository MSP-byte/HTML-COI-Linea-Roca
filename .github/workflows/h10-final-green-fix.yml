name: H10 final green fix

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-final-green-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact H10 routing/test patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  function observarNavegacionUsuario(ev) {
            if (!restaurando || !ev || ev.isTrusted !== true) return;
            const antes = rutaVigente();
            let resuelta = false;
            const verificar = () => {
              if (resuelta || !restaurando) return;
              const despues = rutaVigente();
              if (!despues || despues === antes) return;
              resuelta = true;
              navegacionUsuario++;
              publicar(despues);
            };
            // La mayoria de los botones cambia vista en el mismo dispatch; algunas
            // capas V2 sincronizan despues. Se cubren ambos sin convertir un simple
            // click sin navegacion en cancelacion del restore.
            setTimeout(verificar, 0);
            setTimeout(verificar, 90);
            setTimeout(verificar, 220);
          }
          '''
          new = '''  function rutaIntencionDesdeVista(vista) {
            const v = texto(vista);
            if (!v) return '';
            if (v === 'vistaOrdenes') return 'ordenes/' + modoRegistro();
            if (v === 'vistaUnidadesMantenimiento') {
              const tab = tabUM();
              return tab === 'servicios' ? 'um/servicios' : 'um';
            }
            if (v === 'vistaRed') return 'red';
            return rutaDe(v);
          }

          function rutaIntencionDesdeEvento(ev) {
            const t = ev && ev.target && ev.target.closest ? ev.target : null;
            if (!t) return '';
            const nav = t.closest('[data-v2-view]');
            if (nav) return rutaIntencionDesdeVista(nav.getAttribute('data-v2-view'));
            const acceso = t.closest('[data-v2-open-module]');
            if (acceso) {
              const id = texto(acceso.getAttribute('data-v2-open-module'));
              const botones = Array.from(document.querySelectorAll('[data-v2-nav]'));
              const espejo = botones.find((b) => texto(b.getAttribute('data-v2-nav')) === id);
              if (espejo) return rutaIntencionDesdeVista(espejo.getAttribute('data-v2-view'));
            }
            return '';
          }

          function observarNavegacionUsuario(ev) {
            if (!restaurando || !ev || ev.isTrusted !== true) return;

            // Los controles de navegacion V2 declaran la vista de destino. Esa
            // intencion es suficiente aunque el startup ya este mostrando de forma
            // transitoria la misma vista: hacer click en «Red» significa abandonar el
            // deep-link pendiente incluso si Red ya esta visible por un repintado.
            const intencion = rutaIntencionDesdeEvento(ev);
            if (intencion) {
              navegacionUsuario++;
              publicar(intencion);
              return;
            }

            const antes = rutaVigente();
            let resuelta = false;
            const verificar = () => {
              if (resuelta || !restaurando) return;
              const despues = rutaVigente();
              if (!despues || despues === antes) return;
              resuelta = true;
              navegacionUsuario++;
              publicar(despues);
            };
            // Para controles que no declaran destino se conserva la deteccion por
            // resultado visible. MutationObserver y temporizadores siguen sin poder
            // cancelar el restore porque no generan eventos trusted.
            setTimeout(verificar, 0);
            setTimeout(verificar, 90);
            setTimeout(verificar, 220);
          }
          '''
          if old not in s:
              raise SystemExit('index.html: target observer block not found exactly')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/h10_routing_cierre_archivo.spec.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''const lecturas = (page, tabla) => page.evaluate((t) => window.__H10__.lecturas[t], tabla);

          const estadoRuta = (page) => page.evaluate(() => ({
          '''
          helper = '''const lecturas = (page, tabla) => page.evaluate((t) => window.__H10__.lecturas[t], tabla);

          async function navegarV2(page, navId) {
            const selector = `[data-v2-nav="${navId}"]`;
            await page.waitForSelector(selector, { state: 'attached', timeout: 12000 });
            const mobile = await page.evaluate(() => matchMedia('(max-width: 760px)').matches);
            if (mobile) {
              await page.locator('#coiV2Menu').click();
              await page.waitForFunction(() => document.body.classList.contains('coi-v2-mobile-open'),
                null, { timeout: 5000 });
            }
            await page.locator(selector).click();
          }

          const estadoRuta = (page) => page.evaluate(() => ({
          '''
          if anchor not in s:
              raise SystemExit('spec: helper anchor not found exactly')
          s = s.replace(anchor, helper, 1)

          old60 = '''  // El shell V2 oculta los botones legacy de #moduleNav; navegar por el
            // entry point ordinario evita que el test dependa de un control de respaldo
            // deliberadamente no visible y sigue cubriendo la limpieza de rutaError.
            await page.evaluate(() => window.mostrarVista('vistaOrdenes'));
            await page.waitForTimeout(1800);
          '''
          new60 = '''  // Se usa el shell visible real. Durante startup este click tiene que ganar
            // al deep-link anterior y, en mobile, abrir primero el menu off-canvas.
            await navegarV2(page, 'btnOrdenes');
            await page.waitForTimeout(2200);
          '''
          if old60 not in s:
              raise SystemExit('spec: H10-60 target not found exactly')
          s = s.replace(old60, new60, 1)

          old70 = '''  await page.waitForSelector('[data-v2-nav="btnRed"]', { state: 'visible', timeout: 12000 });

            // Este es el caso que no cubría H10-61: el operador NO toca location.hash;
            // usa la navegación real. El guard de restauración no debe tragarse su click.
            await page.click('[data-v2-nav="btnRed"]');
            await page.waitForTimeout(7500);
          '''
          new70 = '''  // Este es el caso que no cubría H10-61: el operador NO toca location.hash;
            // usa la navegación real. En mobile abre primero el menú off-canvas, igual
            // que un operador; no hay force-click ni bypass del layout.
            await navegarV2(page, 'btnRed');
            await page.waitForTimeout(7500);
          '''
          if old70 not in s:
              raise SystemExit('spec: H10-70 target not found exactly')
          s = s.replace(old70, new70, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/h10_routing_cierre_archivo.spec.js
          npm test
          git diff --check
          git diff -- index.html tests/h10_routing_cierre_archivo.spec.js

      - name: Commit clean functional fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/h10-final-green-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/h10_routing_cierre_archivo.spec.js .github/workflows/h10-final-green-fix.yml
          git diff --cached --check
          git commit -m "fix(h10): honor explicit navigation during startup"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
