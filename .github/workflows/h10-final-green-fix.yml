name: H10 final green fix

on:
  push:
    branches:
      - fix/h10-routing-close-archive-workflow
    paths:
      - .github/workflows/h10-final-green-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h10-routing-close-archive-workflow
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        run: python .github/scripts/h10-final-green-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Validate functional patch
        run: |
          node --check tests/h10_routing_cierre_archivo.spec.js
          npm test
          git diff --check

      - name: Commit clean functional fix
        run: |
          rm .github/workflows/h10-final-green-fix.yml
          rm .github/scripts/h10-final-green-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(h10): honor explicit navigation during startup"
          git push origin HEAD:fix/h10-routing-close-archive-workflow
