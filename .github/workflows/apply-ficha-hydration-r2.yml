name: Apply ficha hydration R2

on:
  push:
    branches:
      - fix/ficha-deeplink-hydration-progress-h10
    paths:
      - .github/workflows/apply-ficha-hydration-r2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ficha-deeplink-hydration-progress-h10
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded patch
        run: node scripts/patch_ficha_hydration_r2.js

      - name: Validate patch
        run: |
          git diff --check
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8'); if(!h.includes('resolverOrdenCircuito')) process.exit(1); if(!h.includes('Fallback exacto por N° OC')) process.exit(1);"

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore canonical ficha hydration for bare OC deep-links"
          git push origin HEAD:fix/ficha-deeplink-hydration-progress-h10
