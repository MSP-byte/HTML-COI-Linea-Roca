name: H14 apply login auth

on:
  push:
    branches:
      - feat/h14-login-auth-seguridad

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H14 branch
        uses: actions/checkout@v4
        with:
          ref: feat/h14-login-auth-seguridad
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply H14 patch
        shell: bash
        run: |
          cat tools/h14_patch.part* > /tmp/h14_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/h14_patch.py')
          s = p.read_text()
          s, n1 = re.subn(r"parts\s*=\s*sorted\(\(ROOT\s*/\s*'tools'\)\.glob\('h14_bg\.part\*'\)\)", "parts = [ROOT / 'tools' / 'h14_bg_small.b64']", s, count=1)
          s, n2 = re.subn(r"if\s+len\(BG\)\s*<\s*50000\s*:", "if len(BG) < 1000:", s, count=1)
          broken = '<form id="coiAuthFormH14"14" autocomplete="on" novalidate>'
          fixed = '<form id="coiAuthFormH14" autocomplete="on" novalidate>'
          n3 = s.count(broken)
          s = s.replace(broken, fixed)
          print(f'h14 patch rewrites: image_source={n1}, threshold={n2}, split_overlap={n3}')
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit('No se pudo normalizar el patch H14 exactamente una vez.')
          p.write_text(s)
          PY
          python3 /tmp/h14_patch.py
          echo '--- H14 generated context ---'
          nl -ba index.html | sed -n '1602,1612p'

      - name: Run unit and static quality gate
        run: npm run test:unit

      - name: Remove H14 staging helpers
        run: |
          rm -f tools/h14_patch.part* tools/h14_bg.part* tools/h14_bg_small.b64 tools/h14_trigger.txt
          rm -f .github/workflows/h14-apply.yml

      - name: Commit H14 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(h14): login institucional con Supabase Auth y roles"
          git push origin HEAD:feat/h14-login-auth-seguridad
