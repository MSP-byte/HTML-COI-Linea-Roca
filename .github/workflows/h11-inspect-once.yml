name: H11 inspect once
on:
  push:
    branches: [fix/h11-online-only-no-localstorage]
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'RUN_H11_CHUNKS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build focused source chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          ranges=[
            (4200,4450),(5450,5670),(9000,9340),(12750,13180),(13980,14280),
            (15450,15880),(16600,17080),(20700,21180),(24150,24650),
            (25950,26380),(26750,27180),(27500,28350),(30750,31280)
          ]
          outdir=Path('.github/h11-inspect');outdir.mkdir(parents=True,exist_ok=True)
          for a,b in ranges:
            text=''.join(f'{i+1:06d}: {lines[i]}\n' for i in range(a-1,min(b,len(lines))))
            (outdir/f'{a}_{b}.txt').write_text(text,encoding='utf-8')
          PY
      - name: Commit chunks
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add .github/h11-inspect
          git commit -m "chore: capture focused H11 source chunks"
          git push origin HEAD:fix/h11-online-only-no-localstorage
