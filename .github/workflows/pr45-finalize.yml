name: PR45 one-shot finalizer

on:
  push:
    branches:
      - feat/timeline-supabase-first

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          fetch-depth: 0

      - name: Apply surgical PR45 patch
        run: python3 scripts/pr45_finalize_patch.py

      - name: Validate patched JavaScript syntax
        run: |
          node tests/check_timeline_supabase_first.js
          node tests/check_supabase_contract.js

      - name: Commit patched source and remove temporary finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finalize Timeline Supabase consistency"
          git push origin HEAD:feat/timeline-supabase-first
