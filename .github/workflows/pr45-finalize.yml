name: PR45 Finalize Patch

on:
  push:
    branches:
      - feat/timeline-supabase-first
    paths:
      - .github/workflows/pr45-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true
          fetch-depth: 0

      - name: Apply scoped final hardening
        run: python tools/pr45_patch_010.py

      - name: Validate Timeline static contract
        run: |
          npm ci
          node tests/check_timeline_supabase_first.js
          git diff --check

      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm .github/workflows/pr45-finalize.yml tools/pr45_patch_010.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_timeline_supabase_first.js .github/workflows/pr45-finalize.yml tools/pr45_patch_010.py
          git commit -m "fix: finish timeline Supabase-first hardening"
          git push origin HEAD:feat/timeline-supabase-first
