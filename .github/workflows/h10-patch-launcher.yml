name: H10 Patch Launcher

on:
  push:
    branches: [x]

permissions:
  contents: write

jobs:
  diagnose-fragments:
    if: ${{ !startsWith(github.event.head_commit.message, 'debug:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Decode fragment boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          out=[]
          for i in range(4):
              p=pathlib.Path(f'.h10patch/part{i:02d}.b64').read_text().strip()
              out.append(f'PART {i:02d} stored_len={len(p)} start={p[:16]!r} end={p[-16:]!r}')
              # Try every possible missing leading base64 character. Wrong choices only alter
              # the first decoded byte when the fragment boundary is on a base64 group boundary.
              seen=[]
              for c in alphabet:
                  s=c+p
                  s += '='*((4-len(s)%4)%4)
                  try:
                      d=base64.b64decode(s, validate=True)
                  except Exception:
                      continue
                  first=d[:1]
                  if first and first not in seen:
                      seen.append(first)
                      if len(seen)<=40:
                          try: ch=first.decode('utf-8')
                          except: ch=f'0x{first.hex()}'
                          out.append(f'  lead {c!r} -> first_byte {ch!r}')
              # use A only to expose bytes 2.. and the tail; its first byte is the only uncertain one
              s='A'+p; s += '='*((4-len(s)%4)%4)
              try:
                  d=base64.b64decode(s, validate=True)
                  out.append('  FIRST120_AFTER_UNKNOWN='+repr(d[:120]))
                  out.append('  LAST160='+repr(d[-160:]))
              except Exception as e:
                  out.append('  DECODE_ERROR='+repr(e))
              out.append('')
          pathlib.Path('h10_fragment_diagnostics.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          cat h10_fragment_diagnostics.txt
          git config user.name 'H10 Patch Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add h10_fragment_diagnostics.txt
          git commit -m 'debug: inspect H10 fragment boundaries'
          git push origin HEAD:x
