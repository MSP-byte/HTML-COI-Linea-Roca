name: H10 Patch Launcher

on:
  push:
    branches: [x]

permissions:
  contents: write

jobs:
  publish-h10:
    if: "${{ startsWith(github.event.head_commit.message, 'launch: H10 exact patch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact validated H10 patch
        shell: bash
        run: |
          set -euo pipefail
          base='8f2a1c6ae7019575e97c4ec91e9460329d7c74c0'
          target='refs/heads/fix/h10-routing-close-archive-workflow'
          actual="$(git ls-remote origin "$target" | awk '{print $1}')"
          test "$actual" = "$base"
          cat .h10patch/gz00.b64 .h10patch/gz01.b64 .h10patch/gz02.b64 .h10patch/gz03.b64 .h10patch/gz04.b64 | base64 -d | gzip -d > /tmp/h10.patch
          test "$(wc -c < /tmp/h10.patch)" = '57236'
          test "$(sha256sum /tmp/h10.patch | awk '{print $1}')" = '1b7aaa8ce416631a5edf30c7fe13df57cd0781aaebd22fbe3c1ada38e38c1d68'
          grep -q '^From eaf4d4c61f12053d1fc4afc07db363957d497b90 ' /tmp/h10.patch
          git config user.name 'H10 Patch Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --detach "$base"
          git am /tmp/h10.patch
          git diff --check HEAD^ HEAD
          files="$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')"
          test "$files" = 'index.html tests/check_h10_routing_cierre_archivo.js tests/h10_routing_cierre_archivo.spec.js '
          node tests/check_h10_routing_cierre_archivo.js
          git push origin HEAD:"$target"
          echo "Published $(git rev-parse HEAD)"
