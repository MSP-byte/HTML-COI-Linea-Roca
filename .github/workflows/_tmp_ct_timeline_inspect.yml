name: TEMP CT Timeline Patch
on:
  push:
    branches:
      - fix/timeline-daily-oc-ct-mail
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python tools/_tmp_patch_ct_timeline.py
      - name: Validate
        run: |
          node --check tests/timeline_ct_mail_integration.spec.js
          node tests/check_baseline.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/timeline_ct_mail_integration.spec.js
          git commit -m 'feat: simplify Timeline and link CT mail dates to OC'
          git push
