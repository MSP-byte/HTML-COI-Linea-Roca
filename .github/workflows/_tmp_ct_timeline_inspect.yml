name: TEMP CT Timeline Patch
on:
  push:
    branches: [fix/timeline-daily-oc-ct-mail]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Timeline and CT action
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s=s.replace(old,new,1)

          # 1) Retirar vista semanal y dejar solo Diaria / Por OC.
          start=s.find('  function weeklyMarkup(events){')
          end=s.find('  function ocMarkup(events){',start)
          if start<0 or end<0:
              raise SystemExit('weeklyMarkup block not found')
          s=s[:start]+s[end:]
          once("    if(state.view==='semanal')result=weeklyMarkup(events);\n",'', 'weekly render branch')
          once("      <nav class=\"timeline-tabs\" aria-label=\"Vistas del Timeline COI\"><button type=\"button\" data-timeline-view=\"diaria\" class=\"${state.view==='diaria'?'active':''}\">Vista diaria</button><button type=\"button\" data-timeline-view=\"semanal\" class=\"${state.view==='semanal'?'active':''}\">Vista semanal</button><button type=\"button\" data-timeline-view=\"oc\" class=\"${state.view==='oc'?'active':''}\">Vista por OC</button></nav>",
               "      <nav class=\"timeline-tabs\" aria-label=\"Vistas del Timeline COI\"><button type=\"button\" data-timeline-view=\"diaria\" class=\"${state.view==='diaria'?'active':''}\">Vista diaria</button><button type=\"button\" data-timeline-view=\"oc\" class=\"${state.view==='oc'?'active':''}\">Vista por OC</button></nav>",
               'timeline nav')
          once("${state.view==='diaria'?'Movimientos diarios':state.view==='semanal'?'Resumen semanal':'Historial por OC'}",
               "${state.view==='diaria'?'Movimientos diarios':'Historial por OC'}",'timeline heading')
          once("    const events=filteredEvents();\n    let result=dailyMarkup(events);",
               "    if(!['diaria','oc'].includes(state.view))state.view='diaria';\n    const events=filteredEvents();\n    let result=dailyMarkup(events);",
               'timeline view guard')

          # 2) Helpers de Mailing y detección de fecha de Control de Terceros.
          marker='  function eventCard(event,compact){'
          if s.count(marker)!=1:
              raise SystemExit('eventCard marker mismatch')
          helpers=r'''  function isMailEvent(event){
    return fold(event?.tipo_evento)==='mailing'||fold(event?.origen)==='mailing';
  }
  function timelineDateToken(value){
    const raw=text(value);
    if(validDate(raw))return raw;
    const match=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(!match)return '';
    const iso=`${match[3]}-${String(match[2]).padStart(2,'0')}-${String(match[1]).padStart(2,'0')}`;
    return validDate(iso);
  }
  function isControlTercerosEvent(event){
    if(!text(event?.oc))return false;
    const source=fold([event?.origen,event?.tipo_evento,event?.titulo,event?.remitente,event?.descripcion,event?.observaciones].map(text).join(' '));
    return fold(event?.origen)==='control de terceros'||source.includes('control de terceros')||source.includes('control de 3ros')||source.includes('control de 3eros');
  }
  function controlTercerosDateCandidate(event){
    if(!isControlTercerosEvent(event))return '';
    const structured=timelineDateToken(event?.fecha_limite);
    if(structured)return structured;
    const source=[event?.titulo,event?.descripcion,event?.observaciones,event?.accion_pendiente,event?.documentos_mencionados].map(text).filter(Boolean).join(' ');
    const match=source.match(/(?:vigencia\s+)?(?:hasta(?:\s+el)?|vigente\s+hasta(?:\s+el)?|v[áa]lid[oa]\s+hasta(?:\s+el)?|vence(?:\s+el)?|vencimiento(?:\s+el)?)\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}|\d{4}-\d{2}-\d{2})/i);
    return timelineDateToken(match?.[1]||'');
  }
'''
          s=s.replace(marker,helpers+marker,1)

          # 3) En mails no mostrar ponderación de riesgo y ofrecer acción CT cuando corresponda.
          ec_start=s.find('  function eventCard(event,compact){')
          ec_end=s.find('  function dailyMarkup(events){',ec_start)
          if ec_start<0 or ec_end<0:
              raise SystemExit('eventCard block boundaries missing')
          block=s[ec_start:ec_end]
          edit_marker="    const editButton=state.permissions.canWrite?`<button type=\"button\" data-timeline-edit=\"${attr(event.id)}\">Editar</button>`:'';"
          if block.count(edit_marker)!=1:
              raise SystemExit('eventCard edit marker mismatch')
          block=block.replace(edit_marker,r'''    const mailEvent=isMailEvent(event);
    const ctDate=controlTercerosDateCandidate(event);
    const riskBadge=mailEvent?'':`<span class="timeline-badge ${riskClass(event.riesgo)}">Riesgo ${html(event.riesgo)}</span>`;
    const cardRiskClass=mailEvent?'':riskClass(event.riesgo);
    const ctUpdateButton=ctDate&&state.permissions.canWrite?`<button type="button" class="timeline-primary" data-timeline-ct-update="${attr(event.id)}">Actualizar CT hasta ${html(displayDate(ctDate))}</button>`:'';
'''+edit_marker,1)
          if block.count('${riskClass(event.riesgo)}')<2:
              raise SystemExit('eventCard risk tokens missing')
          block=block.replace('class="timeline-event-card ${riskClass(event.riesgo)}"','class="timeline-event-card ${cardRiskClass}"',1)
          block=block.replace('<span class="timeline-badge ${riskClass(event.riesgo)}">Riesgo ${html(event.riesgo)}</span>','${riskBadge}',1)
          block=block.replace('<div class="timeline-event-actions">${orderButton}${link}${editButton}${deleteButton}</div>','<div class="timeline-event-actions">${ctUpdateButton}${orderButton}${link}${editButton}${deleteButton}</div>',1)
          s=s[:ec_start]+block+s[ec_end:]

          # 4) Vista por OC: trazabilidad sin score de riesgo en el encabezado de la cadena.
          oc_start=s.find('  function ocMarkup(events){')
          oc_end=s.find('  function formField(',oc_start)
          if oc_start<0 or oc_end<0:
              raise SystemExit('ocMarkup block boundaries missing')
          block=s[oc_start:oc_end]
          block=block.replace('      const risk=maxRisk(ordered);\n','',1)
          block=block.replace(r' \u00b7 Riesgo m\u00e1ximo: ${html(risk)}','')
          block=block.replace(' · Riesgo máximo: ${html(risk)}','')
          s=s[:oc_start]+block+s[oc_end:]

          # 5) Click del botón CT desde la cadena de mails.
          click_anchor="""      const openOC=target.closest('[data-timeline-open-oc]');
      if(openOC){openOrder(openOC.dataset.timelineOpenOc);return;}
"""
          if s.count(click_anchor)!=1:
              raise SystemExit('Timeline click anchor mismatch')
          click_new=click_anchor+r'''      const ctUpdate=target.closest('[data-timeline-ct-update]');
      if(ctUpdate){
        event.preventDefault();
        const timelineEvent=window.coiTimelineEvents.find(item=>item.id===text(ctUpdate.dataset.timelineCtUpdate));
        const ctDate=controlTercerosDateCandidate(timelineEvent);
        if(!timelineEvent?.oc||!ctDate){alert('No se pudo identificar una OC y una fecha válida de Control de Terceros en este mail.');return;}
        if(typeof window.coiActualizarControlTercerosDesdeTimeline!=='function'){alert('La integración con Control de Terceros todavía no está disponible.');return;}
        if(!window.confirm(`Actualizar Control de Terceros de la OC ${timelineEvent.oc} hasta ${displayDate(ctDate)}?`))return;
        ctUpdate.disabled=true;
        let completed=false;
        try{
          const result=await window.coiActualizarControlTercerosDesdeTimeline(timelineEvent.oc,ctDate);
          completed=true;
          if(ctUpdate.isConnected)ctUpdate.textContent=`CT actualizado hasta ${displayDate(result?.fecha||ctDate)}`;
          alert(`Control de Terceros actualizado en la OC ${result?.nro_oc||timelineEvent.oc} hasta ${displayDate(result?.fecha||ctDate)}.`);
        }catch(error){
          alert(`No se pudo actualizar Control de Terceros en Supabase.\n\n${error?.message||error}`);
        }finally{
          if(ctUpdate.isConnected&&!completed)ctUpdate.disabled=false;
        }
        return;
      }
'''
          s=s.replace(click_anchor,click_new,1)

          # 6) Reutilizar el flujo Supabase-first ya existente de Control de Terceros.
          export_marker='  window.coiR28InjectControlTerceros=injectCT;'
          if s.count(export_marker)!=1:
              raise SystemExit('CT export marker mismatch')
          ct_helper=r'''  async function actualizarControlTercerosDesdeTimeline(nroOC,fechaRaw){
    const oc=findOrder(nroOC);
    if(!oc)throw new Error(`No se encontró la OC ${clean(nroOC)}.`);
    if(!canEdit())throw new Error('Modo consulta: no posee permisos para editar Control de Terceros.');
    let user=null;
    try{user=await getUser();}
    catch(error){throw new Error(`No se pudo validar la sesión de Supabase: ${clean(error?.message||error)}`);}
    if(!user)throw new Error('Debe iniciar sesión en Supabase para editar Control de Terceros.');
    const fecha=fechaISO(fechaRaw);
    if(!fecha)throw new Error('La fecha detectada de Control de Terceros no es válida.');
    const estado=calcularEstadoControlTerceros(fecha).estado;
    const synced=await syncCTSupabase(oc,fecha,estado);
    const persisted=synced.row||{};
    const persistedDate=fechaISO(persisted.control_terceros_hasta)||fecha;
    const persistedStatus=clean(persisted.control_terceros_estado)||estado;
    setCT(oc,persistedDate);
    setMany(oc,CT_STATUS_FIELDS,persistedStatus);
    if(oc._supabaseRaw&&typeof oc._supabaseRaw==='object')Object.assign(oc._supabaseRaw,{control_terceros_hasta:persistedDate,control_terceros_estado:persistedStatus});
    guardarLocal();
    try{if(orderNro(findOrder(currentKey()))===orderNro(oc))injectCT(oc);}catch(e){}
    try{if(typeof window.renderCentroAlertas==='function')window.renderCentroAlertas();}catch(e){}
    return{nro_oc:orderNro(oc),fecha:persistedDate,estado:persistedStatus};
  }
'''
          s=s.replace(export_marker,ct_helper+export_marker,1)
          once('  window.coiR28GuardarControlTerceros=saveCTFromButton;','  window.coiR28GuardarControlTerceros=saveCTFromButton;\n  window.coiActualizarControlTercerosDesdeTimeline=actualizarControlTercerosDesdeTimeline;','CT public API')

          p.write_text(s,encoding='utf-8')
          PY

          cat > tests/timeline_ct_mail_integration.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');
          const SOURCE = fs.readFileSync(path.resolve(__dirname, '..', 'index.html'), 'utf8');
          function between(a,b){const x=SOURCE.indexOf(a),y=SOURCE.indexOf(b,x);if(x<0||y<0)throw new Error(`Bloque no encontrado: ${a}`);return SOURCE.slice(x,y);}

          test('Timeline conserva solo vista diaria y por OC', async () => {
            expect(SOURCE).toContain('data-timeline-view="diaria"');
            expect(SOURCE).toContain('data-timeline-view="oc"');
            expect(SOURCE).not.toContain('data-timeline-view="semanal"');
            expect(SOURCE).not.toContain('function weeklyMarkup(events)');
          });

          test('los mails no muestran ponderación visual de riesgo', async () => {
            const card=between('  function eventCard(event,compact){','  function dailyMarkup(events){');
            const oc=between('  function ocMarkup(events){','  function formField(');
            expect(card).toContain("const mailEvent=isMailEvent(event)");
            expect(card).toContain("const riskBadge=mailEvent?'':");
            expect(card).toContain("const cardRiskClass=mailEvent?'':riskClass(event.riesgo)");
            expect(oc).not.toContain('Riesgo m\\u00e1ximo');
            expect(oc).not.toContain('Riesgo máximo');
          });

          test('mail de Control de Terceros ofrece actualización de fecha', async () => {
            const card=between('  function eventCard(event,compact){','  function dailyMarkup(events){');
            expect(SOURCE).toContain('function controlTercerosDateCandidate(event)');
            expect(SOURCE).toContain("source.includes('control de terceros')");
            expect(SOURCE).toContain('event?.fecha_limite');
            expect(card).toContain('data-timeline-ct-update');
            expect(SOURCE).toContain('Actualizar Control de Terceros de la OC');
          });

          test('actualización CT es Supabase-first y luego refresca cache/UI', async () => {
            const block=between('  async function actualizarControlTercerosDesdeTimeline','  window.coiR28InjectControlTerceros=injectCT;');
            const remote=block.indexOf('await syncCTSupabase(oc,fecha,estado)');
            const cache=block.indexOf('setCT(oc,persistedDate)');
            const local=block.indexOf('guardarLocal()');
            expect(remote).toBeGreaterThan(-1);
            expect(cache).toBeGreaterThan(remote);
            expect(local).toBeGreaterThan(cache);
            expect(SOURCE).toContain('window.coiActualizarControlTercerosDesdeTimeline=actualizarControlTercerosDesdeTimeline');
          });
          JS

      - name: Validate patch syntax and contracts
        run: |
          node --check tests/timeline_ct_mail_integration.spec.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          if(s.includes('data-timeline-view="semanal"'))throw new Error('Vista semanal still present');
          if(!s.includes('data-timeline-ct-update'))throw new Error('CT Timeline action missing');
          if(!s.includes('coiActualizarControlTercerosDesdeTimeline'))throw new Error('CT Supabase helper missing');
          NODE
          node tests/check_baseline.js
      - name: Commit final change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/timeline_ct_mail_integration.spec.js
          git commit -m 'feat: simplify Timeline and link CT mail dates to OC'
          git push
