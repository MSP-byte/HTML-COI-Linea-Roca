name: Finalize final UI
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip final-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obra-resumen-repositorio-supabase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar parche final
        run: node .coi-qa/finalize_final_ui.mjs
      - name: Comprobar sintaxis de tests
        run: node --check tests/obra_resumen_supabase.spec.js
      - name: Commit del producto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/obra_resumen_supabase.spec.js
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "fix: cerrar ficha Obras y legibilidad de alertas [skip final-ui]"
          git push origin HEAD:fix/obra-resumen-repositorio-supabase
