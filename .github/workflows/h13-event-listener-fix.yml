name: H13 event listener fix
on:
  push:
    branches:
      - "fix/h13-ordenes-avance-acta-alertas"
    paths:
      - ".github/workflows/h13-event-listener-fix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h13-ordenes-avance-acta-alertas
          fetch-depth: 0
      - name: Apply patch
        run: python tools/h13_event_listener_fix.py
      - name: Commit patch
        run: |
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git add -A
          git commit -m "fix: use event listeners for H13 Acta retry"
          git push origin HEAD:fix/h13-ordenes-avance-acta-alertas
