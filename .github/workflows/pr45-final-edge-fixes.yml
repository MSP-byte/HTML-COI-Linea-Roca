name: PR45 Final Edge Fixes

on:
  push:
    branches: ["feat/timeline-supabase-first"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true
          fetch-depth: 0

      - name: Apply patch
        run: python3 tests/pr45_final_edge_patch.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'coi-inline-{i}.js'
              p.write_text(script, encoding='utf-8')
              result = subprocess.run(['node', '--check', str(p)], capture_output=True, text=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(f'inline script {i} failed')
          print(f'{len(scripts)} inline scripts OK')
          PY

      - name: Commit final edge fixes
        run: |
          git rm .github/workflows/pr45-final-edge-fixes.yml tests/pr45_final_edge_patch.py
          git add index.html
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git commit -m "fix: close final Timeline Supabase-first edges"
          git push origin HEAD:feat/timeline-supabase-first
