name: PR45 final edge fixes

on:
  push:
    branches:
      - feat/timeline-supabase-first
    paths:
      - '.github/workflows/pr45-final-edge-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timeline-supabase-first
          persist-credentials: true
          fetch-depth: 0

      - name: Apply four final Supabase-first fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)
              print('patched:', label)

          # 1) INITIAL_SESSION sin usuario debe comportarse como SIGNED_OUT.
          old = """      const authEvent=event.detail?.event||'';\n      if(authEvent==='SIGNED_OUT'){"""
          new = """      const authEvent=event.detail?.event||'';\n      const authSession=event.detail?.session||null;\n      if(authEvent==='SIGNED_OUT'||(authEvent==='INITIAL_SESSION'&&!authSession?.user)){"""
          replace_once(old, new, 'initial-session-null')

          # 2) Resolver orden_id solo cuando el OC resuelto coincide exactamente y el ID es UUID real.
          old = """    const order=event.oc?findOrder(event.oc):null;\n    const current=window.coiTimelineEvents.find(item=>item.id===event.id);"""
          new = """    const order=event.oc?findOrder(event.oc):null;\n    const normalizedRequestedOC=text(event.oc).toUpperCase().replace(/[^A-Z0-9]/g,'');\n    const normalizedResolvedOC=text(\n      order?.oc||order?.row?.oc||order?.row?.nro_oc||order?.row?.numeroOC||\n      order?.item?.oc||order?.item?.nro_oc||order?.item?.numeroOC||order?.item?.numero_oc\n    ).toUpperCase().replace(/[^A-Z0-9]/g,'');\n    const resolvedOrderId=text(order?.orderId);\n    const exactOrderId=normalizedRequestedOC&&normalizedResolvedOC===normalizedRequestedOC&&\n      /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(resolvedOrderId)\n      ?resolvedOrderId:null;\n    const current=window.coiTimelineEvents.find(item=>item.id===event.id);"""
          replace_once(old, new, 'exact-oc-uuid')
          replace_once("      orden_id:order?.orderId||null,", "      orden_id:exactOrderId,", 'use-exact-oc-uuid')

          # 3) Contador de mutaciones remotas activas para no reconciliar durante un commit en curso.
          replace_once(
              "  let timelineMutationGeneration=0;",
              "  let timelineMutationGeneration=0;\n  let timelineMutationsInFlight=0;\n  let timelineReconcileTimer=null;",
              'mutation-inflight-state'
          )

          replace_once(
              "    const saved=await upsertTimelineEventsSupabase(client,events);",
              """    timelineMutationsInFlight+=1;\n    let saved;\n    try{saved=await upsertTimelineEventsSupabase(client,events);}\n    finally{timelineMutationsInFlight=Math.max(0,timelineMutationsInFlight-1);}""",
              'track-upsert-flight'
          )

          replace_once(
              "    const {data,error}=await client.rpc('coi_timeline_replace_events',{p_events:payload});",
              """    timelineMutationsInFlight+=1;\n    let replaceResponse;\n    try{replaceResponse=await client.rpc('coi_timeline_replace_events',{p_events:payload});}\n    finally{timelineMutationsInFlight=Math.max(0,timelineMutationsInFlight-1);}\n    const {data,error}=replaceResponse;""",
              'track-replace-flight'
          )

          replace_once(
              "      const {data,error}=await client.rpc('coi_timeline_delete_event',{p_id:id,p_expected_actualizado_en:event.actualizado_en||null});",
              """      timelineMutationsInFlight+=1;\n      let deleteResponse;\n      try{deleteResponse=await client.rpc('coi_timeline_delete_event',{p_id:id,p_expected_actualizado_en:event.actualizado_en||null});}\n      finally{timelineMutationsInFlight=Math.max(0,timelineMutationsInFlight-1);}\n      const {data,error}=deleteResponse;""",
              'track-delete-flight'
          )

          # Reemplazar la función de reconciliación usando balanceo de llaves.
          marker = '  function reconcileTimelineAfterConcurrentMutation(){'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('reconcile function not found')
          brace = text.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(text)):
              ch = text[i]
              if ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('reconcile function closing brace not found')
          replacement = """  function reconcileTimelineAfterConcurrentMutation(){
    const authGeneration=timelineAuthGeneration;
    if(timelineReconcileTimer)clearTimeout(timelineReconcileTimer);
    const attempt=()=>{
      if(authGeneration!==timelineAuthGeneration)return;
      if(timelineMutationsInFlight>0){
        timelineReconcileTimer=setTimeout(attempt,30);
        return;
      }
      const stableGeneration=timelineMutationGeneration;
      timelineReconcileTimer=null;
      timelineLoadPromise=null;
      timelineLoadGeneration=-1;
      timelineLoadMutationGeneration=-1;
      Promise.resolve(loadEvents()).catch(error=>{
        console.warn('Timeline COI: falló la reconciliación posterior a una mutación concurrente.',error);
      }).finally(()=>{
        if(authGeneration!==timelineAuthGeneration)return;
        if(timelineMutationsInFlight>0||timelineMutationGeneration!==stableGeneration){
          timelineReconcileTimer=setTimeout(attempt,30);
        }
      });
    };
    timelineReconcileTimer=setTimeout(attempt,0);
  }"""
          text = text[:start] + replacement + text[end:]
          print('patched: stable-reconcile')

          # 4) El importador maestro no debe escribir datasets canónicos solo en localStorage.
          needle = "backup maestro V58.1"
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit('V58.1 backup importer marker not found')
          start = text.rfind('  function importarBackup(file){', 0, pos)
          if start < 0:
              raise SystemExit('V58.1 importarBackup start not found')
          brace = text.find('{', start)
          depth = 0
          end = None
          in_s = in_d = in_t = False
          esc = False
          for i in range(brace, len(text)):
              ch = text[i]
              if esc:
                  esc = False
                  continue
              if ch == '\\':
                  esc = True
                  continue
              if in_s:
                  if ch == "'": in_s = False
                  continue
              if in_d:
                  if ch == '"': in_d = False
                  continue
              if in_t:
                  if ch == '`': in_t = False
                  continue
              if ch == "'": in_s = True; continue
              if ch == '"': in_d = True; continue
              if ch == '`': in_t = True; continue
              if ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('V58.1 importarBackup closing brace not found')
          replacement = """  function importarBackup(file){
    if(!file)return;
    if(!confirm('Este backup solo restaurará datasets con una ruta autoritativa Supabase disponible. Los datos sin RPC de restore no se escribirán localmente como fuente de verdad. ¿Continuar?'))return;
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data||typeof data!=='object')throw new Error('JSON inválido');
        const timelineKey=window.COI_TIMELINE_COI?.storageKey||'coi_timeline_events_v1';
        let timelineRestored=false;
        if(data.localStorage&&typeof data.localStorage==='object'&&Object.prototype.hasOwnProperty.call(data.localStorage,timelineKey)){
          if(typeof window.COI_TIMELINE_COI?.replace!=='function')throw new Error('La restauración autoritativa de Timeline no está disponible.');
          const raw=data.localStorage[timelineKey];
          const incoming=typeof raw==='string'?JSON.parse(raw):raw;
          if(!Array.isArray(incoming))throw new Error('El Timeline del backup no es una colección válida.');
          await window.COI_TIMELINE_COI.replace(incoming,'Timeline restaurado desde backup maestro V58.1');
          timelineRestored=true;
        }
        const omitted=data.datos&&typeof data.datos==='object'
          ?Object.entries(data.datos).filter(([,value])=>Array.isArray(value)&&value.length).map(([key])=>key)
          :[];
        saveJSONKey(LS_BACKUP_META,{fecha:now(),tipo:'Importado Supabase-first',version:data.version||data.appVersion||VERSION,archivo:file.name,usuario:'Supabase'});
        const detail=[
          timelineRestored?'Timeline restaurado y confirmado en Supabase.':'El archivo no contenía un snapshot Timeline para restaurar.',
          omitted.length?`No se aplicaron localmente datasets canónicos sin RPC de restore: ${omitted.join(', ')}.`:''
        ].filter(Boolean).join(' ');
        toast('Backup procesado',omitted.length||!timelineRestored?'warn':'ok',detail);
        if(timelineRestored)setTimeout(()=>location.reload(),700);
      }catch(e){
        toast('No se pudo importar backup','error',e.message||String(e));
      }
    };
    reader.readAsText(file);
  }"""
          text = text[:start] + replacement + text[end:]
          print('patched: supabase-only-master-restore')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,script in enumerate(scripts,1):
              if not script.strip(): continue
              p=Path(tempfile.gettempdir())/f'coi-inline-{i}.js'
              p.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Inline script {i} syntax failed')
          print(f'{len(scripts)} inline scripts: syntax OK')
          PY

      - name: Commit surgical fixes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pr45-final-edge-fixes.yml
          git add index.html
          git config user.name "MSP-byte"
          git config user.email "mespecial92@gmail.com"
          git commit -m "fix: close final Timeline Supabase-first edges"
          git push origin HEAD:feat/timeline-supabase-first
