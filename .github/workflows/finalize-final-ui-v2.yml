name: Finalize final UI v2
on:
  push:
    branches:
      - fix/obra-resumen-repositorio-supabase
    paths:
      - .coi-qa/finalize.trigger2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obra-resumen-repositorio-supabase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .coi-qa/finalize_final_ui.mjs
      - run: node --check tests/obra_resumen_supabase.spec.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/obra_resumen_supabase.spec.js
          git commit -m "fix: cerrar ficha Obras y Centro de Alertas" || exit 0
          git push origin HEAD:fix/obra-resumen-repositorio-supabase
