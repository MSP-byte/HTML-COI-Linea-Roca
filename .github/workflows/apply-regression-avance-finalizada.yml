name: Apply regression fix avance/finalizada

on:
  push:
    branches:
      - fix/regression-avance-finalizada
    paths:
      - tools/apply_regression_avance_finalizada.js

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused regression patch
        run: node tools/apply_regression_avance_finalizada.js
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: restore manual obra progress on current ficha layout"
          git push
