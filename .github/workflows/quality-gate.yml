name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Calidad estatica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Auditar dependencias (alta o critica)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json 2> audit.err
          audit_status=$?
          set -e

          cat audit.err || true
          cat audit.json || true

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if node -e "const fs=require('fs'); const raw=fs.readFileSync('audit.json','utf8').trim(); if(!raw) process.exit(2); const data=JSON.parse(raw); const v=(data.metadata&&data.metadata.vulnerabilities)||{}; process.exit(((v.high||0)+(v.critical||0))>0?0:1);"; then
            echo "Se detectaron vulnerabilidades altas o criticas."
            exit "$audit_status"
          fi

          if grep -Eqi 'audit endpoint returned an error|Service Unavailable|Bad Request|endpoint is being retired|retired endpoint|Invalid package tree' audit.err audit.json; then
            echo "::warning::El servicio remoto de npm audit fallo. npm ci completo correctamente; se continua con los tests estaticos y Playwright."
            exit 0
          fi

          exit "$audit_status"

      - name: Ejecutar controles estaticos y de regresion
        run: npm test

      - name: Validar espacios y fin de linea
        run: git diff --check

      - name: Comprobar marcadores de conflicto
        run: |
          if grep -En '^[[:space:]]*(<<<<<<<|=======|>>>>>>>)([[:space:]]|$)' index.html; then
            echo "Se encontraron marcadores de conflicto"
            exit 1
          fi

      - name: Comprobar DOCTYPE unico
        run: |
          count=$(grep -Eio '<!doctype[[:space:]]+html[[:space:]]*>' index.html | wc -l)
          echo "DOCTYPE encontrados: $count"
          test "$count" -eq 1

  interaction-smoke:
    name: Interaccion Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: baseline
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar smoke de interaccion
        run: npm run test:e2e

      - name: Publicar evidencia ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
