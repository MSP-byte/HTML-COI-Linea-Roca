name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix-h05-review:
    name: Aplicar fixes review H05
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/h05-unidades-mantenimiento-supabase-first'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rama real
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar reemplazos exactos y regresiones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def reemplazar_unico(texto, viejo, nuevo, etiqueta):
              cantidad = texto.count(viejo)
              if cantidad != 1:
                  raise SystemExit(f'{etiqueta}: se esperaba 1 coincidencia y se encontraron {cantidad}')
              return texto.replace(viejo, nuevo, 1)

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          viejo = """        const crudasST = par.st;
        if (!vigente()) return listaUM();

        const ums = crudasUM.map(desdeSupabaseUM);"""
          nuevo = """        const crudasST = par.st;
        if (!vigente()) return listaUM();

        // La validacion previa evita leer sin perfil, pero el perfil puede ser
        // revocado mientras el scan esta en vuelo. Se reconfirma DESPUES de
        // obtener el par y ANTES de publicarlo como autoritativo: si el rol ya
        // no existe o no puede verificarse, se conserva el ultimo snapshot
        // confirmado y la UI queda fail-closed.
        const perfilPostScan = await rolDeSesion();
        if (!vigente()) return listaUM();
        if (!perfilPostScan.ok) {
          return conservarUltimoConfirmado('No se pudo revalidar el perfil del usuario después de leer el inventario. No se publican datos sin confirmar.');
        }
        if (!perfilPostScan.rol) {
          return conservarUltimoConfirmado('El usuario dejó de tener un perfil activo durante la lectura. Se conservan los últimos datos confirmados.');
        }
        if (vigente()) runtime.rol = perfilPostScan.rol;

        const ums = crudasUM.map(desdeSupabaseUM);"""
          html = reemplazar_unico(html, viejo, nuevo, 'post-scan role guard')

          viejo = """    if (faltan.length) {
      mensajeFormUM('Faltan campos obligatorios: ' + faltan.join(', ') + '.', 'warn');
      return;
    }
    const anterior = umEditandoUuid ? umPorUuid(umEditandoUuid) : null;"""
          nuevo = """    if (faltan.length) {
      mensajeFormUM('Faltan campos obligatorios: ' + faltan.join(', ') + '.', 'warn');
      return;
    }
    if (!claveUM(datos.codigo_um)) {
      mensajeFormUM('El código UM debe contener al menos una letra o un número.', 'warn');
      return;
    }
    const anterior = umEditandoUuid ? umPorUuid(umEditandoUuid) : null;"""
          html = reemplazar_unico(html, viejo, nuevo, 'canonical UM key guard')
          p.write_text(html, encoding='utf-8', newline='\n')

          p = Path('tests/check_h05_um_supabase_first.js')
          static = p.read_text(encoding='utf-8')
          marcador = "console.log('H05/H04 UM y ST Supabase-first: capa verificada contra el esquema real.');"
          bloque = r"""
// G4 · El rol se reconfirma DESPUES del scan y ANTES de publicar el snapshot.
check(cuerpoCargar.indexOf('const perfilPostScan = await rolDeSesion();') >= 0,
  'cargar() debe revalidar el rol despues del scan conjunto');
check(cuerpoCargar.indexOf('const perfilPostScan = await rolDeSesion();') >
      cuerpoCargar.indexOf('const par = await leerParConsistente(c);'),
  'la segunda validacion de rol tiene que ocurrir despues de leer UM+ST');
check(cuerpoCargar.indexOf('const perfilPostScan = await rolDeSesion();') <
      cuerpoCargar.indexOf('runtime.sincronizado = true;'),
  'el rol tiene que revalidarse antes de publicar el snapshot como sincronizado');
check(cuerpoCargar.indexOf('if (!perfilPostScan.ok)') >= 0 &&
      cuerpoCargar.indexOf('if (!perfilPostScan.rol)') >= 0,
  'la revalidacion post-scan tiene que fallar cerrada ante error o perfil revocado');

// G5 · Un codigo UM no puede ser texto visible pero clave canonica vacia.
const cuerpoGuardarUMCanonico = sinComentariosJs(
  cuerpoDeclarado(capa.texto, '  function guardarUM() {', 'guardarUM() de la capa H05'));
check(cuerpoGuardarUMCanonico.indexOf('if (!claveUM(datos.codigo_um))') >= 0,
  'guardarUM() debe rechazar codigos que normalizan a clave vacia');
check(cuerpoGuardarUMCanonico.indexOf('if (!claveUM(datos.codigo_um))') <
      cuerpoGuardarUMCanonico.indexOf('const existente = umPorCodigo(datos.codigo_um);'),
  'la clave UM vacia debe rechazarse antes de consultar duplicados o mutar Supabase');

"""
          if bloque.strip() in static:
              raise SystemExit('static regressions ya estaban presentes inesperadamente')
          static = reemplazar_unico(static, marcador, bloque + marcador, 'static regression marker')
          p.write_text(static, encoding='utf-8', newline='\n')

          p = Path('tests/h05_um_st_supabase_first.spec.js')
          spec = p.read_text(encoding='utf-8')
          if "test('166 ·" in spec or "test('167 ·" in spec:
              raise SystemExit('los casos 166/167 ya estaban presentes inesperadamente')
          spec += r"""

// ================================== decima ronda de review del PR #59

// P2: una revocacion de perfil durante el scan no puede convertir el vacio que
// devuelve RLS en un nuevo snapshot autoritativo. Se parte de una UM confirmada,
// se vacia el fake como haria RLS y se revoca el rol mientras los SELECT estan
// demorados. La revalidacion posterior debe conservar el ultimo confirmado.
test('166 · si el rol se revoca durante el scan no publica un falso inventario vacío', async ({ page }) => {
  await prepararEntorno(page, { ums: [UM_A], sts: [], rol: 'administrador', admin: true });
  await abrir(page);
  const antes = await estado(page);
  expect(antes.sincronizado).toBe(true);
  expect(antes.ums.map((u) => u.codigo)).toContain(UM_A.codigo_um);
  expect(antes.rol).toBe('administrador');

  await page.evaluate(() => {
    window.__H05_SET_UMS__([]);
    window.__H05_SET_STS__([]);
    window.__H05_CFG__.retardoSelectMs = 350;
    window.recargarUnidadesMantenimiento();
  });
  await page.waitForTimeout(100);
  await page.evaluate(() => { window.__H05_CFG__.rol = null; });
  await page.waitForTimeout(1700);

  const e = await estado(page);
  expect(e.sincronizado).toBe(false);
  expect(e.rol).toBeNull();
  expect(e.ums.map((u) => u.codigo)).toContain(UM_A.codigo_um);
  expect(e.escriturasLegacy).toEqual([]);
});

// P2: '-', '///', espacios/puntuacion, etc. pueden ser texto no vacio pero
// claveUM() vacia. Deben detenerse antes de cualquier INSERT remoto.
test('167 · un código UM que normaliza a vacío se rechaza antes de Supabase', async ({ page }) => {
  await prepararEntorno(page, { ums: [], sts: [], rol: 'administrador', admin: true });
  await abrir(page);
  await fijarAdmin(page, true);
  await irAUM(page);

  await page.fill('#umh5_codigo', '///');
  await page.selectOption('#umh5_tipo', 'Ascensor');
  await page.selectOption('#umh5_estacion', { index: 1 });
  await page.selectOption('#umh5_estado', 'ACTIVA');
  await page.click('#btnGuardarUMH05');
  await page.waitForTimeout(300);

  const e = await estado(page);
  expect(soloOp(e, 'insert:coi_unidades_mantenimiento')).toHaveLength(0);
  await expect(page.locator('#umFormMsgH05')).toContainText('al menos una letra o un número');
  expect(e.escriturasLegacy).toEqual([]);
});
"""
          p.write_text(spec, encoding='utf-8', newline='\n')
          PY

      - name: Instalar dependencias
        run: npm ci

      - name: Validar patch antes de publicarlo
        run: |
          node tests/check_h05_um_supabase_first.js
          node --check tests/h05_um_st_supabase_first.spec.js
          npm test
          git diff --check

      - name: Restaurar workflow y publicar commit final
        shell: bash
        run: |
          git show HEAD^:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_h05_um_supabase_first.js tests/h05_um_st_supabase_first.spec.js .github/workflows/quality-gate.yml
          git diff --cached --check
          git commit -m "fix: close H05 role and UM key review gaps"
          git push origin HEAD:fix/h05-unidades-mantenimiento-supabase-first

  baseline:
    name: Calidad estatica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Auditar dependencias (alta o critica)
        run: npm audit --audit-level=high

      - name: Ejecutar controles estaticos y de regresion
        run: npm test

      - name: Validar espacios y fin de linea
        run: git diff --check

      - name: Comprobar marcadores de conflicto
        run: |
          if grep -En '^[[:space:]]*(<<<<<<<|=======|>>>>>>>)([[:space:]]|$)' index.html; then
            echo "Se encontraron marcadores de conflicto"
            exit 1
          fi

      - name: Comprobar DOCTYPE unico
        run: |
          count=$(grep -Eio '<!doctype[[:space:]]+html[[:space:]]*>' index.html | wc -l)
          echo "DOCTYPE encontrados: $count"
          test "$count" -eq 1

  interaction-smoke:
    name: Interaccion Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: baseline
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar smoke de interaccion
        run: npm run test:e2e

      - name: Publicar evidencia ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
