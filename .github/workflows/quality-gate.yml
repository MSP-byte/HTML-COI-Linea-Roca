name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    name: Aplicar fix y validar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node estable
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar corrección de selección
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = 'coi-orders-selection-propagation-fix-v60'

          old_handler_1 = """  document.addEventListener('click',ev=>{\n    const btn=ev.target.closest('[data-open-oc]');\n    if(btn){ ev.preventDefault(); abrirFichaOC(btn.dataset.openOc); }\n  });"""
          new_handler_1 = """  document.addEventListener('click',ev=>{\n    /* coi-orders-selection-propagation-fix-v60: los controles de selección no abren la ficha de la fila. */\n    if(ev.target.closest('#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas')) return;\n    const btn=ev.target.closest('[data-open-oc]');\n    if(btn){ ev.preventDefault(); abrirFichaOC(btn.dataset.openOc); }\n  });"""

          old_handler_2 = """    document.addEventListener('click',ev=>{\n      const oc=ev.target.closest('[data-open-oc]'); if(oc){ev.preventDefault(); ev.stopPropagation(); safeOpenOCFix(oc.dataset.openOc); return;}"""
          new_handler_2 = """    document.addEventListener('click',ev=>{\n      /* coi-orders-selection-propagation-fix-v60: evita que el click del checkbox burbujee como apertura de expediente. */\n      if(ev.target.closest('#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas')) return;\n      const oc=ev.target.closest('[data-open-oc]'); if(oc){ev.preventDefault(); ev.stopPropagation(); safeOpenOCFix(oc.dataset.openOc); return;}"""

          if marker not in text:
              if text.count(old_handler_1) != 1:
                  raise SystemExit(f'Handler histórico inesperado: {text.count(old_handler_1)} coincidencias')
              if text.count(old_handler_2) != 1:
                  raise SystemExit(f'Handler seguro inesperado: {text.count(old_handler_2)} coincidencias')
              text = text.replace(old_handler_1, new_handler_1, 1)
              text = text.replace(old_handler_2, new_handler_2, 1)
              index.write_text(text, encoding='utf-8', newline='')

          Path('tests/check_order_selection.js').write_text("""'use strict';
const assert = require('assert');
const fs = require('fs');
const html = fs.readFileSync('index.html', 'utf8');
const guard = "#vistaOrdenes .col-sel, #vistaOrdenes .orden-check-cell, #vistaOrdenes .chk-orden-row, #vistaOrdenes #chkOrdenesSeleccionarTodas";
assert.strictEqual((html.match(/coi-orders-selection-propagation-fix-v60/g) || []).length, 2);
assert(html.includes("row&&!ev.target.closest('input,button,a,select,textarea,label')"));
assert(html.includes("const chk=ev.target.closest('.chk-orden-row')"));
assert(html.includes("if($('btnBorrarSeleccionadas'))$('btnBorrarSeleccionadas').disabled=!total"));
assert.strictEqual((html.match(/id=\"btnBorrarSeleccionadas\"/g) || []).length, 1);
console.log('OK: selección de órdenes aislada de la apertura de ficha.');
""", encoding='utf-8', newline='')
          PY

      - name: Ejecutar controles existentes
        run: |
          node tests/check_baseline.js
          node tests/check_crud_ordenes.js
          node tests/check_order_selection.js
          git diff --check

      - name: Publicar corrección en la rama
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/check_order_selection.js
          git diff --cached --check
          git commit -m "fix: seleccionar órdenes sin abrir expediente [checkbox-fix-applied]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
