name: H17 Sync Schema Contract

on:
  push:
    branches:
      - feat/h17-carga-certificacion-estructura

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync production schema contract
        run: python .github/scripts/h17_sync_contract.py
      - name: Commit synchronized contract
        shell: bash
        run: |
          if git diff --quiet -- tests/fixtures/production_schema_contract.json; then
            echo "No contract change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/production_schema_contract.json
          git commit -m "test(h17): sync production schema contract"
          git push origin HEAD:feat/h17-carga-certificacion-estructura
