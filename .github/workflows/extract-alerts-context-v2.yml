name: Extract compact alerts context

on:
  push:
    branches: [fix/alerts-collapsible-init-race]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alerts-collapsible-init-race
          persist-credentials: true
      - name: Extract compact source context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          lines = s.splitlines()
          terms = [
            'Alertas de calidad y documentación',
            'calculadas desde Supabase',
            'cliente Supabase no disponible',
            'Modo solo lectura',
            'renderCentroAlertas',
            'consolidateAlertsHeading'
          ]
          out=[]
          used=[]
          for term in terms:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            out.append(f'### {term} | hits={len(hits)}')
            for i in hits[:6]:
              a=max(0,i-14); b=min(len(lines),i+18)
              if any(a>=x and b<=y for x,y in used):
                continue
              used.append((a,b))
              out.append(f'--- lines {a+1}-{b} (hit {i+1}) ---')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('.github/alerts_context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/alerts_context.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture compact alerts context"
          git push origin HEAD:fix/alerts-collapsible-init-race
