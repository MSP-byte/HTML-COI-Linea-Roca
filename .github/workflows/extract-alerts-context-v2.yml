name: Extract compact alerts context

on:
  push:
    branches: [fix/alerts-collapsible-init-race]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alerts-collapsible-init-race
          persist-credentials: true
      - name: Extract targeted source ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          ranges=[(16695,16765),(24515,24690)]
          out=[]
          for a,b in ranges:
            out.append(f'### SOURCE {a}-{b}')
            for n in range(a,b+1):
              if n<=len(lines): out.append(f'{n}: {lines[n-1]}')
          Path('.github/alerts_context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/alerts_context.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture alerts bootstrap context"
          git push origin HEAD:fix/alerts-collapsible-init-race
